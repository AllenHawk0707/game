<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星榆中学 2008 · 一楼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto;background:#0a0a0a}

/* ── 跳脸惊吓效果 ── */
#jumpscare-overlay{
  display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:99999;background:#000;cursor:pointer;
}
#jumpscare-overlay.active{
  display:flex;justify-content:center;align-items:flex-start;
  animation:jitter 0.08s infinite;
}
#jumpscare-flash{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:999999;pointer-events:none;opacity:0;
  background:#fff;
}
#jumpscare-flash.active{
  animation:flashStrobe 0.3s ease-out forwards;
}
@keyframes flashStrobe{
  0%{opacity:0}
  8%{opacity:0.9}
  16%{opacity:0.1}
  25%{opacity:0.8}
  35%{opacity:0}
  50%{opacity:0.7}
  65%{opacity:0.05}
  80%{opacity:0.5}
  100%{opacity:0}
}
#jumpscare-img{
  width:auto;height:auto;
  transform:scale(3);
  animation:zoomPulse 0.06s infinite alternate,imageShake 0.04s infinite;
  filter:contrast(1.3) brightness(1.1);
}
@keyframes jitter{
  0%{transform:translate(0,0)} 25%{transform:translate(-6px,4px)}
  50%{transform:translate(6px,-4px)} 75%{transform:translate(-4px,-6px)}
  100%{transform:translate(4px,6px)}
}
@keyframes zoomPulse{
  from{transform:scale(3)} to{transform:scale(3.36)}
}
@keyframes imageShake{
  0%{filter:contrast(1.3) brightness(1.1) hue-rotate(0deg)}
  50%{filter:contrast(1.5) brightness(1.3) hue-rotate(10deg) saturate(2)}
  100%{filter:contrast(1.3) brightness(1.1) hue-rotate(-5deg) saturate(1.5)}
}
</style>
</head>

<canvas id="c"></canvas>
<div id="jumpscare-overlay"><div id="jumpscare-flash"></div><img id="jumpscare-img" src="goast.png" alt=""></div>

// ── Collision ──
function collides(rx,ry,rw,rh){
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(rx<w.x+w.w && rx+rw>w.x && ry<w.y+w.h && ry+rh>w.y) return true;
  }
  // Also check building bounds
  if(rx<B.L || rx+rw>B.R) return true;
  if(ry<B.T || ry+rh>B.B) return true;
  return false;
}

function inDoor(px,py,door){
  return px+player.w/2 >= door.x && px+player.w/2 <= door.x+door.w &&
         py+player.h   >= door.y && py              <= door.y+door.h;
}

function nearZone(px,py,zone){
  var cx=px+player.w/2, cy=py+player.h/2;
  var zcx=zone.x+zone.w/2, zcy=zone.y+zone.h/2;
  var dx=Math.abs(cx-zcx), dy=Math.abs(cy-zcy);
  return dx<zone.w/2+20 && dy<zone.h/2+30;
}

var computerBusy = false;   // 防止电脑交互在跳转延迟内被重复触发
function handleInteraction(hint){
  if(hint.type==='password'){
    // 追逐战拉完4闸后回到一楼，大门密码自动失效：直接开门 → 好结局
    if(hint.id==='gate'){
      var chaseSolved=false;
      var visitedMap8=false;
      try{ chaseSolved=sessionStorage.getItem('xyzh_chase_solved')==='1'; }catch(e){}
      try{ visitedMap8=sessionStorage.getItem('visitedMap8')==='1'; }catch(e){}
    if(chaseSolved){
      // 立即取消追逐战并跳转，不留任何延迟
      try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
      if(typeof BGM!=='undefined' && BGM.stopChase) BGM.stopChase();
      if(typeof BGM!=='undefined') BGM.tryPlaySwitchSound();
      // 移除大门（墙体+门），防止继续交互
      for(var i=walls.length-1;i>=0;i--){
        if(walls[i].y===B.B-4 && (walls[i].x===B.L || walls[i].x===gateX+gateW)){
          walls.splice(i,1);
        }
      }
      for(var i=doors.length-1;i>=0;i--){
        if(doors[i].id==='gate'){ doors.splice(i,1); break; }
      }
      for(var i=interactZones.length-1;i>=0;i--){
        if(interactZones[i].id==='gate'){ interactZones.splice(i,1); break; }
      }
      gateLocked=false;
      // 进入过 map8 → 彩蛋结局；否则（如 mp5 追逐后）→ 好结局
      if(visitedMap8){
        go('egg_ending.html');
      }else{
        go('good_ending.html');
      }
      return;
    }
    }
    openPwDialog(hint.id, hint.pw, hint.docId);
  }else if(hint.type==='doc'){
    if(hint.id==='side_breaker'){
      var bp=false, rp=false;
      try{ bp=sessionStorage.getItem('breakerOff')==='1'; }catch(e){}
      if(bp){
        // 已拉下电闸
        try{ rp=sessionStorage.getItem('redPressed')==='1'; }catch(e){}

          try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
          BGM.tryPlaySwitchSound();
          go('good_ending.html');
          return;
        }else{
          // 已拉闸但未按红色按钮，直接出去 → 坏结局
          try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
          BGM.tryPlaySwitchSound();
          go('bad_ending.html');
          return;
        }
      }
    }
    var d=docs[hint.docId];
    if(d) {
      if(hint.id==='doc_archive'){
        archiveState='choice';
        openDialog('档案储物间 — 学生处分记录','你在处分记录本的夹层里发现一叠被撕下的纸页。\n纸页标题是《不为人知的真相····？》。\n\n是否将学校论坛归档？');
      }else if(hint.id==='room_101'){
        openDialog(d.title, d.text); dialog.special='room101'; BGM.tryPlaySwitchSound();
      }else{
        openDialog(d.title, d.text); BGM.tryPlaySwitchSound();
      }
    }
  }else if(hint.type==='computer'){
    if(computerBusy) return;          // 已在处理中，忽略重复触发
    computerBusy = true;
    BGM.playComputer();               // 先播放电脑音效
    sessionStorage.setItem('mapReturn','102');
    // 延迟跳转，确保电脑音效能完整播完再进入电脑页（避免页面瞬间卸载掐断声音）
    setTimeout(function(){ go('forum.html'); }, 1200);
    return;
  }else if(hint.type==='stairs'){
    if(chaser){
      // 追逐中：取消黑屏间隔，立即上楼并保持黑影连续
      saveChaserRel();
      sessionStorage.setItem('mapReturn','stairs');
      go('map2.html');
    }else{
      BGM.playStair(function(){
        sessionStorage.setItem('mapReturn','stairs');
        go('map2.html');
      });
    }
  }else if(hint.type==='sideStairs'){
    // 侧门通道 → 地下配电迷宫：需先按下生化实验室的红色按钮
    var rp=false;
    try{ rp=sessionStorage.getItem('redPressed')==='1'; }catch(e){}
    if(!rp){
      tip('这个应急配电室好像只有在生化实验室的红色按钮被按下后才会紧急开启入口·····');
      return;
    }
    // 追逐战路径必须瞬间跳转：不播下楼过渡音效，直接跳到 mp5
    // 不在此处存检查点：保留 map3 交互实验室时的检查点，mp5 死亡后回到 map3
    try{ BGM.tryPlaySwitchSound(); }catch(e){}
    go('mp5.html');
  }else if(hint.id==='room_103'){
    var d=docs.room103;
    if(d) { openDialog(d.title, d.text); dialog.special='room103'; BGM.tryPlaySwitchSound(); }
  }else if(hint.id==='redBottle'){
    bottleState='choice';
    openDialog('红色药瓶','你捡起一瓶红色药剂。\n王伯的笔记警告过：绝对不要触碰医务室红色瓶装药剂，接触会加重幻觉缠身。\n\n是否要吞服红色药物？');
    BGM.tryPlaySwitchSound();
  }else if(hint.id==='exit_side'){
    tip('室外通道暂时无法通行');
  }
}

function findInteraction(){
  interactionHint=null;
  // Check red bottle first (highest priority)
  if(redBottle){
    var cx=player.x+player.w/2, cy=player.y+player.h/2;
    var bx=redBottle.x+4, by=redBottle.y+7;
    if(Math.abs(cx-bx)<16 && Math.abs(cy-by)<16){
      interactionHint={id:'redBottle',label:'红色药瓶',type:'bottle'};
      return;
    }
  }
  // Check doors
  for(var i=0;i<doors.length;i++){
    var d=doors[i];
    if(inDoor(player.x,player.y,d)){
      interactionHint=d;
      return;
    }
  }
  // Check interact zones
  for(var i=0;i<interactZones.length;i++){
    var z=interactZones[i];
    if(nearZone(player.x,player.y,z)){
      interactionHint=z;
      return;
    }
  }
}

var jumpscareBuffer=null;
(function preloadJumpscare(){
  try{
    var req=new XMLHttpRequest();
    req.open('GET','惨叫女鬼叫_爱给网_aigei_com.mp3',true);
    req.responseType='arraybuffer';
    req.onload=function(){
      if(req.status===200||req.status===0){
        (new(window.AudioContext||window.webkitAudioContext)()).decodeAudioData(
          req.response,
          function(buf){ jumpscareBuffer=buf; },
          function(){}
        );
      }
    };
    req.send();
  }catch(e){}
})();

function playJumpscareSound(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    if(jumpscareBuffer){
      var src=ctx.createBufferSource();
      src.buffer=jumpscareBuffer;
      var gain=ctx.createGain();
      gain.gain.value=1.0;
      src.connect(gain);
      gain.connect(ctx.destination);
      src.start(0);
    }else{
      // 预加载未完成时fallback
      var audio=new Audio('惨叫女鬼叫_爱给网_aigei_com.mp3');
      audio.volume=1.0;
      audio.play().catch(function(){});
    }
  }catch(e){}
}

function tip(msg){ tipText=msg; tipTimer=90; }

// ── Update ──
function update(){
  if(typeof GameTime!=='undefined') GameTime.tick();
  if(caughtDeath){
    if(caughtTimer>0) caughtTimer--;
    if(caughtTimer<=0){
      // 有存档时不自动跳转，留在死亡画面让玩家选择回档
      if(typeof SaveSystem!=='undefined' && SaveSystem.getSaves && SaveSystem.getSaves().length>0){
        if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
      }else{
        go('start.html');
      }
    }
    return;
  }
  // Movement
  var mx=0,my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;

  if(mx!==0&&my!==0){ mx*=0.707;my*=0.707; }

  var moving=mx!==0||my!==0;

  if(moving){
    // Try move X
    var nx=player.x+mx*player.speed;
    if(!collides(nx,player.y,player.w,player.h)) player.x=nx;
    // Try move Y
    var ny=player.y+my*player.speed;
    if(!collides(player.x,ny,player.w,player.h)) player.y=ny;

    // Facing
    if(Math.abs(mx)>Math.abs(my)){ player.facing=mx>0?3:2; }
    else if(my!==0){ player.facing=my>0?0:1; }
    player.walkTimer++;
    if(player.walkTimer>12){ player.frame=(player.frame+1)%2; player.walkTimer=0; }
    
    Footsteps.update(true, player.walkTimer);
  }else{
    player.frame=0;
    player.walkTimer=0;
    
    Footsteps.update(false, 0);
  }

  // Check interactions
  findInteraction();
  updateChaser();


  // Tip timer
  if(tipTimer>0) tipTimer--;
  if(tipTimer<=0) tipText='';

  // Screen shake
  if(screenShake>0 && !shakePermanent) screenShake--;
  if(shakePermanent && screenShake<20) screenShake=30; // 持续抽搐

  // Fast shadow spawn / move / despawn
  if(fastShadow){
    fastShadow.x+=fastShadow.vx;
    fastShadow.y+=fastShadow.vy;
    fastShadow.timer--;
    // Clamp within building bounds
    if(fastShadow.x<B.L){ fastShadow.x=B.L; fastShadow.vx*=-1; }
    if(fastShadow.x+fastShadow.w>B.R){ fastShadow.x=B.R-fastShadow.w; fastShadow.vx*=-1; }
    if(fastShadow.y<B.T){ fastShadow.y=B.T; fastShadow.vy*=-1; }
    if(fastShadow.y+fastShadow.h>B.B){ fastShadow.y=B.B-fastShadow.h; fastShadow.vy*=-1; }
    if(fastShadow.timer<=0) fastShadow=null;
  }else if(fastShadowCooldown>0){
    fastShadowCooldown--;
  }else{
    fastShadowCooldown=Math.floor(Math.random()*(25200-18000+1))+18000;
    // 5~7分钟必定生成黑影（不再有 5% 随机概率）
    var sx,sy;
    var side=Math.floor(Math.random()*4);
    if(side===0){ sx=B.L; sy=B.T+Math.random()*(B.B-B.T-24); }
    else if(side===1){ sx=B.R-18; sy=B.T+Math.random()*(B.B-B.T-24); }
    else if(side===2){ sx=B.L+Math.random()*(B.R-B.L-18); sy=B.T; }
    else{ sx=B.L+Math.random()*(B.R-B.L-18); sy=B.B-24; }
    var angle=Math.random()*Math.PI*2;
    var speed=9+Math.random()*6; // 3倍速
    fastShadow={x:sx,y:sy,w:18,h:24,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,timer:120}; // 2秒
  }
}

// ── Draw ──
function pxRect(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h));
}

function pxText(text,x,y,c,size,align){
  ctx.fillStyle=c||P.TEXT;
  ctx.font=(size||12)+'px "Courier New","SimSun",monospace';
  ctx.textAlign=align||'left';
  ctx.textBaseline='top';
  ctx.fillText(text,x,y);
}

function drawBorder(x,y,w,h,c,t){
  t=t||2;
  pxRect(x,y,w,t,c); pxRect(x,y+h-t,w,t,c);
  pxRect(x,y,t,h,c);   pxRect(x+w-t,y,t,h,c);
}

// Draw pixel character
function drawPlayer(px,py){
  var ox=Math.floor(px);
  var oy=Math.floor(py);
  var pw=12,ph=18;
  var f=player.facing; // 0=down 1=up 2=left 3=right

  // Shadow
  pxRect(ox+2,oy+ph-2,10,2,'rgba(0,0,0,0.5)');

  // Legs
  var legOff=player.frame*2;
  if(f===0){ // facing down
    pxRect(ox+2,oy+11,3,5,P.PLAYER); // left leg
    pxRect(ox+7,oy+11,3,5,P.PLAYER); // right leg
    if(player.frame===0){ pxRect(ox+2,oy+13+legOff,3,3,'#444'); pxRect(ox+7,oy+13-legOff,3,3,'#444'); }
    else { pxRect(ox+2,oy+13-legOff,3,3,'#444'); pxRect(ox+7,oy+13+legOff,3,3,'#444'); }
  }else if(f===1){ // facing up
    pxRect(ox+2,oy+11,3,5,P.PLAYER);
    pxRect(ox+7,oy+11,3,5,P.PLAYER);
  }else{ // side
    pxRect(ox+2,oy+11,3,5,P.PLAYER);
    pxRect(ox+7,oy+11,3,5,P.PLAYER);
    if(player.frame===0) pxRect(ox+2,oy+13+legOff,3,3,'#444');
    else pxRect(ox+7,oy+13+legOff,3,3,'#444');
  }

  // Body
  pxRect(ox+2,oy+6,8,7,'#777');
  pxRect(ox+3,oy+6,6,7,P.PLAYER);

  // Arms
  if(f===2){ pxRect(ox,oy+7,3,4,P.PLAYER); } // left
  else if(f===3){ pxRect(ox+9,oy+7,3,4,P.PLAYER); } // right
  else{ pxRect(ox,oy+7,3,4,P.PLAYER); pxRect(ox+9,oy+7,3,4,P.PLAYER); }

  // Head
  pxRect(ox+3,oy,6,7,P.PLAYER2);
  pxRect(ox+4,oy+1,4,5,'#ddd');
  // Eyes
  if(f===0){ pxRect(ox+5,oy+3,1,1,'#222');pxRect(ox+8,oy+3,1,1,'#222'); }
  else if(f===1){ pxRect(ox+5,oy+2,1,1,'#222');pxRect(ox+8,oy+2,1,1,'#222'); }
  else if(f===2){ pxRect(ox+4,oy+3,1,1,'#222'); }
  else{ pxRect(ox+9,oy+3,1,1,'#222'); }
  // Hair
  pxRect(ox+3,oy,6,2,'#555');
}

// Draw door on walls
function drawDoor(d){
  var highlight=interactionHint&&interactionHint===d;
  var dc=highlight?P.INTERACT:P.DOOR;
  if(d.id==='gate' && gateLocked){
    // metal gate bars
    pxRect(d.x,d.y,d.w,d.h,'#2a2a2a');
    var barW=4, gap=(d.w-barW*4)/3;
    for(var i=0;i<4;i++){
      pxRect(d.x+i*(barW+gap),d.y,barW,d.h,'#555');
    }
    if(highlight){
      var t=Math.sin(Date.now()*0.005)*0.3+0.5;
      drawBorder(d.x-2,d.y-2,d.w+4,d.h+4,'rgba(255,255,255,'+t+')',1);
    }
    return;
  }
  pxRect(d.x,d.y,d.w,d.h,dc);
  if(highlight){
    // Pulsing border
    var t=Math.sin(Date.now()*0.005)*0.3+0.5;
    drawBorder(d.x-2,d.y-2,d.w+4,d.h+4,'rgba(255,255,255,'+t+')',1);
  }
}

// Draw pixel item (for room decorations)
// 追逐黑影：伸长的暗色人形，带微弱红光描边
// 腐化学生黑影模型：三头、四十五臂、独腿；多色腐烂细节 + 走路动画，尺寸与行为逻辑不变
function drawCorruptedStudent(c, x, y, w, h, alpha){
  alpha = (alpha==null) ? 1 : alpha;
  // 走路动画相位（持续缓步移动，营造活物感）
  var walk = Date.now()*0.011;
  var bob  = Math.sin(walk)*1.6;        // 身体上下起伏
  var lurch= Math.sin(walk*0.5)*0.8;    // 身体左右轻晃
  var xb = x + lurch, yb = y + bob;
  var cx = xb + w/2, cy = yb + h*0.5;
  function col(hex,a){ if(alpha>=1) return hex; var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+(a*alpha)+')'; }
  // 躯干：腐烂紫红肉体 + 病态绿斑 + 腐肉红
  pxRect(xb+2, yb+5, w-4, h-5, col('#1c0b16',1));
  pxRect(xb+4, yb+8, w-8, h-10, col('#3a1226',1));
  pxRect(xb+5, yb+11, 3, 5, col('#54603a',1));
  pxRect(xb+w-7, yb+13, 3, 4, col('#6b2a2a',1));
  // 下半身：3 条腿在下方统一绘制
  // 三颗头：随身体起伏晃动 + 异色眼（红/黄/青）
  var heads=[xb+1, xb+w/2-2, xb+w-6];
  var eyeColors=['#d11010','#e8d020','#2fd6c8'];
  for(var hi=0; hi<3; hi++){
    var hx=heads[hi];
    pxRect(hx, yb-6, 5, 9, col('#39342c',1));
    pxRect(hx+1, yb-5, 3, 5, col('#4a5a3a',1));
    pxRect(hx+1, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+3, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+2, yb-2, 1, 2, col('#7a1a1a',1));
  }
  // 下半身：3 条腿，随走路交替前后摆动（不再用放射触肢）
  var legCols=['#5a5248','#4a4038','#5a5248'];
  c.save();
  c.lineWidth=2;
  var legTop = yb + h - 2;
  var legXs = [xb+3, xb+w/2, xb+w-4];
  for(var li=0; li<3; li++){
    var sw = Math.sin(walk*0.8 + li*2.1)*2.2;   // 交替摆腿
    c.strokeStyle = col(legCols[li],1);
    c.beginPath();
    c.moveTo(legXs[li], legTop);
    c.lineTo(legXs[li]+sw, legTop+7);
    c.stroke();
    pxRect(legXs[li]+sw-2, legTop+7, 5, 1, col(legCols[li],1)); // 脚掌
  }
  c.restore();
  // 上端血盆大口（随走路张合）
  var gape = 2 + Math.abs(Math.sin(walk*0.7))*3;
  var mx = cx, my = yb - 7;
  pxRect(mx-6, my-gape, 12, gape*2+3, col('#3a0808',1));    // 大口外肉
  pxRect(mx-5, my-gape+1, 10, gape*2+1, col('#150202',1));  // 口内深渊
  for(var ti=0; ti<6; ti++){ pxRect(mx-5+ti*2, my-gape+1, 1, 2+(ti%2), col('#e8e0d0',1)); }   // 上排尖牙
  for(var tj=0; tj<6; tj++){ pxRect(mx-5+tj*2, my+gape, 1, 2+((tj+1)%2), col('#d8cfc0',1)); }  // 下排尖牙
  pxRect(mx-6, my+gape+1, 1, 4, col('#8a0d0d',1));          // 口角滴血
  pxRect(mx+5, my+gape, 1, 3, col('#8a0d0d',1));
  // 血滴（躯干，随身体）
  pxRect(xb+3, yb+h-3, 1, 3, col('#8a0d0d',1));
  pxRect(xb+w-4, yb+h-4, 1, 4, col('#8a0d0d',1));
}
function drawChaser(){
  if(!chaser) return;
  drawCorruptedStudent(ctx, chaser.x, chaser.y, chaser.w, chaser.h);
}

// 黑影追逐：无视地图碰撞，速度略慢于主角，抓捕即死
function updateChaser(){
  if(!chaser) return;
  if(chaserDelay>0){ chaserDelay--; return; } // 延迟期间静止
  var ps=player.speed*CHASE_CHASER_RATIO;
  var pcx=player.x+player.w/2, pcy=player.y+player.h/2;
  var ccx=chaser.x+chaser.w/2, ccy=chaser.y+chaser.h/2;
  var dx=pcx-ccx, dy=pcy-ccy;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>0){ chaser.vx=dx/dist*ps; chaser.vy=dy/dist*ps; }
  chaser.x+=chaser.vx; chaser.y+=chaser.vy;
  if(chaser.x<player.x+player.w && chaser.x+chaser.w>player.x &&
     chaser.y<player.y+player.h && chaser.y+chaser.h>player.y){
    triggerChaserDeath();
  }
}

// 被黑影追上：定格、浮现红色大字"你死了"，存档后返回标题
var caughtDeath=false;        // 被黑影追上：浮现"你死了"后跳转
var caughtTimer=0;            // 定格倒计时（帧）
function triggerChaserDeath(){
  if(caughtDeath) return;
  caughtDeath=true;
  playerDead=true;
  try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
  if(chaser){ chaser.x=player.x+player.w/2-chaser.w/2; chaser.y=player.y+player.h/2-chaser.h/2+8; deathChaserSnap={x:chaser.x,y:chaser.y,w:chaser.w,h:chaser.h}; }
  biteStart=Date.now(); goreSpawned=false;
  // 不再 saveCurrent（避免覆盖追逐战前的检查点存档）
  // 显示「回到上一个存档点」按钮（若有检查点）
  if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
  caughtTimer=270; // 约 4.5 秒后跳转（含抱住+啃头动画）
}

// ── 死亡动画：黑影咬下玩家头 + 血液四溅 ──
var biteStart=0, severedHead=null, bloodParts=[], deathChaserSnap=null, goreSpawned=false;
function spawnDeathGore(){
  var hx=player.x+player.w/2, hy=player.y+3;
  severedHead={x:hx,y:hy,vx:(Math.random()-0.5)*1.6,vy:-2.2-Math.random()*1.2,rot:0,vrot:(Math.random()-0.5)*0.35};
  bloodParts=[];
  for(var bi=0;bi<48;bi++){
    var ang=Math.random()*Math.PI*2, sp=1+Math.random()*4.5;
    bloodParts.push({x:hx+(Math.random()-0.5)*5,y:hy+(Math.random()-0.5)*5,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:28+Math.random()*34,sz:1+Math.random()*2});
  }
}
function drawDeathAnim(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  // 阶段一：怪兽抱住玩家（收拢 + 挣扎晃动），暂不啃头
  if(el<1500){
    if(deathChaserSnap){
      var prog=el/1500;
      var shk=Math.sin(el*0.05)*2.4*(1-prog*0.55);
      var gx=deathChaserSnap.x+shk, gy=deathChaserSnap.y+Math.sin(el*0.033)*1.3;
      drawCorruptedStudent(ctx, gx, gy, deathChaserSnap.w, deathChaserSnap.h);
      // 环抱手臂横贯玩家身体，随挣扎逐渐收紧
      var ay=player.y+player.h*0.42, aw=deathChaserSnap.w+6-prog*3;
      pxRect(deathChaserSnap.x-3+shk, ay,   aw, 3, '#2e2822');
      pxRect(deathChaserSnap.x-3+shk, ay+4, aw, 2, '#241f1a');
    }
    return;
  }
  // 阶段二：啃下头（首次进入触发一次喷血）
  if(!goreSpawned){ spawnDeathGore(); goreSpawned=true; }
  if(severedHead){
    severedHead.x+=severedHead.vx; severedHead.y+=severedHead.vy;
    severedHead.vy+=0.18; severedHead.rot+=severedHead.vrot;
    if(severedHead.y>player.y+player.h+40) severedHead=null;
  }
  for(var i=bloodParts.length-1;i>=0;i--){
    var p=bloodParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if(p.life<=0) bloodParts.splice(i,1);
  }
  if(!chaser && deathChaserSnap) drawCorruptedStudent(ctx, deathChaserSnap.x, deathChaserSnap.y, deathChaserSnap.w, deathChaserSnap.h);
  if(severedHead){
    ctx.save();
    ctx.translate(severedHead.x,severedHead.y);
    ctx.rotate(severedHead.rot);
    pxRect(-3,-3,6,7,'#d9cfc4');
    pxRect(-2,-2,4,5,'#b89a86');
    pxRect(-2,-1,1,1,'#222'); pxRect(1,-1,1,1,'#222');
    pxRect(-2,2,4,1,'#5a1010');
    pxRect(-3,3,6,2,'#9a0d0d');
    ctx.restore();
  }
  for(var j=0;j<bloodParts.length;j++){
    var q=bloodParts[j];
    pxRect(q.x,q.y,q.sz,q.sz,'#a00d0d');
  }
}
function drawChaserDeath(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  if(el<3000){ pxRect(0,0,W,H,'rgba(0,0,0,0.25)'); return; }
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  var t=110-caughtTimer;
  var a=Math.min(1,t/25);            // 渐显
  pxRect(0,0,W,H,'rgba(0,0,0,'+(0.55+0.4*a)+')');
  ctx.fillStyle='rgba(210,0,0,'+a+')';
  ctx.font='bold 60px "Courier New","SimSun",monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('你死了',W/2,H/2);
  ctx.restore();
}

// 101教室 — 黑板 + 黑板正上方的挂钟（对话框内自定义画面）
function drawRoom101Scene(dx,dy,dw,dh){
  // 老式挂钟（黑板正上方，指针停摆）
  var cx=dx+dw/2, cy=dy+56, r=20;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#0d0d0d'; ctx.fill();
  ctx.strokeStyle='#7a7a66'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='#8a8a78'; ctx.lineWidth=1;
  for(var k=0;k<12;k++){
    var a=k/12*Math.PI*2;
    var x1=cx+Math.sin(a)*(r-3), y1=cy-Math.cos(a)*(r-3);
    var x2=cx+Math.sin(a)*(r-1), y2=cy-Math.cos(a)*(r-1);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  // 指针（停摆：时针指在 6，分针指在 2）
  var ha=(6/12)*Math.PI*2, ma=(10/60)*Math.PI*2;
  ctx.strokeStyle='#cfcfcf'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(ha)*(r-7), cy-Math.cos(ha)*(r-7)); ctx.stroke();
  ctx.strokeStyle='#9a9a88'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(ma)*(r-3), cy-Math.cos(ma)*(r-3)); ctx.stroke();
  ctx.fillStyle='#cfcfcf'; ctx.beginPath(); ctx.arc(cx,cy,2,0,Math.PI*2); ctx.fill();

  // 黑板（下方）—— 破旧质感，整体向右微倾
  var bx=dx+50, by=dy+90, bw=dw-100, bh=130;
  var bcx=bx+bw/2, bcy=by+bh/2;
  ctx.save();
  ctx.translate(bcx,bcy); ctx.rotate(0.075); ctx.translate(-bcx,-bcy); // 斜向右
  // 板面底色（斑驳：多处深浅不一的粉笔灰痕）
  pxRect(bx,by,bw,bh,'#10160f');
  // 旧粉笔灰雾
  ctx.fillStyle='rgba(120,130,110,0.06)';
  for(var s=0;s<5;s++){ ctx.fillRect(bx+8+s*((bw-16)/5), by+14+((s*37)%90), 60, 26); }
  // 大块擦不干净的旧字迹
  ctx.fillStyle='rgba(150,160,140,0.05)';
  ctx.fillRect(bx+30, by+46, 90, 40);
  ctx.fillRect(bx+bw-120, by+70, 70, 30);
  // 划痕 / 裂纹
  ctx.strokeStyle='rgba(70,70,60,0.5)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(bx+12,by+18); ctx.lineTo(bx+40,by+64);
  ctx.moveTo(bx+bw-20,by+30); ctx.lineTo(bx+bw-70,by+100);
  ctx.moveTo(bx+60,by+bh-10); ctx.lineTo(bx+110,by+22);
  ctx.moveTo(bx+bw-40,by+bh-6); ctx.lineTo(bx+bw-90,by+40);
  ctx.stroke();
  // 缺角（黑板被磕掉一块）
  pxRect(bx+bw-14,by+bh-14,14,14,'#0a0a0a');
  // 边框（朽木，深浅不均）
  drawBorder(bx,by,bw,bh,'#3a2a18',4);
  ctx.strokeStyle='rgba(90,70,40,0.6)'; ctx.lineWidth=1;
  ctx.strokeRect(bx+2,by+2,bw-4,bh-4);

  // 粉笔字 0 5 7 1：手写体；5 和 1 划掉（更明显），其余正常
  var handFont='bold 44px "Ink Free","Comic Sans MS","Segoe Script","华文行楷","KaiTi",cursive';
  var digits=['0','5','7','1'];
  var crossed=[false,true,false,true];
  var jit=[0,4,-3,2];                       // 轻微抖动，更像手写
  var gap=bw/5;
  for(var i=0;i<4;i++){
    var dxx=bx+gap*(i+1)+jit[i];
    ctx.save();
    ctx.font=handFont;
    ctx.fillStyle='#e3ebdc';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(digits[i], dxx, by+36+(i%2?3:0));
    ctx.restore();
    if(crossed[i]){
      // 划掉：又粗又明显的红色粉笔交叉斜线盖在字上
      ctx.save();
      ctx.strokeStyle='#c33a2a'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(dxx-16,by+38); ctx.lineTo(dxx+16,by+92);
      ctx.moveTo(dxx+16,by+38); ctx.lineTo(dxx-16,by+92);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore(); // 结束黑板倾斜

  pxText('黑板正上方挂着一只老式挂钟，指针早已停摆', dx+dw/2, by+bh+16, '#9a8a6a', 10, 'center');
}

function drawItem(x,y,type){
  if(type==='desk'){ pxRect(x,y,12,6,'#2a2a2a'); pxRect(x-2,y+6,16,2,'#222'); }
  else if(type==='chair'){ pxRect(x,y,8,8,'#222');pxRect(x+2,y-2,4,2,'#222'); }
  else if(type==='plant'){ pxRect(x,y,6,10,'#1a2a1a');pxRect(x-1,y,8,4,'#1a301a'); }
  else if(type==='board'){ drawBorder(x,y,20,12,'#3a3a30',1);pxRect(x+2,y+2,16,8,'#1a1a18');pxText('公 告',x+10,y+4,'#555',7,'center'); }
  else if(type==='locker'){ pxRect(x,y,8,14,'#222');drawBorder(x,y,8,14,'#333',1);pxRect(x+4,y+4,2,2,'#444'); }
}

// ── Render ──
function render(){
  ctx.clearRect(0,0,W,H);

  var sx=screenShake>0?(Math.random()-0.5)*screenShake:0;
  var sy=screenShake>0?(Math.random()-0.5)*screenShake:0;
  ctx.save();
  ctx.translate(sx,sy);

  // Floor
  pxRect(B.L,B.T,B.R-B.L,B.B-B.T,P.FLOOR);

  // Draw rooms - Top row
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    var color=P.ROOM;
    if(c.td==='pwd_jiaowu') color=jiaowuUnlocked?'#141a14':'#1c1810';
    else if(c.td==='pwd_monitor') color=monitorUnlocked?'#141a14':'#101418';
    if(c.bp){
      drawRoom(c.x,roomTopY,c.w,roomTopH+gapH+roomBotH,c.t||c.b,color);
    }else{
      drawRoom(c.x,roomTopY,c.w,roomTopH,c.t,color);
    }
  }

  // Corridor
  pxRect(B.L,gapY,B.R-B.L,gapH,P.CORR);

  pxText('走  廊',B.L+CW/2,gapY+gapH/2-6,'#888',9,'center');

  // Bottom rooms
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    if(c.bp) continue; // already drawn spanning
    var color=P.ROOM;
    if(c.bd==='doc_archive') color='#141a14';
    else if(c.bd==='doc_wang') color='#141a14';
    else if(i===0) color='#181818'; // 102 with computer
    drawRoom(c.x,roomBotY,c.w,roomBotH,c.b,color);
  }

  // Hall

  pxText('一  楼  大  厅',B.L+CW/2,hallY+hallH/2-7,'#aaa',12,'center');

  // Draw doors
  for(var i=0;i<doors.length;i++) drawDoor(doors[i]);

    var c=cols[i];
    if(!c.bp){
      var lc=c.td==='pwd_jiaowu'?(jiaowuUnlocked?'#6a8a6a':'#9a8a5a'):
              c.td==='pwd_monitor'?(monitorUnlocked?'#6a8a6a':'#6a7a9a'):'#aaa';

      pxText(c.t,c.x+c.w/2,roomTopY+13,lc,11,'center');
    }
    if(!c.bp && c.b){
      var lc2=c.bd==='doc_archive'?'#6a8a6a':c.bd==='doc_wang'?'#6a8a6a':'#aaa';
      pxText(c.b,c.x+c.w/2+1,roomBotY+13+1,'#000',11,'center');
      pxText(c.b,c.x+c.w/2,roomBotY+13,lc2,11,'center');

    }else{
      var lines=dialog.text.split('\n');

      for(var li=0;li<lines.length;li++){
        var line=lines[li];
        if(line.indexOf('[RED]')!==-1){ inRed=true; line=line.replace('[RED]',''); }
        if(line.indexOf('[/RED]')!==-1){ inRed=false; line=line.replace('[/RED]',''); }
        pxText(line,dx+16,dy+30+li*16, inRed?P.RED:P.DIALOG_TEXT,11);
      }
    }

    // Close hint / choice hint
    if(archiveState==='choice'){
      pxText('[Y] 是     [N] 否     [F/Esc] 关闭',dx+dw/2,dy+dh-22,P.HUD,10,'center');
    }else if(bottleState==='choice'){

    pxText('密码验证',pdx+pw/2,pdy+5,P.DIALOG_TITLE,11,'center');

    var tlabel=pwDialog.targetId==='gate'?'大门密码(4位):':(pwDialog.targetId==='pwd_jiaowu'?'医务室密码(4位):':(pwDialog.targetId==='doc_archive'?'档案储物间密码(4位):':(pwDialog.targetId==='doc_wang'?'门卫值班室密码(4位):':'监控系统密码(4位):')));
    pxText(tlabel,pdx+20,pdy+40,P.DIALOG_TEXT,11);
    // Input box
    pxRect(pdx+20,pdy+58,180,22,'#0a0a0a');
    drawBorder(pdx+20,pdy+58,180,22,'#555',1);
    var display=pwDialog.input;
    for(var di=0;di<pwDialog.input.length;di++) display=display.replace(pwDialog.input[di],'*');
    pxText(new Array(pwDialog.input.length+1).join('*'),pdx+24,pdy+62,'#8a8a8a',13);
    // Cursor
    if(Math.floor(Date.now()/500)%2) pxRect(pdx+24+pwDialog.input.length*8,pdy+60,6,18,'#fff');

    if(pwDialog.error){
      pxText(pwDialog.error,pdx+20,pdy+90,P.RED,10);

    pxText('[F] 确认  [Esc] 取消',pdx+pw/2,pdy+ph-26,P.HUD,9,'center');
  }

  // 全屏红色闪烁（黑影追逐期间）
  if(redFlashOn){
    var rf=Math.sin(Date.now()*0.006)*0.12+0.2; // 0.08~0.32 脉冲
    pxRect(0,0,W,H,'rgba(150,0,0,'+rf+')');
  }

  // 被黑影追上："你死了"大字
  drawChaserDeath();
}

// ── Password input handling ──
window.addEventListener('keydown',function(e){
  if(!pwDialog || dialog) return;
  if(pwDialog.justOpened){ pwDialog.justOpened=false; return; }
  if(e.key.length===1 && /^[a-zA-Z0-9]$/.test(e.key)){
    pwDialog.input+=e.key;
    pwDialog.error='';
    e.preventDefault();
  }else if(e.key==='Backspace'){
    pwDialog.input=pwDialog.input.slice(0,-1);
    pwDialog.error='';
    e.preventDefault();
  }
});

// ── Game Loop ──
function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ── 脚步声系统 ──
var Footsteps = {
    audioCtx: null,
    isPlaying: false,
    lastStepTime: 0,
    stepInterval: 250,
    
    init: function() {
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            console.log('✅ 脚步声音频系统初始化成功');
        } catch(e) {
            console.error('❌ 音频初始化失败:', e);
        }
    },
    
    playStep: function() {
        if (!this.audioCtx) this.init();
        if (!this.audioCtx) return;
        
        var now = Date.now();
        if (now - this.lastStepTime < this.stepInterval) return;
        
        this.lastStepTime = now;
        
        try {
            const ctx = this.audioCtx;
            const duration = 0.15;
            
            const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const t = i / ctx.sampleRate;
                let sample = 0;
                
                if (t < 0.01) {
                    sample = (t / 0.01) * Math.random() * 0.4;
                } else if (t < 0.05) {
                    sample = Math.random() * 0.5 + 0.3;
                    sample += Math.sin(t * 400) * 0.1;
                    sample += Math.sin(t * 1000) * 0.03;
                } else if (t < 0.1) {
                    const decay = (t - 0.05) / 0.05;
                    sample = (1 - decay) * (Math.random() * 0.3 + 0.15);
                    sample += Math.sin(t * 200) * 0.04 * (1 - decay);
                } else if (t < duration) {
                    const fade = (t - 0.1) / (duration - 0.1);
                    sample = (1 - fade) * Math.random() * 0.08;
                }
                
                data[i] = sample * 0.5;
            }
            
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            
            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            
            source.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            source.start(0);
            
        } catch(e) {
            console.warn('脚步声播放错误:', e);
        }
    },
    
    start: function() {
        if (!this.isPlaying) {
            this.isPlaying = true;
            if (!this.audioCtx && typeof AudioContext !== 'undefined') {
                this.init();
            }
        }
    },
    
    stop: function() {
        this.isPlaying = false;
        this.lastStepTime = 0;
    },
    
    update: function(isMoving, walkTimer) {
        if (isMoving) {
            this.start();
            if (walkTimer === 0 || walkTimer % 12 === 0) {
                this.playStep();
            }
        } else {
            this.stop();
        }
    }
};

// 初始化脚步声系统
document.addEventListener('DOMContentLoaded', function() {
    document.addEventListener('keydown', function() {
        if (!Footsteps.audioCtx) {
            Footsteps.init();
        }
    });
});

// Initial tip
tip('WASD 移动角色，靠近房间按 F 互动');

gameLoop();
})();
</script>

<script>
(function(){
  var IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints>0) || /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)) && !(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  if(!IS_TOUCH) return; // 电脑版完全不创建任何控件
  var C = document.getElementById('c');
  if(!C) return;
  var K; try{ K = (typeof keys!=='undefined')?keys:null; }catch(e){ K=null; }
  if(!K){ K = {}; }
  function gMS(){ try{ return (typeof machineScreen!=='undefined')?machineScreen:undefined; }catch(e){ return undefined; } }
  function gPW(){ try{ return (typeof pwDialog!=='undefined')?pwDialog:undefined; }catch(e){ return undefined; } }
  function tapKey(key){
    window.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true,cancelable:true}));
    window.dispatchEvent(new KeyboardEvent('keyup',{key:key,bubbles:true,cancelable:true}));
  }
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  var layer = document.createElement('div');
  layer.id='mbt-controls';
  layer.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;pointer-events:none;';
  document.body.appendChild(layer);
  var JOY_R=60;
  var joy=document.createElement('div');
  joy.style.cssText='position:fixed;left:22px;bottom:22px;width:'+(JOY_R*2)+'px;height:'+(JOY_R*2)+'px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.4);pointer-events:auto;touch-action:none;';
  var knob=document.createElement('div');
  knob.style.cssText='position:absolute;left:'+(JOY_R-22)+'px;top:'+(JOY_R-22)+'px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.9);';
  joy.appendChild(knob);
  layer.appendChild(joy);
  var joyId=null, joyCx=0, joyCy=0;
  var __mbtDown={};
  function pressKey(k,down){ if(down&&!__mbtDown[k]){ __mbtDown[k]=true; window.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true})); } else if(!down&&__mbtDown[k]){ __mbtDown[k]=false; window.dispatchEvent(new KeyboardEvent('keyup',{key:k,bubbles:true,cancelable:true})); } }
  function setMove(dx,dy){ var dead=JOY_R*0.35; pressKey('w',dy<-dead); pressKey('s',dy>dead); pressKey('a',dx<-dead); pressKey('d',dx>dead); }
  function clearMove(){ pressKey('w',false); pressKey('s',false); pressKey('a',false); pressKey('d',false); }
  function moveJoy(t){ var dx=t.clientX-joyCx, dy=t.clientY-joyCy; var dist=Math.sqrt(dx*dx+dy*dy), max=JOY_R-22; if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; } knob.style.left=(JOY_R-22+dx)+'px'; knob.style.top=(JOY_R-22+dy)+'px'; setMove(dx,dy); }
  joy.addEventListener('touchstart', function(e){ e.preventDefault(); var t=e.changedTouches[0]; joyId=t.identifier; var r=joy.getBoundingClientRect(); joyCx=r.left+JOY_R; joyCy=r.top+JOY_R; moveJoy(t); }, {passive:false});
  joy.addEventListener('touchmove', function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId) moveJoy(e.changedTouches[i]); } }, {passive:false});
  function endJoy(e){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId){ joyId=null; knob.style.left=(JOY_R-22)+'px'; knob.style.top=(JOY_R-22)+'px'; clearMove(); } } }
  joy.addEventListener('touchend', endJoy);
  joy.addEventListener('touchcancel', endJoy);
  function mkBtn(label,color){ var b=document.createElement('div'); b.textContent=label; b.style.cssText='position:fixed;right:22px;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,0.35);border:2px solid '+color+';color:'+color+';font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;touch-action:none;user-select:none;'; return b; }
  var btnI=mkBtn('互动','#7fd0ff'); btnI.style.right='22px'; btnI.style.bottom='22px';
  var btnC=mkBtn('关闭','#ff8a8a'); btnC.style.right='100px'; btnC.style.bottom='22px';
  var btnY=mkBtn('确认','#7fffa0'); btnY.style.right='22px'; btnY.style.bottom='100px';
  var btnN=mkBtn('取消','#ffd27f'); btnN.style.right='100px'; btnN.style.bottom='100px';
  layer.appendChild(btnI); layer.appendChild(btnC); layer.appendChild(btnY); layer.appendChild(btnN);
  btnI.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('f'); }, {passive:false});
  btnC.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('Escape'); }, {passive:false});
  btnY.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('y'); }, {passive:false});
  btnN.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('n'); }, {passive:false});
  if(C){ C.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; window.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY,bubbles:true})); }, {passive:true}); }
  var pwdWrap=document.createElement('div');
  pwdWrap.style.cssText='position:fixed;left:0;top:0;width:100%;display:none;z-index:70;background:rgba(0,0,0,0.65);padding:8px;box-sizing:border-box;pointer-events:auto;';
  var pwdInput=document.createElement('input'); pwdInput.type='text'; pwdInput.placeholder='输入密码'; pwdInput.style.cssText='width:58%;padding:10px;font-size:16px;border:2px solid #3cff7a;background:#0a0a0a;color:#3cff7a;border-radius:4px;';
  var pwdOk=document.createElement('button'); pwdOk.textContent='填入'; pwdOk.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #3cff7a;background:#0a2a14;color:#3cff7a;border-radius:4px;';
  var pwdHide=document.createElement('button'); pwdHide.textContent='隐藏'; pwdHide.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #888;background:#222;color:#ccc;border-radius:4px;';
  pwdWrap.appendChild(pwdInput); pwdWrap.appendChild(pwdOk); pwdWrap.appendChild(pwdHide);
  document.body.appendChild(pwdWrap);
  pwdInput.addEventListener('keydown', function(e){ e.stopPropagation(); });
  pwdInput.addEventListener('input', function(e){ e.stopPropagation(); });
  pwdOk.addEventListener('click', function(){ var v=pwdInput.value; var ms=gMS(), pw=gPW(); if(ms && ms.input!==undefined){ ms.input=v; } if(pw && pw.input!==undefined){ pw.input=v; } pwdInput.value=''; pwdWrap.style.display='none'; });
  pwdHide.addEventListener('click', function(){ pwdWrap.style.display='none'; });
  setInterval(function(){ var ms=gMS(), pw=gPW(); if(ms||pw){ if(pwdWrap.style.display!=='block'){ pwdWrap.style.display='block'; } } else { if(pwdWrap.style.display!=='none'){ pwdWrap.style.display='none'; } } }, 300);
})();
</script>
