<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星榆中学 2008 · 实验区走廊（门字形）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto;background:#0a0a0a;filter:grayscale(1) contrast(1.1)}
/* 黑影红框：HTML 元素，绕开 canvas 的 grayscale 滤镜以保持红色 */
#chaser-frame{box-sizing:border-box;will-change:left,top,width,height,opacity,box-shadow}

/* ── 跳脸惊吓效果 ── */
#jumpscare-overlay{
  display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:99999;background:#000;cursor:pointer;
}
#jumpscare-overlay.active{
  display:flex;justify-content:center;align-items:flex-start;
  animation:jitter 0.08s infinite;
}
#jumpscare-flash{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:999999;pointer-events:none;opacity:0;
  background:#fff;
}
#jumpscare-flash.active{
  animation:flashStrobe 0.3s ease-out forwards;
}
@keyframes flashStrobe{
  0%{opacity:0} 8%{opacity:0.9} 16%{opacity:0.1} 25%{opacity:0.8}
  35%{opacity:0} 50%{opacity:0.7} 65%{opacity:0.05} 80%{opacity:0.5} 100%{opacity:0}
}
#jumpscare-img{
  width:auto;height:auto;transform:scale(3);
  animation:zoomPulse 0.06s infinite alternate,imageShake 0.04s infinite;
  filter:contrast(1.3) brightness(1.1);
}
@keyframes jitter{
  0%{transform:translate(0,0)} 25%{transform:translate(-6px,4px)}
  50%{transform:translate(6px,-4px)} 75%{transform:translate(-4px,-6px)}
  100%{transform:translate(4px,6px)}
}
@keyframes zoomPulse{ from{transform:scale(3)} to{transform:scale(3.36)} }
@keyframes imageShake{
  0%{filter:contrast(1.3) brightness(1.1) hue-rotate(0deg)}
  50%{filter:contrast(1.5) brightness(1.3) hue-rotate(10deg) saturate(2)}
  100%{filter:contrast(1.3) brightness(1.1) hue-rotate(-5deg) saturate(1.5)}
}
</style>
</head>
<body>
<audio id="map6-bgm" src="caidan.mp3" autoplay loop volume="0.6" style="display:none"></audio>
<canvas id="c"></canvas>
<!-- 黑影红框：独立 HTML 元素，绕开 canvas 的 grayscale 滤镜 -->
<div id="chaser-frame" style="position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5;display:none"></div>
<div id="jumpscare-overlay"><div id="jumpscare-flash"></div><img id="jumpscare-img" src="goast.png" alt=""></div>
<script>
// 外部依赖兜底
window.go = window.go || function(u){ location.href=u; };
window.GameTime = window.GameTime || { label:function(){ return null; } };

// 占位 BGM —— map6 使用独立的 <audio> 标签，禁用 bgm.js 合成器
window.BGM = {
  tryPlaySwitchSound:function(){},
  playStair:function(cb){cb&&cb();},
  playComputer:function(){},
  startChase:function(){},
  start:function(){},   // 禁止合成器启动
  stop:function(){},
  toggle:function(){},
  setVolume:function(){}
};

// 如果 autoplay 被浏览器拦截，首次用户交互时补播
document.addEventListener('DOMContentLoaded', function(){
  var bgm = document.getElementById('map6-bgm');
  if(!bgm) return;
  bgm.volume = 0.6;
  var p = bgm.play();
  if(p && p.catch){
    p.catch(function(){
      var once = function(){
        bgm.play().catch(function(){});
        document.removeEventListener('keydown', once);
        document.removeEventListener('click', once);
      };
      document.addEventListener('keydown', once);
      document.addEventListener('click', once);
    });
  }
});

(function(){
var C=document.getElementById('c');
var ctx=C.getContext('2d');

var W=960,H=540;
C.width=W;C.height=H;

function resize(){
  var iw=window.innerWidth, ih=window.innerHeight, baseA=960/540, a=iw/ih;
  if(a>=baseA){ H=540; W=Math.round(540*a); }
  else { W=960; H=Math.round(960/a); }
  C.width=W; C.height=H;
  C.style.width=iw+'px';
  C.style.height=ih+'px';
}
resize();window.addEventListener('resize',resize);

// ── Palette ──
var P={
  BG:'#0a0a0a',
  WALL:'#2a2a2a', WALL2:'#3a3a3a', WALL3:'#444',
  FLOOR:'#15130f',
  CORR:'#1a1814',
  HALL:'#181818',
  ROOM:'#1a1a1a',
  DARK:'#111', TEXT:'#777',
  HINT:'#8a7a5a',
  RED:'#883333', GREEN:'#3a5a3a', BLUE:'#3a4a6a', YELLOW:'#6a5a30',
  PLAYER:'#8a8a8a', PLAYER2:'#bbb',
  DIALOG_BG:'#111', DIALOG_BORDER:'#444', DIALOG_TITLE:'#bbb', DIALOG_TEXT:'#888',
  HUD:'#555',
  CRT_SCREEN:'#0a1a0a', CRT_BODY:'#333', CRT_GLOW:'rgba(60,180,60,0.3)',
  DOOR:'#2a2a20', INTERACT:'#888',
  // 实验室主题色
  LAB:'#0e1614', LAB2:'#13201c', GLASS:'#16242a',
  RUST:'#3a2a18', RUST2:'#4a3620',
  TAPE:'#5a5a20', TAPE2:'#3a3a14',
  BLOOD:'#3a1010', BLOOD2:'#521414',
  SPEC:'#10202a', MACHINE:'#3a3a40', MACHINE2:'#5a5a64',
  CHALK:'#6a6a60'
};

// ── Map Data：门字形大走廊（倒 U 形环廊 + 中央实验核心区）──
var B={ L:80, T:40, R:880, B:500 };
var CW=B.R-B.L;   // 800
var CH=B.B-B.T;   // 460

// 中央区域（仅用于定位中央仪器，已不再围墙）
var core={ x:230, y:130, w:500, h:280 };   // y:130..410
var coreCx=core.x+core.w/2;

// 底部入口缺口（门字形下方开口）
var gapX1=455, gapX2=505;

// ── 碰撞墙体 ──
var walls=[];
// 外墙
walls.push({x:B.L,y:B.T,w:CW,h:4});           // 顶
walls.push({x:B.L,y:B.T,w:4,h:CH});           // 左
walls.push({x:B.R-4,y:B.T,w:4,h:CH});         // 右
walls.push({x:B.L,y:B.B-4,w:gapX1-B.L,h:4});  // 底左（到缺口）
walls.push({x:gapX2,y:B.B-4,w:B.R-gapX2,h:4});// 底右（缺口后）
// 中央实验仪器（不再围墙，直接置于地面，本体不可穿过）
var machine={ x:coreCx-45, y:core.y+40, w:90, h:120 };

// 地面障碍物（外形各不相同，可碰撞）
var obstacles=[
  {x:118,y:206,w:42,h:58,kind:'cabinet'},  // 锈蚀柜
  {x:120,y:402,w:32,h:14,kind:'desk'},     // 翻倒课桌
  {x:808,y:226,w:44,h:60,kind:'freezer'},  // 实验冷柜
  {x:824,y:382,w:26,h:30,kind:'barrel'},   // 化学桶
  {x:250,y:54, w:46,h:42,kind:'shelf'},    // 储物架
  {x:600,y:56, w:44,h:44,kind:'freezer'},  // 实验冷柜
  {x:298,y:444,w:34,h:40,kind:'crate'},    // 木箱堆
  {x:648,y:446,w:22,h:26,kind:'chair'},    // 断腿椅
  {x:300,y:248,w:42,h:58,kind:'cabinet'},  // 锈蚀柜
  {x:632,y:248,w:42,h:58,kind:'cabinet'}   // 锈蚀柜
];
walls.push({x:machine.x,y:machine.y,w:machine.w,h:machine.h}); // 仪器本体
for(var oi=0;oi<obstacles.length;oi++){ walls.push({x:obstacles[oi].x,y:obstacles[oi].y,w:obstacles[oi].w,h:obstacles[oi].h}); }

// ── 交互区（门字形环廊上的可调查点）──
var interactZones=[
  {x:gapX1,y:B.B-26,w:gapX2-gapX1,h:26, id:'exit',         label:'地下配电室',       type:'exit',     pw:null,  docId:null},
  {x:B.L+12,y:B.T+44,w:34,h:46,        id:'door_left',     label:'小门',             type:'door_left', pw:null,  docId:'door_left'},
  {x:88,    y:330,  w:66, h:54,        id:'board_lab',     label:'残破黑板',         type:'doc',      pw:null,  docId:'board_lab'},
  {x:machine.x,y:machine.y,w:machine.w,h:machine.h, id:'core', label:'实验核心仪器 NM-2005', type:'machine', pw:null, docId:null},
  {x:790,   y:150,  w:60, h:70,        id:'mirror_lab',    label:'布满灰尘的镜子',   type:'doc',      pw:null,  docId:'mirror'},
  {x:786,   y:300,  w:78, h:54,        id:'report_lab',   label:'散落实验报告',     type:'doc',      pw:null,  docId:'report'}
];

// ── 文档 ──
var docs={
  cabinet_lab:{
    title:'锈蚀安全柜（已解锁）',
    text:'柜门密码为关停年份 2008。\n\n实验日志残页：\n『NM-2005 核心仪器仍在自运行。封条已贴，但电力未断。\n若有人拉下总闸并按下红色按钮，仪器才会真正停止。\n——这不是我该做的。』\n\n柜中还有半瓶福尔马林与一张学生名单（多处被划去）。'
  },
  board_lab:{
    title:'残破黑板',
    text:'（粉笔字大半模糊，依稀可辨）\n\n『严禁……三楼……仪器……\n放学后……不要回应走廊里的朗读声……\n第7条校规：████████\n第8条校规：████████████』'
  },
  core:{
    title:'实验核心区·观察窗',
    text:'厚重防爆玻璃后，一台白色仪器（标号 NM-2005）仍在低鸣。\n红色指示灯有节奏地闪烁，像在呼吸。\n仪器旁散落着被撕碎的实验记录。\n你感到它在「等」着什么。'
  },
  report:{
    title:'散落的实验报告',
    text:'《关于 NM-2005 的稳定性测试（第8次）》\n……受试者出现记忆混淆与「无脸」幻觉……\n最后一页被血浸透，只留一行字：\n『把那台机器关掉。』'
  },
  mirror:{
    title:'布满灰尘的镜子',
    text:'柜门后面压着半张被潮气泡烂的旧文件，\n纸边焦黑，勉强能辨认出几行残缺的字迹：\n\n一楼教室...............\n王伯的..在职.....................\n画............作者.......生日..............\n张老师......隐藏的真相.............\n机器.......码...................\n\n（剩下的字迹已被水渍和霉斑吞没，看不清了）'
  },
  door_left:{
    title:'小门',
    text:'还是救人要紧。'
  }
};

// ── 状态 ──
var player={
  x:150, y:460, w:12, h:18, vx:0, vy:0, speed:1.8,
  facing:0, frame:0, walkTimer:0
};
window.__xyzh_player=player;
(function(){
  try{
    var r=JSON.parse(sessionStorage.getItem('xyzh_resume')||'null');
    if(r && r.map==='map6.html'){ player.x=r.x; player.y=r.y; sessionStorage.removeItem('xyzh_resume'); }
  }catch(e){}
})();
// 从 mp5 隐秘小门进入时，自动存检查点（与手动存档逻辑相同，死亡后回到 map6）
setTimeout(function(){
  try{
    if(sessionStorage.getItem('xyzh_map6_checkpoint')==='1'){
      sessionStorage.removeItem('xyzh_map6_checkpoint');
      if(typeof SaveSystem!=='undefined') SaveSystem.saveCheckpoint();
    }
  }catch(e){}
}, 500);

// ── 相机跟随系统 ──
var CAM_ZOOM=2.5;
var camera=null;
function updateCamera(){
  if(!camera){ camera={x:player.x+player.w/2, y:player.y+player.h/2}; return; }
  var tx=player.x+player.w/2;
  var ty=player.y+player.h/2;
  var vw=W/CAM_ZOOM, vh=H/CAM_ZOOM;
  if(vw<B.R-B.L){ tx=Math.max(B.L+vw/2, Math.min(B.R-vw/2, tx)); }
  if(vh<B.B-B.T){ ty=Math.max(B.T+vh/2, Math.min(B.B-vh/2, ty)); }
  camera.x=tx; camera.y=ty;
}

// ── 追逐黑影（A* 寻路，跨楼层持续）──
var chaser=null;
var chaserDelay=0;
var redFlashOn=false;
var CHASE_CHASER_RATIO=0.8;
// A* pathfinding
var CELL_SIZE=20;
var PATH_RECALC=12;
var chaserPath=[];
var pathRecalcCounter=0;
var cachedGrid=null;
var chaseTriggered=false;
var caughtDeathStart=0;
var playerDead=false;
function saveChaserRel(){
  if(!chaser) return;
  try{ sessionStorage.setItem('chaserRel', JSON.stringify({dx:chaser.x-player.x, dy:chaser.y-player.y})); }catch(e){}
}

var keys={};
var dialog=null;
var pwDialog=null;
var interactionHint=null;
var screenShake=0;
var tipText='';
var tipTimer=0;
var cabinetUnlocked=false;
var machineOff=false;        // NM-2005 是否已关停
var machineScreen=null;      // 机器显示屏状态
function genMachineCode(){ var s=''; for(var i=0;i<16;i++) s+=Math.floor(Math.random()*10); return s+'2005'; } // 20位，末4位2005
// NM-2005 停机密码：玩家需输入此 MD5 串以关停机器
var MACHINE_CODE='de37726982ee159fcf5b9e1ae28f43fb';
console.log('[NM-2005] 机器编码(调试):', MACHINE_CODE); // 测试用，正式版可在游戏内某处放置该编码

// ── 陈宇（被困在机器里的小孩）──
// 机器关停后从机器里出来，以对话泡泡告诉玩家身份
// 之后采用和 map7 一致的轨迹复刻：记录主角最近 N 帧的位置，陈宇复刻 N 帧前的路径
var CHENYU_DELAY_FRAMES = 12;   // 0.2 秒 @ 60fps（与 map7 一致）
var playerTrail = [];           // 主角最近 N 帧 (x,y,facing,frame) 环形缓冲
var chenYu={
  active:false,         // 是否已被解救并跟随玩家
  // 出现动画（从机器里爬出）
  spawnT:0,             // 0..1 出现进度（0=在机器内，1=完全出来）
  spawnX:0, spawnY:0,   // 出现动画起点（机器位置）
  // 当前位置
  x:0, y:0,
  facing:2, frame:0,
  // 对话序列（玩家按 F/任意键推进）
  bubble:null,          // {lines:[...], idx:0, wait:0, holdFrames:0}
  // 漂移（让人物有点自然呼吸感）
  bob:0
};
// 陈宇的对话（按 F 或点击逐句推进）
var CHENYU_DIALOG=[
  '……',
  '谢谢你……把我救了出来。',
  '我是陈宇。三年前被带进这台机器做实验。',
  '请你带我离开这里。'
];
var CHENYU_MACHINE_X=520; // 机器中心 x（用于出现动画起点）
var CHENYU_MACHINE_Y=200; // 机器中心 y

// ── 输入 ──
window.addEventListener('keydown',function(e){
  keys[e.key.toLowerCase()]=true;
  if(e.key==='f'||e.key==='F'){
    e.preventDefault();
    if(dialog){
      if(dialog.pages && dialog.page<dialog.pages.length-1){ dialog.page++; return; }
      closeDialog(); return;
    }
    if(pwDialog){ submitPw(); return; }
    // 机器屏打开时：F 必须能作为普通字符输入密码框（由下方"密码输入"监听器写入 machineScreen.input）
    if(machineScreen) return;
    // 陈宇对话推进：仅当机器已关停、陈宇出现、且当前有对话且没有 holdFrames 等待
    if(machineOff && chenYu.active && chenYu.bubble && chenYu.bubble.lines && chenYu.bubble.lines.length>0 && chenYu.bubble.holdFrames<=0){
      chenYu.bubble.idx++;
      if(chenYu.bubble.idx >= chenYu.bubble.lines.length){
        // 对话结束：清空 bubble，陈宇进入常驻跟随
        chenYu.bubble = null;
        BGM.tryPlaySwitchSound();
        // 对话结束 → 强制开启追逐战！黑影从底部大门生成
        if(!chaseTriggered){
          chaseTriggered = true;
          redFlashOn = true;
          chaserDelay = 36;
          chaser = {x:gapX1+(gapX2-gapX1)/2-9, y:B.B-28, w:18, h:24, vx:0, vy:0};
          chaserPath = [];
          pathRecalcCounter = 0;
          cachedGrid = null;
          try{ sessionStorage.setItem('chaseOn','1'); }catch(e){}
          if(typeof BGM!=='undefined' && BGM.startChase) BGM.startChase();
          tip('陈宇紧紧拉着你的衣角。身后传来沉重的脚步声……快跑！');
        } else {
          tip('陈宇紧紧拉着你的衣角，跟在你身后');
        }
      } else {
        chenYu.bubble.holdFrames = 60; // 每句 1 秒后才可继续
        BGM.tryPlaySwitchSound();
      }
      return;
    }
    if(interactionHint){ handleInteraction(interactionHint); }
  }
  if(e.key==='Escape'){
    if(dialog) closeDialog();
    if(pwDialog) closePwDialog();
    if(machineScreen) closeMachineScreen();
  }
  // 方向键和移动键阻止默认（防止页面滚动等）
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key)){
    e.preventDefault();
  }
  // F 键在机器屏/密码框打开时不要被全局 preventDefault，让下方密码输入监听器能读到 e.key
  if((e.key==='f'||e.key==='F') && !machineScreen && !pwDialog){
    e.preventDefault();
  }
});
window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });

// 鼠标点击：命中机器屏的「确认关停」按钮才提交
window.addEventListener('mousedown',function(e){
  if(!machineScreen) return;
  // canvas 实际渲染尺寸与坐标系按 CSS 缩放换算
  var rect=C.getBoundingClientRect();
  var scaleX=W/rect.width, scaleY=H/rect.height;
  var mx=(e.clientX-rect.left)*scaleX, my=(e.clientY-rect.top)*scaleY;

  if(machineOff) return;  // 已关停界面下只显示关闭按钮
  var r=machineScreen.btnRect;
  if(!r) return;
  if(mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h){
    submitMachineScreen();
  }
});

// ── 碰撞 ──
function collides(rx,ry,rw,rh){
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(rx<w.x+w.w && rx+rw>w.x && ry<w.y+w.h && ry+rh>w.y) return true;
  }
  if(rx<B.L || rx+rw>B.R) return true;
  if(ry<B.T || ry+rh>B.B) return true;
  return false;
}
function nearZone(px,py,zone){
  var cx=px+player.w/2, cy=py+player.h/2;
  var zcx=zone.x+zone.w/2, zcy=zone.y+zone.h/2;
  var dx=Math.abs(cx-zcx), dy=Math.abs(cy-zcy);
  return dx<zone.w/2+22 && dy<zone.h/2+34;
}

// ── 交互 ──
function handleInteraction(hint){
  // 被黑影吃掉后死亡优先：任何出口/楼层转换交互均失效
  if(caughtDeath) return;
  if(hint.type==='password'){
    openPwDialog(hint.id, hint.pw, hint.docId);
  }else if(hint.type==='doc'){
    var d=docs[hint.docId];
    if(d){ openDialog(d.title,d.text); BGM.tryPlaySwitchSound(); }
  }else if(hint.type==='exit'){
    // 大门紧锁，不跳转回 mp5
    BGM.tryPlaySwitchSound();
    openDialog('地下配电室 · 大门', '你用力拉了拉那扇通往地下配电室的门……\n门锁上了。');
  }else if(hint.type==='machine'){
    openMachineScreen();
  }else if(hint.type==='door_left'){
    // 解救陈宇后（陈宇对话已结束、能正常跟随）小门才可打开 → 进入走廊 map7
    // 要求：陈宇已激活（machineOff 触发 spawnChenYu 后 active=true）
    //       陈宇的对话泡泡已走完（bubble=null），确保能一起走
    // 小门无延迟：条件满足即开，追逐战状态也会随 sessionStorage 传入 map7
    if(machineOff && chenYu.active && !chenYu.bubble){

function openDialog(title,text){
  // 预折行并分页，避免长文档溢出对话框
  var raw=text.split('\n');
  var lines=[];
  ctx.font='11px "Courier New","SimSun",monospace';
  for(var i=0;i<raw.length;i++){
    var L=raw[i];
    while(ctx.measureText(L).width>460 && L.length>1){
      var cut=L.length;
      while(cut>1 && ctx.measureText(L.slice(0,cut)).width>460) cut--;
      lines.push(L.slice(0,cut));
      L=L.slice(cut);
    }
    lines.push(L);
  }
  var perPage=14;
  var pages=[];
  for(var p=0;p<lines.length;p+=perPage) pages.push(lines.slice(p,p+perPage));
  if(!pages.length) pages.push(['']);
  dialog={title:title,text:text,pages:pages,page:0};
}

// ── 更新 ──
function update(){
  if(caughtDeath){
    if(Date.now()-caughtDeathStart>4500) go('bad_ending.html');
    return;
  }
  if(playerDead) return;
  var mx=0,my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;
  if(mx!==0&&my!==0){ mx*=0.707;my*=0.707; }
  var moving=mx!==0||my!==0;
  if(moving){
    var nx=player.x+mx*player.speed;
    if(!collides(nx,player.y,player.w,player.h)) player.x=nx;
    var ny=player.y+my*player.speed;
    if(!collides(player.x,ny,player.w,player.h)) player.y=ny;
    if(Math.abs(mx)>Math.abs(my)){ player.facing=mx>0?3:2; }
    else if(my!==0){ player.facing=my>0?0:1; }
    player.walkTimer++;
    if(player.walkTimer>12){ player.frame=(player.frame+1)%2; player.walkTimer=0; }
    Footsteps.update(true, player.walkTimer);
  }else{
    player.frame=0; player.walkTimer=0; Footsteps.update(false,0);
  }
  // 黑影抓捕先判定：被怪物吃掉死亡优先级高于楼层转换（同帧踩楼梯又被贴脸时判死）
  updateChaser();
  if(caughtDeath) return;
  findInteraction();
  updateChenYu();
  updateCamera();
  if(tipTimer>0) tipTimer--;
  if(tipTimer<=0) tipText='';
  if(screenShake>0) screenShake--;
}

// ── 黑影追逐（A* 寻路，自动绕过障碍物）──
function buildGrid(){
  var gw=Math.ceil((B.R-B.L)/CELL_SIZE);
  var gh=Math.ceil((B.B-B.T)/CELL_SIZE);
  var g=[];
  for(var gx=0;gx<gw;gx++){
    g[gx]=[];
    for(var gy=0;gy<gh;gy++){
      var cx=B.L+gx*CELL_SIZE, cy=B.T+gy*CELL_SIZE;
      var blocked=false;
      for(var i=0;i<walls.length;i++){
        var w=walls[i];
        if(cx<w.x+w.w && cx+CELL_SIZE>w.x && cy<w.y+w.h && cy+CELL_SIZE>w.y){
          blocked=true; break;
        }
      }
      if(cx<B.L+4 || cx+CELL_SIZE>B.R-4 || cy<B.T+4 || cy+CELL_SIZE>B.B-4) blocked=true;
      g[gx][gy]=blocked?1:0;
    }
  }
  return g;
}
function getGrid(){ if(!cachedGrid) cachedGrid=buildGrid(); return cachedGrid; }
function worldToGrid(wx,wy){
  return {x:Math.floor((wx-B.L)/CELL_SIZE), y:Math.floor((wy-B.T)/CELL_SIZE)};
}
function gridToWorld(gx,gy){
  return {x:B.L+gx*CELL_SIZE+CELL_SIZE/2, y:B.T+gy*CELL_SIZE+CELL_SIZE/2};
}
function heuristic(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2); }
function findPath(fromWX,fromWY,toWX,toWY){
  var grid=getGrid();
  var gw=grid.length, gh=grid[0].length;
  var s=worldToGrid(fromWX,fromWY);
  var g=worldToGrid(toWX,toWY);
  s.x=Math.max(0,Math.min(gw-1,s.x)); s.y=Math.max(0,Math.min(gh-1,s.y));
  g.x=Math.max(0,Math.min(gw-1,g.x)); g.y=Math.max(0,Math.min(gh-1,g.y));
  if(s.x===g.x&&s.y===g.y) return null;
  if(grid[s.x][s.y]===1||grid[g.x][g.y]===1) return null;
  var open=[], closed={};
  var sn={x:s.x,y:s.y,g:0,h:heuristic(s.x,s.y,g.x,g.y),parent:null}; sn.f=sn.g+sn.h;
  open.push(sn);
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  var limit=800;
  while(open.length>0 && limit-- > 0){
    var best=0;
    for(var i=1;i<open.length;i++){ if(open[i].f<open[best].f) best=i; }
    var cur=open[best];
    if(cur.x===g.x&&cur.y===g.y){
      var path=[], node=cur;
      while(node){ path.unshift(gridToWorld(node.x,node.y)); node=node.parent; }
      if(path.length>1) path.shift();
      return path;
    }
    open.splice(best,1); closed[cur.x+','+cur.y]=true;
    for(var d=0;d<dirs.length;d++){
      var nx=cur.x+dirs[d][0], ny=cur.y+dirs[d][1];
      if(nx<0||nx>=gw||ny<0||ny>=gh) continue;
      if(grid[nx][ny]===1) continue;
      var nk=nx+','+ny; if(closed[nk]) continue;
      var inOpen=false;
      for(var oi=0;oi<open.length;oi++){
        if(open[oi].x===nx&&open[oi].y===ny){
          inOpen=true; var ng=cur.g+1;
          if(ng<open[oi].g){ open[oi].g=ng; open[oi].f=ng+open[oi].h; open[oi].parent=cur; }
          break;
        }
      }
      if(!inOpen){ open.push({x:nx,y:ny,g:cur.g+1,h:heuristic(nx,ny,g.x,g.y),f:cur.g+1+heuristic(nx,ny,g.x,g.y),parent:cur}); }
    }
  }
  return null;
}
// 腐化学生黑影模型：三头、四十五臂、独腿；多色腐烂细节 + 走路动画，尺寸与行为逻辑不变
function drawCorruptedStudent(c, x, y, w, h, alpha){
  alpha = (alpha==null) ? 1 : alpha;
  // 走路动画相位（持续缓步移动，营造活物感）
  var walk = Date.now()*0.011;
  var bob  = Math.sin(walk)*1.6;        // 身体上下起伏
  var lurch= Math.sin(walk*0.5)*0.8;    // 身体左右轻晃
  var xb = x + lurch, yb = y + bob;
  var cx = xb + w/2, cy = yb + h*0.5;
  function col(hex,a){ if(alpha>=1) return hex; var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+(a*alpha)+')'; }
  // 躯干：腐烂紫红肉体 + 病态绿斑 + 腐肉红
  pxRect(xb+2, yb+5, w-4, h-5, col('#1c0b16',1));
  pxRect(xb+4, yb+8, w-8, h-10, col('#3a1226',1));
  pxRect(xb+5, yb+11, 3, 5, col('#54603a',1));
  pxRect(xb+w-7, yb+13, 3, 4, col('#6b2a2a',1));
  // 下半身：3 条腿在下方统一绘制
  // 三颗头：随身体起伏晃动 + 异色眼（红/黄/青）
  var heads=[xb+1, xb+w/2-2, xb+w-6];
  var eyeColors=['#d11010','#e8d020','#2fd6c8'];
  for(var hi=0; hi<3; hi++){
    var hx=heads[hi];
    pxRect(hx, yb-6, 5, 9, col('#39342c',1));
    pxRect(hx+1, yb-5, 3, 5, col('#4a5a3a',1));
    pxRect(hx+1, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+3, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+2, yb-2, 1, 2, col('#7a1a1a',1));
  }
  // 下半身：3 条腿，随走路交替前后摆动（不再用放射触肢）
  var legCols=['#5a5248','#4a4038','#5a5248'];
  c.save();
  c.lineWidth=2;
  var legTop = yb + h - 2;
  var legXs = [xb+3, xb+w/2, xb+w-4];
  for(var li=0; li<3; li++){
    var sw = Math.sin(walk*0.8 + li*2.1)*2.2;   // 交替摆腿
    c.strokeStyle = col(legCols[li],1);
    c.beginPath();
    c.moveTo(legXs[li], legTop);
    c.lineTo(legXs[li]+sw, legTop+7);
    c.stroke();
    pxRect(legXs[li]+sw-2, legTop+7, 5, 1, col(legCols[li],1)); // 脚掌
  }
  c.restore();
  // 上端血盆大口（随走路张合）
  var gape = 2 + Math.abs(Math.sin(walk*0.7))*3;
  var mx = cx, my = yb - 7;
  pxRect(mx-6, my-gape, 12, gape*2+3, col('#3a0808',1));    // 大口外肉
  pxRect(mx-5, my-gape+1, 10, gape*2+1, col('#150202',1));  // 口内深渊
  for(var ti=0; ti<6; ti++){ pxRect(mx-5+ti*2, my-gape+1, 1, 2+(ti%2), col('#e8e0d0',1)); }   // 上排尖牙
  for(var tj=0; tj<6; tj++){ pxRect(mx-5+tj*2, my+gape, 1, 2+((tj+1)%2), col('#d8cfc0',1)); }  // 下排尖牙
  pxRect(mx-6, my+gape+1, 1, 4, col('#8a0d0d',1));          // 口角滴血
  pxRect(mx+5, my+gape, 1, 3, col('#8a0d0d',1));
  // 血滴（躯干，随身体）
  pxRect(xb+3, yb+h-3, 1, 3, col('#8a0d0d',1));
  pxRect(xb+w-4, yb+h-4, 1, 4, col('#8a0d0d',1));
}

function updateChaser(){
  if(!chaser || playerDead) return;
  if(chaserDelay>0){ chaserDelay--; return; }
  var ccx=chaser.x+chaser.w/2, ccy=chaser.y+chaser.h/2;
  var pcx=player.x+player.w/2, pcy=player.y+player.h/2;
  var dxToPlayer=pcx-ccx, dyToPlayer=pcy-ccy;
  var distPlayer=Math.sqrt(dxToPlayer*dxToPlayer+dyToPlayer*dyToPlayer);
  var minDist=80, maxDist=500;
  var minRatio=0.95, maxRatio=1.8;
  var t=Math.min(1,Math.max(0,(distPlayer-minDist)/(maxDist-minDist)));
  var ratio=minRatio+(maxRatio-minRatio)*Math.pow(t,0.5);
  var ps=player.speed*ratio;
  pathRecalcCounter--;
  if(pathRecalcCounter<=0){
    pathRecalcCounter=PATH_RECALC;
    var p=findPath(ccx,ccy,pcx,pcy);
    if(p&&p.length>0) chaserPath=p;
  }
  if(chaserPath.length>0){
    var tgt=chaserPath[0];
    var dx=tgt.x-ccx, dy=tgt.y-ccy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<3){ chaserPath.shift(); }
    else{ chaser.x+=dx/dist*ps; chaser.y+=dy/dist*ps; }
  }else{
    var dx2=pcx-ccx, dy2=pcy-ccy;
    var dist2=Math.sqrt(dx2*dx2+dy2*dy2);
    if(dist2>0){ var vx2=dx2/dist2*ps, vy2=dy2/dist2*ps;
      var nx2=chaser.x+vx2; if(!collides(nx2,chaser.y,chaser.w,chaser.h)) chaser.x=nx2;
      var ny2=chaser.y+vy2; if(!collides(chaser.x,ny2,chaser.w,chaser.h)) chaser.y=ny2;
    }
  }
  if(chaser.x<player.x+player.w && chaser.x+chaser.w>player.x &&
     chaser.y<player.y+player.h && chaser.y+chaser.h>player.y){ triggerChaserDeath(); }
}

// ── 陈宇跟随：复刻主角 0.2 秒前的路径（与 map7 完全一致）──
function updateChenYu(){
  if(!chenYu.active) return;
  // 出现阶段不跟随（站在机器内，spawnT 由 drawChenYu 累加）
  if(chenYu.spawnT < 0.6) return;

  // ── 玩家轨迹入队（陈宇复刻用）──
  // 每帧把主角当前 (x, y, facing, frame) 入队；满 N 帧后陈宇取队首 = 0.2 秒前
  playerTrail.push({x:player.x, y:player.y, facing:player.facing, frame:player.frame});
  if(playerTrail.length > CHENYU_DELAY_FRAMES){
    playerTrail.shift();
  }
  // ── 陈宇：复刻主角 0.2 秒前路径 ──
  chenYu.bob = (chenYu.bob + 0.08) % (Math.PI*2);
  // 缓冲未满时陈宇站在玩家身后 18px（启动阶段）
  if(playerTrail.length < CHENYU_DELAY_FRAMES){
    var bx = player.x, by = player.y;
    if(player.facing===2) bx += 18;       // 面向左 → 陈宇在右后
    else if(player.facing===3) bx -= 18;  // 面向右
    else if(player.facing===0) by += 18;  // 面向下
    else if(player.facing===1) by -= 18;  // 面向上
    if(!collides(bx, by, 12, 18)){ chenYu.x = bx; chenYu.y = by; }
    chenYu.facing = player.facing; chenYu.frame = player.frame;
  } else {
    // 缓冲满：取最旧的一帧 = 0.2 秒前主角的位置
    var snap = playerTrail[0];
    chenYu.x = snap.x;
    chenYu.y = snap.y;
    chenYu.facing = snap.facing;
    chenYu.frame = snap.frame;
  }

  // 对话推进
  if(chenYu.bubble && chenYu.bubble.holdFrames>0){
    chenYu.bubble.holdFrames--;
  }
}

var biteStart=0, severedHead=null, bloodParts=[], deathChaserSnap=null, goreSpawned=false;
function spawnDeathGore(){
  var hx=player.x+player.w/2, hy=player.y+3;
  severedHead={x:hx,y:hy,vx:(Math.random()-0.5)*1.6,vy:-2.2-Math.random()*1.2,rot:0,vrot:(Math.random()-0.5)*0.35};
  bloodParts=[];

    bloodParts.push({x:hx+(Math.random()-0.5)*5,y:hy+(Math.random()-0.5)*5,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:28+Math.random()*34,sz:1+Math.random()*2});
  }

function drawDeathAnim(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  // 阶段一：怪兽抱住玩家（收拢 + 挣扎晃动），暂不啃头
  if(el<1500){
    if(deathChaserSnap){
      var prog=el/1500;
      var shk=Math.sin(el*0.05)*2.4*(1-prog*0.55);
      var gx=deathChaserSnap.x+shk, gy=deathChaserSnap.y+Math.sin(el*0.033)*1.3;
      drawCorruptedStudent(ctx, gx, gy, deathChaserSnap.w, deathChaserSnap.h);
      // 环抱手臂横贯玩家身体，随挣扎逐渐收紧
      var ay=player.y+player.h*0.42, aw=deathChaserSnap.w+6-prog*3;
      pxRect(deathChaserSnap.x-3+shk, ay,   aw, 3, '#2e2822');
      pxRect(deathChaserSnap.x-3+shk, ay+4, aw, 2, '#241f1a');
    }
    return;
  }
  // 阶段二：啃下头（首次进入触发一次喷血）
  if(!goreSpawned){ spawnDeathGore(); goreSpawned=true; }
  if(severedHead){
    severedHead.x+=severedHead.vx; severedHead.y+=severedHead.vy;
    severedHead.vy+=0.18; severedHead.rot+=severedHead.vrot;
    if(severedHead.y>player.y+player.h+40) severedHead=null;
  }
  for(var i=bloodParts.length-1;i>=0;i--){
    var p=bloodParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if(p.life<=0) bloodParts.splice(i,1);
  }
  if(!chaser && deathChaserSnap) drawCorruptedStudent(ctx, deathChaserSnap.x, deathChaserSnap.y, deathChaserSnap.w, deathChaserSnap.h);
  if(severedHead){
    ctx.save();
    ctx.translate(severedHead.x,severedHead.y);
    ctx.rotate(severedHead.rot);
    pxRect(-3,-3,6,7,'#d9cfc4');
    pxRect(-2,-2,4,5,'#b89a86');
    pxRect(-2,-1,1,1,'#222'); pxRect(1,-1,1,1,'#222');
    pxRect(-2,2,4,1,'#5a1010');
    pxRect(-3,3,6,2,'#9a0d0d');
    ctx.restore();
  }
  for(var j=0;j<bloodParts.length;j++){
    var q=bloodParts[j];
    pxRect(q.x,q.y,q.sz,q.sz,'#a00d0d');
  }
}

function dMachine(x,y){ // 核心仪器 NM-2005（舱体式实验器械）

    pxRect(gx+20, gy+17, 9, 2, '#c23434');

  }else{

function render(){
  ctx.clearRect(0,0,W,H);
  var sx=screenShake>0?(Math.random()-0.5)*screenShake:0;
  var sy=screenShake>0?(Math.random()-0.5)*screenShake:0;

  // ── 世界层（相机跟随：以玩家为中心）──
  ctx.save();

  ctx.translate(W/2, H/2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-camera.x, -camera.y);

  pxRect(B.L,B.T,CW,CH,P.FLOOR);
  // ── 地砖纹理（大块地砖 + 横竖缝线 + 污渍噪点）──
  var TILE_W = 40, TILE_H = 40;
  // 交替色调的地砖底色
  for(var tx=B.L; tx<B.R; tx+=TILE_W){
    for(var ty=B.T; ty<B.B; ty+=TILE_H){
      var isDark = ((tx/TILE_W)+(ty/TILE_H))%2===1;
      var c = isDark ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.03)';
      pxRect(tx, ty, TILE_W, TILE_H, c);
    }

  // 纵向砖缝
  ctx.globalAlpha = 0.18;

  // 横向砖缝
  for(var gy=B.T; gy<B.B; gy+=TILE_H) pxRect(B.L, gy, CW, 1, '#000');
  ctx.globalAlpha = 1;
  // 随机磨损斑点（位置首次渲染时固定，避免每帧闪烁）

// ── 密码输入 ──
window.addEventListener('keydown',function(e){
  if((!pwDialog && !machineScreen) || dialog) return;
  if(pwDialog && pwDialog.justOpened){ pwDialog.justOpened=false; return; }
  if(machineScreen && machineScreen.justOpened){ machineScreen.justOpened=false; return; }
  // Ctrl+V / Cmd+V 粘贴支持：把剪贴板里的 32 位 HEX 串贴到机器密码框
  if((e.ctrlKey||e.metaKey) && (e.key==='v'||e.key==='V')){
    if(machineScreen){
      e.preventDefault();
      var t=(e.clipboardData && e.clipboardData.getData('text')) || '';
      // 只保留十六进制字符，并截断到 32 位（与机器密码等长）
      var hex=(t.match(/[0-9a-fA-F]/g)||[]).join('').slice(0,32);
      if(hex){
        machineScreen.input=hex;
        machineScreen.error='';
        BGM.tryPlaySwitchSound();
      }
      return;
    }
  }
  if(e.key.length===1 && /^[a-zA-Z0-9]$/.test(e.key)){
    if(pwDialog){ pwDialog.input+=e.key; pwDialog.error=''; }
    else if(machineScreen){ machineScreen.input+=e.key; machineScreen.error=''; }
    e.preventDefault();
  }
  else if(e.key==='Backspace'){
    if(pwDialog){ pwDialog.input=pwDialog.input.slice(0,-1); pwDialog.error=''; }
    else if(machineScreen){ machineScreen.input=machineScreen.input.slice(0,-1); machineScreen.error=''; }
    e.preventDefault();
  }
});

// Ctrl+V 兜底：浏览器在某些情况下不会触发上面的 keydown（剪贴板 API 限制），
// 提供一个不可见的"粘贴按钮"让玩家也能粘贴（通过 prompt 输入粘贴内容）
window.addEventListener('paste',function(e){
  if(!machineScreen || dialog) return;
  var t=(e.clipboardData && e.clipboardData.getData('text')) || '';
  var hex=(t.match(/[0-9a-fA-F]/g)||[]).join('').slice(0,32);
  if(hex){
    machineScreen.input=hex;
    machineScreen.error='';
    BGM.tryPlaySwitchSound();
    e.preventDefault();
  }
});

// ── 脚步声系统 ──
var Footsteps={
  audioCtx:null, isPlaying:false, lastStepTime:0, stepInterval:250,
  init:function(){
    try{ this.audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  },
  playStep:function(){
    if(!this.audioCtx) this.init(); if(!this.audioCtx) return;
    var now=Date.now(); if(now-this.lastStepTime<this.stepInterval) return; this.lastStepTime=now;
    try{
      var ctx=this.audioCtx, dur=0.15;
      var buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate), data=buf.getChannelData(0);
      for(var i=0;i<data.length;i++){
        var t=i/ctx.sampleRate, s=0;
        if(t<0.01) s=(t/0.01)*Math.random()*0.4;
        else if(t<0.05){ s=Math.random()*0.5+0.3; s+=Math.sin(t*400)*0.1; s+=Math.sin(t*1000)*0.03; }
        else if(t<0.1){ var d=(t-0.05)/0.05; s=(1-d)*(Math.random()*0.3+0.15); s+=Math.sin(t*200)*0.04*(1-d); }
        else if(t<dur){ var f=(t-0.1)/(dur-0.1); s=(1-f)*Math.random()*0.08; }
        data[i]=s*0.5;
      }
      var src=ctx.createBufferSource(); src.buffer=buf;
      var g=ctx.createGain(); g.gain.setValueAtTime(0.4,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
      src.connect(g); g.connect(ctx.destination); src.start(0);
    }catch(e){}
  },
  start:function(){ if(!this.isPlaying){ this.isPlaying=true; if(!this.audioCtx&&typeof AudioContext!=='undefined') this.init(); } },
  stop:function(){ this.isPlaying=false; this.lastStepTime=0; },
  update:function(isMoving,walkTimer){ if(isMoving){ this.start(); if(walkTimer===0||walkTimer%12===0) this.playStep(); } else this.stop(); }
};
document.addEventListener('DOMContentLoaded',function(){
  document.addEventListener('keydown',function(){ if(!Footsteps.audioCtx) Footsteps.init(); });
});

<script>
// map6：bgm.js 加载后会覆盖 BGM 并启动合成器，这里立即禁止合成器并确保 caidan.mp3 播放
(function(){
  // 禁用 bgm.js 的合成器 BGM — start/stop 改为操作 <audio> 元素
  if(window.BGM){
    window.BGM.start = function(){
      var bgm = document.getElementById('map6-bgm');
      if(bgm && bgm.paused){ bgm.play().catch(function(){}); }
    };
    window.BGM.stop = function(){
      var bgm = document.getElementById('map6-bgm');
      if(bgm){ bgm.pause(); }
    };
    window.BGM.toggle = function(){
      var bgm = document.getElementById('map6-bgm');
      if(!bgm) return false;
      if(bgm.paused){ bgm.play().catch(function(){}); }
      else { bgm.pause(); }
      return !bgm.paused;
    };
    window.BGM.setVolume = function(v){
      var bgm = document.getElementById('map6-bgm');
      if(bgm){ bgm.volume = Math.max(0, Math.min(1, v)); }
    };
  }
  // 立刻播放 caidan.mp3
  var bgm = document.getElementById('map6-bgm');
  if(bgm){
    bgm.volume = 0.6;
    bgm.play().catch(function(){
      // 静音策略被拦截 → 等首次交互
      var once = function(){
        bgm.play().catch(function(){});
        document.removeEventListener('keydown', once);
        document.removeEventListener('click', once);
      };
      document.addEventListener('keydown', once);
      document.addEventListener('click', once);
    });
  }
})();
</script>
<script src="save.js"></script>
<script>
(function(){
  var IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints>0) || /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)) && !(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  if(!IS_TOUCH) return; // 电脑版完全不创建任何控件
  var C = document.getElementById('c');
  if(!C) return;
  var K; try{ K = (typeof keys!=='undefined')?keys:null; }catch(e){ K=null; }
  if(!K){ K = {}; }
  function gMS(){ try{ return (typeof machineScreen!=='undefined')?machineScreen:undefined; }catch(e){ return undefined; } }
  function gPW(){ try{ return (typeof pwDialog!=='undefined')?pwDialog:undefined; }catch(e){ return undefined; } }
  function tapKey(key){
    window.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true,cancelable:true}));
    window.dispatchEvent(new KeyboardEvent('keyup',{key:key,bubbles:true,cancelable:true}));
  }
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  var layer = document.createElement('div');
  layer.id='mbt-controls';
  layer.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;pointer-events:none;';
  document.body.appendChild(layer);
  var JOY_R=60;
  var joy=document.createElement('div');
  joy.style.cssText='position:fixed;left:22px;bottom:96px;width:'+(JOY_R*2)+'px;height:'+(JOY_R*2)+'px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.25);pointer-events:auto;touch-action:none;';
  var knob=document.createElement('div');
  knob.style.cssText='position:absolute;left:'+(JOY_R-22)+'px;top:'+(JOY_R-22)+'px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.9);';
  joy.appendChild(knob);
  layer.appendChild(joy);
  var joyId=null, joyCx=0, joyCy=0;
  var __mbtDown={};
  function pressKey(k,down){ if(down&&!__mbtDown[k]){ __mbtDown[k]=true; window.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true})); } else if(!down&&__mbtDown[k]){ __mbtDown[k]=false; window.dispatchEvent(new KeyboardEvent('keyup',{key:k,bubbles:true,cancelable:true})); } }
  function setMove(dx,dy){ var dead=JOY_R*0.35; pressKey('w',dy<-dead); pressKey('s',dy>dead); pressKey('a',dx<-dead); pressKey('d',dx>dead); }
  function clearMove(){ pressKey('w',false); pressKey('s',false); pressKey('a',false); pressKey('d',false); }
  function moveJoy(t){ var dx=t.clientX-joyCx, dy=t.clientY-joyCy; var dist=Math.sqrt(dx*dx+dy*dy), max=JOY_R-22; if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; } knob.style.left=(JOY_R-22+dx)+'px'; knob.style.top=(JOY_R-22+dy)+'px'; setMove(dx,dy); }
  joy.addEventListener('touchstart', function(e){ e.preventDefault(); var t=e.changedTouches[0]; joyId=t.identifier; var r=joy.getBoundingClientRect(); joyCx=r.left+JOY_R; joyCy=r.top+JOY_R; moveJoy(t); }, {passive:false});
  joy.addEventListener('touchmove', function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId) moveJoy(e.changedTouches[i]); } }, {passive:false});
  function endJoy(e){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId){ joyId=null; knob.style.left=(JOY_R-22)+'px'; knob.style.top=(JOY_R-22)+'px'; clearMove(); } } }
  joy.addEventListener('touchend', endJoy);
  joy.addEventListener('touchcancel', endJoy);
  function mkBtn(label,color){ var b=document.createElement('div'); b.textContent=label; b.style.cssText='position:fixed;right:22px;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,0.35);border:2px solid '+color+';color:'+color+';font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;touch-action:none;user-select:none;'; return b; }
  var btnI=mkBtn('互动','#7fd0ff'); btnI.style.right='22px'; btnI.style.bottom='22px';
  var btnC=mkBtn('关闭','#ff8a8a'); btnC.style.right='100px'; btnC.style.bottom='22px';
  var btnY=mkBtn('确认','#7fffa0'); btnY.style.right='22px'; btnY.style.bottom='100px';
  var btnN=mkBtn('取消','#ffd27f'); btnN.style.right='100px'; btnN.style.bottom='100px';
  layer.appendChild(btnI); layer.appendChild(btnC); layer.appendChild(btnY); layer.appendChild(btnN);
  btnI.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('f'); }, {passive:false});
  btnC.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('Escape'); }, {passive:false});
  btnY.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('y'); }, {passive:false});
  btnN.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('n'); }, {passive:false});
  if(C){ C.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; window.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY,bubbles:true})); }, {passive:true}); }
  var pwdWrap=document.createElement('div');
  pwdWrap.style.cssText='position:fixed;left:0;top:0;width:100%;display:none;z-index:70;background:rgba(0,0,0,0.65);padding:8px;box-sizing:border-box;pointer-events:auto;';
  var pwdInput=document.createElement('input'); pwdInput.type='text'; pwdInput.placeholder='输入密码'; pwdInput.style.cssText='width:58%;padding:10px;font-size:16px;border:2px solid #3cff7a;background:#0a0a0a;color:#3cff7a;border-radius:4px;';
  var pwdOk=document.createElement('button'); pwdOk.textContent='填入'; pwdOk.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #3cff7a;background:#0a2a14;color:#3cff7a;border-radius:4px;';
  var pwdHide=document.createElement('button'); pwdHide.textContent='隐藏'; pwdHide.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #888;background:#222;color:#ccc;border-radius:4px;';
  pwdWrap.appendChild(pwdInput); pwdWrap.appendChild(pwdOk); pwdWrap.appendChild(pwdHide);
  document.body.appendChild(pwdWrap);
  pwdInput.addEventListener('keydown', function(e){ e.stopPropagation(); });
  pwdInput.addEventListener('input', function(e){ e.stopPropagation(); });
  pwdOk.addEventListener('click', function(){ var v=pwdInput.value; var ms=gMS(), pw=gPW(); if(ms && ms.input!==undefined){ ms.input=v; } if(pw && pw.input!==undefined){ pw.input=v; } pwdInput.value=''; pwdWrap.style.display='none'; });
  pwdHide.addEventListener('click', function(){ pwdWrap.style.display='none'; });
  setInterval(function(){ var ms=gMS(), pw=gPW(); if(ms||pw){ if(pwdWrap.style.display!=='block'){ pwdWrap.style.display='block'; } } else { if(pwdWrap.style.display!=='none'){ pwdWrap.style.display='none'; } } }, 300);
})();
</script>
