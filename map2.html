<canvas id="c"></canvas>
<script>
(function(){

var W=960,H=540;

function resize(){

  C.style.width=(W*s)+'px';

resize();window.addEventListener('resize',resize);

  PLAYER:'#8a8a8a',

  DIALOG_BG:'#111',

// ── Map Data ──
var B={L:70,T:50,R:890,B:490};
var CW=B.R-B.L;
var CH=B.B-B.T;

// Column definitions — 二楼布局
var cols=[
  {x:B.L+4,   w:80,  t:'一楼楼梯口',  b:'',      td:null,        bd:null,        bp:true},  // col0: stairs from 1F
  {x:B.L+90,  w:145, t:'201高二班',   b:'202高二班', td:null,     bd:null,        bp:false}, // col1
  {x:B.L+239, w:145, t:'203高二班',   b:'闲置画室',  td:null,     bd:null,        bp:false}, // col2
  {x:B.L+388, w:140, t:'政教主任办公室', b:'教师办公室', td:'doc_zhang',bd:'doc_teacher',bp:false}, // col3: Zhang + teachers
  {x:B.L+532, w:130, t:'茶水间',      b:'二楼卫生间', td:'doc_tea',  bd:null,        bp:false}, // col4
  {x:B.L+666, w:110, t:'三楼楼梯',    b:'',      td:null,        bd:null,        bp:true}   // col5: stairs to 3F (locked)
];

var roomTopY=B.T+4;
var roomTopH=100;
var roomTopYE=roomTopY+roomTopH;

var gapY=roomTopYE+4;
var gapH=36;
var gapYE=gapY+gapH;

var roomBotY=gapYE+4;
var roomBotH=100;
var roomBotYE=roomBotY+roomBotH;

var hallY=roomBotYE+4;
var hallH=72;
var hallYE=hallY+hallH;

// ── Walls ──
var walls=[];
var doors=[];

// Outer walls
walls.push({x:B.L,y:B.T,w:B.R-B.L,h:4}); // top
walls.push({x:B.L,y:B.B-4,w:B.R-B.L,h:4}); // bottom
walls.push({x:B.L,y:B.T,w:4,h:B.B-B.T}); // left
walls.push({x:B.R-4,y:B.T,w:4,h:B.B-B.T}); // right

// Horizontal walls — split at stairwell passages (col0, col5)
function hWallSegments(){
  var gaps=[];
  // Gap at col0 (stairs from 1F)
  gaps.push({l:B.L, r:cols[0].x+cols[0].w});
  // Gap at col5 (stairs to 3F)
  gaps.push({l:cols[5].x, r:B.R});
  // Middle segment between the two stair gaps
  gaps.push({l:cols[1].x, r:cols[5].x});

  var hwalls=[
    {y:roomTopYE, h:4}, // below top rooms
    {y:gapYE,     h:4}, // below corridor
    {y:roomBotYE, h:4}  // below bottom rooms
  ];
  for(var i=0;i<hwalls.length;i++){
    for(var j=0;j<gaps.length;j++){
      walls.push({x:gaps[j].l, y:hwalls[i].y, w:gaps[j].r-gaps[j].l, h:hwalls[i].h});
    }
  }
}
hWallSegments();

// 闲置画室走廊入口 — 移除 gapYE 处的碰撞阻挡（走廊→底部房间之间的墙）
(function(){
  var artDoorW=24;
  var artDoorX=cols[2].x+10; // 左侧开口
  for(var wi=walls.length-1;wi>=0;wi--){
    var w=walls[wi];
    // gapYE 是走廊与底部房间之间的分隔线
    if(w.y===gapYE && w.x<artDoorX+artDoorW && w.x+w.w>artDoorX){
      var leftW=artDoorX-w.x;
      var rightW=(w.x+w.w)-(artDoorX+artDoorW);
      walls.splice(wi,1);
      if(leftW>0) walls.push({x:w.x,y:w.y,w:leftW,h:w.h});
      if(rightW>0) walls.push({x:artDoorX+artDoorW,y:w.y,w:rightW,h:w.h});
      break;
    }
  }
})();

// Vertical walls between non-bp columns
for(var i=0;i<cols.length-1;i++){
  var wx=cols[i].x+cols[i].w;
  if(cols[i].bp || cols[i+1].bp) continue;
  walls.push({x:wx,y:roomTopY,w:4,h:roomTopH});
  walls.push({x:wx,y:roomBotY,w:4,h:roomBotH});
}
// Wall between col4 and col5 — top/bottom rooms only, gap at corridor
walls.push({x:cols[4].x+cols[4].w,y:roomTopY,w:4,h:roomTopH});
walls.push({x:cols[4].x+cols[4].w,y:gapYE,w:4,h:roomBotH});
// Wall between col0 and col1 — top/bottom rooms only, gap at corridor
walls.push({x:cols[0].x+cols[0].w,y:roomTopY,w:4,h:roomTopH});
walls.push({x:cols[0].x+cols[0].w,y:gapYE,w:4,h:roomBotH});

// ── Doors ──
function addDoor(cx,label,id,row){
  var dx=cx+cols[0].w/2-12;
  var dy=row==='t'?roomTopYE-4:roomBotYE-4;
  doors.push({x:dx,y:dy,w:24,h:8,label:label,id:id,row:row});
}
addDoor(cols[1].x,'201高二班','room_201','t');
addDoor(cols[2].x,'203高二班','room_203','t');
addDoor(cols[3].x,'政教主任办公室','doc_zhang','t');
addDoor(cols[4].x,'茶水间','doc_tea','t');
addDoor(cols[1].x,'202高二班','room_202','b');
addDoor(cols[2].x,'闲置画室','doc_art','b');
addDoor(cols[3].x,'教师办公室','doc_teacher','b');

// Stairs doors
doors.push({x:cols[0].x+cols[0].w/2-20,y:gapY,w:40,h:8,label:'下楼·一楼','id':'stairs_down',row:'s'});
doors.push({x:cols[5].x+cols[5].w/2-20,y:gapY,w:40,h:8,label:'上楼·三楼','id':'stairs_up',row:'s'});

// ── Interaction zones ──
var interactZones=[
  {x:cols[3].x,y:roomTopY,w:cols[3].w,h:roomTopH, id:'doc_zhang',   label:'政教主任办公室（需工号）', type:'locked', docId:'zhang', pw:'ZYJ-001'},
  {x:cols[3].x,y:roomBotY,w:cols[3].w,h:roomBotH, id:'doc_teacher', label:'教师办公室',     type:'doc', docId:'teacher'},
  {x:cols[4].x,y:roomTopY,w:cols[4].w,h:roomTopH, id:'doc_tea',     label:'茶水间',         type:'doc', docId:'tea'},
  {x:cols[2].x+(cols[2].w-28)/2,y:roomBotY+52,w:28,h:36, id:'bed',  label:'休息一下（调整时间/日期）', type:'bed'},
  {x:cols[1].x,y:roomTopY,w:cols[1].w,h:roomTopH, id:'room_201',    label:'201高二班',      type:'doc', docId:'room201'},
  {x:cols[2].x,y:roomBotY,w:cols[2].w,h:roomBotH, id:'doc_art',     label:'闲置画室',       type:'doc', docId:'art'},
  {x:cols[5].x,y:gapY,w:cols[5].w,h:gapH+roomBotH+roomTopH-20,id:'stairs_up_zone',label:'上楼·三楼',type:'locked',docId:null}
];

// ── Documents ──
var docs={
  zhang:{
    title:'政教主任办公室 — 张建军工作台',
    text:'教师内部安全手册（完整版）\n━━━━━━━━━━━━━━\n\n第3条：每日17:00检查医务室药品库存\n第5条：周五禁止巡查三楼区域\n第8条：异常学生第一时间引导至医务室\n第12条：高三晚自习21:00准时清场\n第17条：三楼监控画面严禁拍照外传\n\n工作日志摘要（共7篇）：\n\n9月3日：体检报告8名学生指标异常\n9月5日：三楼实验室设备全面排查\n9月7日：关闭实验室，仪器封存\n9月10日：8名学生陆续离校\n9月11日：决定整体关停学校\n9月12日：发布关停公告\n9月14日：最后一批档案转移至一楼\n\n医务室密码为1705 若有紧急情况请老师自行进入\n重要提示：红色药剂严禁学生接触'
  },
  teacher:{
    title:'教师办公室 — 公共区域',
    text:'散落桌面上的教职工笔记：\n\n"今天王老师请假了，家里有事"\n"运动会安排表还没确定"\n"期中考卷印刷中，请稍候"\n\n一份被遗忘的值班表：\n10月8日 周三 张建军\n10月9日 周四 李国华\n10月10日 周五 陈明远\n\n（李国华的名字被人用红笔圈了起来）\n\n角落里的旧报纸：\n"乡镇中学合并计划启动"\n日期：2005年3月'
  },
  tea:{
    title:'茶水间 — 墙缝中的纸张',
    text:'因为带手机这种小事老师居然给了我处分！\n我要偷偷溜进档案室把处分划掉·····\n不要忘记我们这届学生的羁绊啊！！'
  },
  room201:{
    title:'201高二班 — 黑板留言',
    text:'老师说....文字的笔画数有时候可以将文本转换为数字····'
  },
  art:{
    title:'闲置画室 — 散落的涂鸦',
    text:'画室角落里堆着学生的旧画作……\n\n一幅素描：蓝白校服的背影\n另一幅：教学楼三楼窗边的人影\n还有一张：用黑色蜡笔反复涂抹的圆圈\n\n墙上贴着一张泛黄的课程表：\n"高二美术选修课 — 每周五15:00"\n\n（这间画室已经闲置很久了）\n（大部分画具都落了灰）\n\n画架最显眼处斜倚着一幅蒙尘的旧画，\n看不出原本画的是什么。\n（按 [Y] 凑近看看这幅落灰的画）'
  }
};

// ── State ──
var stairsLocked=true;
var stairsPwCorrect='3548'; // 3-5-4-8
var zhangLocked=sessionStorage.getItem('zhangUnlocked')!=='1'; // 政教主任办公室工号锁
var player={
  x:cols[0].x+cols[0].w+16, y:gapY+gapH/2-9,
  w:12, h:18, vx:0, vy:0, speed:1.8,
  facing:0, frame:0, walkTimer:0
};
window.__xyzh_player = player;
(function(){
  try{
    var r = JSON.parse(sessionStorage.getItem('xyzh_resume')||'null');
    if(r && r.map === location.pathname.split('/').pop()){
      player.x = r.x; player.y = r.y;
      sessionStorage.removeItem('xyzh_resume');
    }
  }catch(e){}
})();

// ── 追逐黑影（跨楼层持续）──
var chaser=null;
var redFlashOn=false;
var CHASE_SPEED_MUL=1.7;      // 追逐时玩家移速倍率（黑影同步按比例加快）
var CHASE_CHASER_RATIO=0.8;   // 黑影相对玩家速度（人物的 0.8 倍）

// 楼层切换时保存黑影相对玩家位置，保证追逐连续
function saveChaserRel(){
  if(!chaser) return;
  try{ sessionStorage.setItem('chaserRel', JSON.stringify({dx:chaser.x-player.x, dy:chaser.y-player.y})); }catch(e){}
}
// 若追逐已开始（来自其它楼层）：提速、红闪，并在下楼 0.2s 后于出生点右侧生成黑影
var pendingChaserSpawn=false; // 下楼后延迟生成
var chaserSpawnTimer=0;       // 生成倒计时（帧，约 0.5s）
(function(){
  try{
    if(sessionStorage.getItem('chaseOn')==='1'){
      player.speed*=CHASE_SPEED_MUL;
      redFlashOn=true;
      pendingChaserSpawn=true;
      chaserSpawnTimer=30;                // 0.5 秒后于玩家所在位置生成
    }
  }catch(e){}
})();

// Handle returns
var returnFrom=sessionStorage.getItem('mapReturn');
if(returnFrom==='stairs3'){
  stairsLocked=false;
  player.x=cols[5].x+cols[5].w/2-6;
  player.y=gapY+14;
  sessionStorage.removeItem('mapReturn');
}
var keys={};
var dialog=null;
var pwDialog=null;
var bedDialog=null;
var interactionHint=null;
var screenShake=0;
var tipText='';
var tipTimer=0;
var paintImg=new Image(); paintImg.src='paint.png';   // 闲置画室：落灰的画

// ── Input ──
window.addEventListener('keydown',function(e){
  keys[e.key.toLowerCase()]=true;
  if(bedDialog){
    if(bedDialog.justOpened){ bedDialog.justOpened=false; return; }
    handleBedKey(e);
    return;
  }
  if(e.key==='f'||e.key==='F'){
    e.preventDefault();
    if(dialog){ closeDialog(); return; }
    if(pwDialog){ submitPw(); return; }
    if(interactionHint){
      handleInteraction(interactionHint);
    }
  }
  if(e.key==='Escape'){
    if(dialog) closeDialog();
    if(pwDialog) closePwDialog();
  }
  // Y 键：在闲置画室对话框内，文字 ↔ 落灰的画 双向切换
  if(e.key==='y'||e.key==='Y'){
    if(dialog && !pwDialog && !bedDialog && dialog.title && dialog.title.indexOf('画室')>=0){
      e.preventDefault();
      if(dialog.special!=='artPaint'){
        // 文字 → 切换到画作
        dialog.title='闲置画室 — 落灰的画';
        dialog.text='';
        dialog.special='artPaint';
      }else{
        // 画作 → 切回文字
        var artDoc=docs['art'];
        dialog.title=artDoc?artDoc.title:'闲置画室';
        dialog.text=artDoc?artDoc.text:'';
        dialog.special=undefined;
      }
      BGM.tryPlaySwitchSound();
    }
  }
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','f','F'].includes(e.key)){
    e.preventDefault();
  }
});
window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });

// ── Collision ──
function collides(rx,ry,rw,rh){
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(rx<w.x+w.w && rx+rw>w.x && ry<w.y+w.h && ry+rh>w.y) return true;
  }
  if(rx<B.L || rx+rw>B.R) return true;
  if(ry<B.T || ry+rh>B.B) return true;
  return false;
}

function inDoor(px,py,door){
  return px+player.w/2 >= door.x && px+player.w/2 <= door.x+door.w &&
         py+player.h   >= door.y && py              <= door.y+door.h;
}

function nearZone(px,py,zone){
  var cx=px+player.w/2, cy=py+player.h/2;
  var zcx=zone.x+zone.w/2, zcy=zone.y+zone.h/2;
  var dx=Math.abs(cx-zcx), dy=Math.abs(cy-zcy);
  return dx<zone.w/2+20 && dy<zone.h/2+30;
}

// ── Interaction ──
function handleInteraction(hint){
  if(hint.type==='bed'){
    openBedDialog();
    BGM.tryPlaySwitchSound();
    return;
  }
  if(hint.type==='doc'){
    var d=docs[hint.docId];
    if(d) {
      openDialog(d.title,d.text);
      if(hint.id==='doc_tea') dialog.special='tea';
      BGM.tryPlaySwitchSound();
    }
  }else if(hint.id==='room_201'){
    var d=docs.room201;
    if(d) { openDialog(d.title,d.text); BGM.tryPlaySwitchSound(); }
  }else if(hint.type==='locked'){
    if(hint.id==='stairs_up_zone'){
      if(stairsLocked){
        openPwDialog('stairs_up',null,null);
      }else{
        BGM.playStair(function(){
          sessionStorage.setItem('mapReturn','stairs3');
          go('map3.html');
        });
      }
    }else if(hint.id==='doc_zhang'){
      if(zhangLocked){
        openPwDialog('doc_zhang',hint.pw,hint.docId);
      }else{
        var d=docs[hint.docId];
        if(d) { openDialog(d.title,d.text); BGM.tryPlaySwitchSound(); }
      }
    }
  }else if(hint.id==='stairs_down'){
    if(chaser){
      // 追逐中：取消黑屏间隔，立即下楼并保持黑影连续
      saveChaserRel();
      sessionStorage.setItem('mapReturn','stairs');
      go('map.html');
    }else{
      BGM.playStair(function(){
        sessionStorage.setItem('mapReturn','stairs');
        go('map.html');
      });
    }
  }else if(hint.id==='stairs_up'){
    if(!stairsLocked){
      BGM.playStair(function(){
        sessionStorage.setItem('mapReturn','stairs3');
        go('map3.html');
      });
    }
  }
}

function findInteraction(){
  interactionHint=null;
  for(var i=0;i<doors.length;i++){
    var d=doors[i];
    if(inDoor(player.x,player.y,d)){
      interactionHint=d;
      return;
    }
  }
  for(var i=0;i<interactZones.length;i++){
    var z=interactZones[i];
    if(nearZone(player.x,player.y,z)){
      interactionHint=z;
      return;
    }
  }
}

// ── Dialog ──
function openDialog(title,text){
  dialog={title:title,text:text};
}
function closeDialog(){ dialog=null; }

function openPwDialog(id,pw,docId){
  pwDialog={targetId:id,correct:pw,docId:docId,input:'',error:'',justOpened:true};
}
function closePwDialog(){ pwDialog=null; }

// 闲置画室：落灰的画 —— 破旧画架 + paint.png + 标题
function drawArtPaint(dx,dy,dw,dh){
  // 画作原图 1079x1458（竖构图，比例 0.74），按 contain 模式完整显示
  var ph2=Math.min(340, dh-110);             // 画框高（留给标题+画架空间）
  var pw2=Math.round(ph2*0.74);              // 画框宽（按原图比例）
  var pxi=dx+(dw-pw2)/2, pyi=dy+30;
  // 旧木画框
  pxRect(pxi-9,pyi-9,pw2+18,ph2+18,'#3a2a18');
  drawBorder(pxi-9,pyi-9,pw2+18,ph2+18,'#5a4030',3);
  if(paintImg && paintImg.complete && paintImg.naturalWidth){
    var iw=paintImg.naturalWidth, ih=paintImg.naturalHeight;
    // 等比缩放（contain 模式）：保证整张图完整居中绘制，绝不溢出画框
    pxRect(pxi,pyi,pw2,ph2,'#0d0d0d');
    var ratio=iw/ih;
    var drawW=pw2, drawH=ph2;
    if(ratio>pw2/ph2){ drawH=Math.round(drawW/ratio); }
    else             { drawW=Math.round(drawH*ratio); }
    var drawX=pxi+(pw2-drawW)/2;
    var drawY=pyi+(ph2-drawH)/2;
    ctx.save();
    try{ ctx.filter='grayscale(1) contrast(0.95)'; }catch(e){}
    try{ ctx.drawImage(paintImg, 0,0,iw,ih, drawX,drawY,drawW,drawH); }catch(e){}
    ctx.restore();
  }else{
    pxRect(pxi,pyi,pw2,ph2,'#1c1c1c');
    pxText('画 作 加 载 中…', pxi+pw2/2, pyi+ph2/2, '#777',10,'center');
  }
  // 落灰：淡灰蒙层 + 静态划痕
  ctx.fillStyle='rgba(190,190,178,0.16)';
  ctx.fillRect(pxi,pyi,pw2,ph2);
  ctx.strokeStyle='rgba(120,120,108,0.28)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pxi+18,pyi+34); ctx.lineTo(pxi+pw2-28,pyi+12);
  ctx.moveTo(pxi+44,pyi+ph2-18); ctx.lineTo(pxi+pw2-22,pyi+ph2-44);
  ctx.stroke();
  // 破旧画架（三脚木架）
  var legTop=pyi+ph2+8;
  var baseY=dy+dh-32;
  ctx.lineCap='round';
  // 托板
  ctx.strokeStyle='#5a3f22'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(pxi-14,legTop); ctx.lineTo(pxi+pw2+14,legTop); ctx.stroke();
  // 两条前腿
  ctx.beginPath();
  ctx.moveTo(pxi-4,legTop); ctx.lineTo(pxi-40,baseY);

// ── 床交互 · 时间/日期选择 ──
function openBedDialog(){
  var g=GameTime.get();
  bedDialog={ day:g.day, hour:g.hour, justOpened:true };
}
function applyBedTime(){
  GameTime.set(bedDialog.day, bedDialog.hour, 0);
  bedDialog=null;
  tip('时间已调整为 '+GameTime.label());
  BGM.tryPlaySwitchSound();
}
function handleBedKey(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){ bedDialog.day=(bedDialog.day+6)%7; e.preventDefault(); }
  else if(k==='arrowright'||k==='d'){ bedDialog.day=(bedDialog.day+1)%7; e.preventDefault(); }
  else if(k==='arrowup'||k==='w'){ bedDialog.hour=(bedDialog.hour+1)%24; e.preventDefault(); }
  else if(k==='arrowdown'||k==='s'){ bedDialog.hour=(bedDialog.hour+23)%24; e.preventDefault(); }
  else if(k==='f'||k==='F'){ applyBedTime(); e.preventDefault(); }
  else if(k==='Escape'){ bedDialog=null; e.preventDefault(); }
}

// ── Update ──
function update(){
  if(typeof GameTime!=='undefined') GameTime.tick();
  if(caughtDeath){
    if(caughtTimer>0) caughtTimer--;
    if(caughtTimer<=0){
      // 有存档时不自动跳转，留在死亡画面让玩家选择回档
      if(typeof SaveSystem!=='undefined' && SaveSystem.getSaves && SaveSystem.getSaves().length>0){
        if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
      }else{
        go('start.html');
      }
    }
    return;
  }
  // 下楼后延迟生成黑影（出生点右侧）
  if(pendingChaserSpawn){
    chaserSpawnTimer--;
    if(chaserSpawnTimer<=0){
      pendingChaserSpawn=false;
      // 出现在玩家所在位置（略偏移避免立即重叠触发抓捕）
      chaser={x:player.x+36, y:player.y, w:18, h:24, vx:0, vy:0};
    }
  }
  if(bedDialog) return; // 床交互时暂停角色移动
  var mx=0,my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;

  if(mx!==0&&my!==0){ mx*=0.707;my*=0.707; }

  var moving=mx!==0||my!==0;

  if(moving){
    var nx=player.x+mx*player.speed;
    if(!collides(nx,player.y,player.w,player.h)) player.x=nx;
    var ny=player.y+my*player.speed;
    if(!collides(player.x,ny,player.w,player.h)) player.y=ny;

    if(Math.abs(mx)>Math.abs(my)){ player.facing=mx>0?3:2; }
    else if(my!==0){ player.facing=my>0?0:1; }
    player.walkTimer++;
    if(player.walkTimer>12){ player.frame=(player.frame+1)%2; player.walkTimer=0; }
    
    Footsteps.update(true, player.walkTimer);
  }else{
    player.frame=0;
    player.walkTimer=0;
    
    Footsteps.update(false, 0);
  }

  findInteraction();
  updateChaser();

  if(tipTimer>0) tipTimer--;
  if(tipTimer<=0) tipText='';

  if(screenShake>0) screenShake--;
}

// 腐化学生黑影模型：三头、四十五臂、独腿；多色腐烂细节 + 走路动画，尺寸与行为逻辑不变
function drawCorruptedStudent(c, x, y, w, h, alpha){
  alpha = (alpha==null) ? 1 : alpha;
  // 走路动画相位（持续缓步移动，营造活物感）
  var walk = Date.now()*0.011;
  var bob  = Math.sin(walk)*1.6;        // 身体上下起伏
  var lurch= Math.sin(walk*0.5)*0.8;    // 身体左右轻晃
  var xb = x + lurch, yb = y + bob;
  var cx = xb + w/2, cy = yb + h*0.5;
  function col(hex,a){ if(alpha>=1) return hex; var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+(a*alpha)+')'; }
  // 躯干：腐烂紫红肉体 + 病态绿斑 + 腐肉红
  pxRect(xb+2, yb+5, w-4, h-5, col('#1c0b16',1));
  pxRect(xb+4, yb+8, w-8, h-10, col('#3a1226',1));
  pxRect(xb+5, yb+11, 3, 5, col('#54603a',1));
  pxRect(xb+w-7, yb+13, 3, 4, col('#6b2a2a',1));
  // 下半身：3 条腿在下方统一绘制
  // 三颗头：随身体起伏晃动 + 异色眼（红/黄/青）
  var heads=[xb+1, xb+w/2-2, xb+w-6];
  var eyeColors=['#d11010','#e8d020','#2fd6c8'];
  for(var hi=0; hi<3; hi++){
    var hx=heads[hi];
    pxRect(hx, yb-6, 5, 9, col('#39342c',1));
    pxRect(hx+1, yb-5, 3, 5, col('#4a5a3a',1));
    pxRect(hx+1, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+3, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+2, yb-2, 1, 2, col('#7a1a1a',1));
  }
  // 下半身：3 条腿，随走路交替前后摆动（不再用放射触肢）
  var legCols=['#5a5248','#4a4038','#5a5248'];
  c.save();
  c.lineWidth=2;
  var legTop = yb + h - 2;
  var legXs = [xb+3, xb+w/2, xb+w-4];
  for(var li=0; li<3; li++){
    var sw = Math.sin(walk*0.8 + li*2.1)*2.2;   // 交替摆腿
    c.strokeStyle = col(legCols[li],1);
    c.beginPath();
    c.moveTo(legXs[li], legTop);
    c.lineTo(legXs[li]+sw, legTop+7);
    c.stroke();
    pxRect(legXs[li]+sw-2, legTop+7, 5, 1, col(legCols[li],1)); // 脚掌
  }
  c.restore();
  // 上端血盆大口（随走路张合）
  var gape = 2 + Math.abs(Math.sin(walk*0.7))*3;
  var mx = cx, my = yb - 7;
  pxRect(mx-6, my-gape, 12, gape*2+3, col('#3a0808',1));    // 大口外肉
  pxRect(mx-5, my-gape+1, 10, gape*2+1, col('#150202',1));  // 口内深渊
  for(var ti=0; ti<6; ti++){ pxRect(mx-5+ti*2, my-gape+1, 1, 2+(ti%2), col('#e8e0d0',1)); }   // 上排尖牙
  for(var tj=0; tj<6; tj++){ pxRect(mx-5+tj*2, my+gape, 1, 2+((tj+1)%2), col('#d8cfc0',1)); }  // 下排尖牙
  pxRect(mx-6, my+gape+1, 1, 4, col('#8a0d0d',1));          // 口角滴血
  pxRect(mx+5, my+gape, 1, 3, col('#8a0d0d',1));
  // 血滴（躯干，随身体）
  pxRect(xb+3, yb+h-3, 1, 3, col('#8a0d0d',1));
  pxRect(xb+w-4, yb+h-4, 1, 4, col('#8a0d0d',1));
}
// 追逐黑影：腐化学生（三头·四十五臂·独腿）
function drawChaser(){
  if(!chaser) return;
  drawCorruptedStudent(ctx, chaser.x, chaser.y, chaser.w, chaser.h);
}

// 黑影追逐：无视地图碰撞，速度略慢于主角，抓捕即死
function updateChaser(){
  if(!chaser) return;
  var ps=player.speed*CHASE_CHASER_RATIO;
  var pcx=player.x+player.w/2, pcy=player.y+player.h/2;
  var ccx=chaser.x+chaser.w/2, ccy=chaser.y+chaser.h/2;
  var dx=pcx-ccx, dy=pcy-ccy;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>0){ chaser.vx=dx/dist*ps; chaser.vy=dy/dist*ps; }
  chaser.x+=chaser.vx; chaser.y+=chaser.vy;
  if(chaser.x<player.x+player.w && chaser.x+chaser.w>player.x &&
     chaser.y<player.y+player.h && chaser.y+chaser.h>player.y){
    triggerChaserDeath();
  }
}

// 被黑影追上：定格、浮现红色大字"你死了"，存档后返回标题
var caughtDeath=false;        // 被黑影追上：浮现"你死了"后跳转
var caughtTimer=0;            // 定格倒计时（帧）
function triggerChaserDeath(){
  if(caughtDeath) return;
  caughtDeath=true;
  playerDead=true;
  try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
  if(chaser){ chaser.x=player.x+player.w/2-chaser.w/2; chaser.y=player.y+player.h/2-chaser.h/2+8; deathChaserSnap={x:chaser.x,y:chaser.y,w:chaser.w,h:chaser.h}; }
  biteStart=Date.now(); goreSpawned=false;
  // 不再 saveCurrent（避免覆盖追逐战前的检查点存档）
  // 显示「回到上一个存档点」按钮（若有检查点）
  if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
  caughtTimer=270; // 约 4.5 秒后跳转（含抱住+啃头动画）
}

// ── 死亡动画：黑影咬下玩家头 + 血液四溅 ──
var biteStart=0, severedHead=null, bloodParts=[], deathChaserSnap=null, goreSpawned=false;
function spawnDeathGore(){
  var hx=player.x+player.w/2, hy=player.y+3;
  severedHead={x:hx,y:hy,vx:(Math.random()-0.5)*1.6,vy:-2.2-Math.random()*1.2,rot:0,vrot:(Math.random()-0.5)*0.35};
  bloodParts=[];
  for(var bi=0;bi<48;bi++){
    var ang=Math.random()*Math.PI*2, sp=1+Math.random()*4.5;
    bloodParts.push({x:hx+(Math.random()-0.5)*5,y:hy+(Math.random()-0.5)*5,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:28+Math.random()*34,sz:1+Math.random()*2});
  }
}
function drawDeathAnim(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  // 阶段一：怪兽抱住玩家（收拢 + 挣扎晃动），暂不啃头
  if(el<1500){
    if(deathChaserSnap){
      var prog=el/1500;
      var shk=Math.sin(el*0.05)*2.4*(1-prog*0.55);
      var gx=deathChaserSnap.x+shk, gy=deathChaserSnap.y+Math.sin(el*0.033)*1.3;
      drawCorruptedStudent(ctx, gx, gy, deathChaserSnap.w, deathChaserSnap.h);
      // 环抱手臂横贯玩家身体，随挣扎逐渐收紧
      var ay=player.y+player.h*0.42, aw=deathChaserSnap.w+6-prog*3;
      pxRect(deathChaserSnap.x-3+shk, ay,   aw, 3, '#2e2822');
      pxRect(deathChaserSnap.x-3+shk, ay+4, aw, 2, '#241f1a');
    }
    return;
  }
  // 阶段二：啃下头（首次进入触发一次喷血）
  if(!goreSpawned){ spawnDeathGore(); goreSpawned=true; }
  if(severedHead){
    severedHead.x+=severedHead.vx; severedHead.y+=severedHead.vy;
    severedHead.vy+=0.18; severedHead.rot+=severedHead.vrot;
    if(severedHead.y>player.y+player.h+40) severedHead=null;
  }
  for(var i=bloodParts.length-1;i>=0;i--){
    var p=bloodParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if(p.life<=0) bloodParts.splice(i,1);
  }
  if(!chaser && deathChaserSnap) drawCorruptedStudent(ctx, deathChaserSnap.x, deathChaserSnap.y, deathChaserSnap.w, deathChaserSnap.h);
  if(severedHead){
    ctx.save();
    ctx.translate(severedHead.x,severedHead.y);
    ctx.rotate(severedHead.rot);
    pxRect(-3,-3,6,7,'#d9cfc4');
    pxRect(-2,-2,4,5,'#b89a86');
    pxRect(-2,-1,1,1,'#222'); pxRect(1,-1,1,1,'#222');
    pxRect(-2,2,4,1,'#5a1010');
    pxRect(-3,3,6,2,'#9a0d0d');
    ctx.restore();
  }
  for(var j=0;j<bloodParts.length;j++){
    var q=bloodParts[j];
    pxRect(q.x,q.y,q.sz,q.sz,'#a00d0d');
  }
}
function drawChaserDeath(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  if(el<3000){ pxRect(0,0,W,H,'rgba(0,0,0,0.25)'); return; }
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  var t=110-caughtTimer;
  var a=Math.min(1,t/25);            // 渐显
  pxRect(0,0,W,H,'rgba(0,0,0,'+(0.55+0.4*a)+')');
  ctx.fillStyle='rgba(210,0,0,'+a+')';
  ctx.font='bold 60px "Courier New","SimSun",monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('你死了',W/2,H/2);
  ctx.restore();
}


// ── Render ──
function render(){
  ctx.clearRect(0,0,W,H);

  var sx=screenShake>0?(Math.random()-0.5)*screenShake:0;
  var sy=screenShake>0?(Math.random()-0.5)*screenShake:0;
  ctx.save();
  ctx.translate(sx,sy);

  // Floor
  pxRect(B.L,B.T,B.R-B.L,B.B-B.T,P.FLOOR);

  // Top rooms
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    var color=P.ROOM;
    if(i===3) color='#141a14'; // Zhang's office slightly green
    if(i===4) color='#181814'; // tea room slightly warm
    if(c.bp){
      drawRoom(c.x,roomTopY,c.w,roomTopH+gapH+roomBotH,c.t||c.b,color);
    }else{
      drawRoom(c.x,roomTopY,c.w,roomTopH,c.t,color);
    }
  }

  // Corridor
  pxRect(B.L,gapY,B.R-B.L,gapH,P.CORR);
  pxText('二  楼  走  廊',B.L+CW/2+1,gapY+gapH/2-6+1,'#000',9,'center');
  pxText('二  楼  走  廊',B.L+CW/2,gapY+gapH/2-6,'#888',9,'center');

  // Bottom rooms
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    if(c.bp) continue;
    var color=P.ROOM;
    if(i===3) color='#181818'; // teacher office
    if(i===2) color='#1a1818'; // art room slightly warm
    drawRoom(c.x,roomBotY,c.w,roomBotH,c.b,color);
  }

  // Hall
  pxRect(B.L,hallY,B.R-B.L,hallH,P.HALL);
  pxText('二  楼  大  厅',B.L+CW/2+1,hallY+hallH/2-7+1,'#000',12,'center');
  pxText('二  楼  大  厅',B.L+CW/2,hallY+hallH/2-7,'#aaa',12,'center');

  // Draw doors
  for(var i=0;i<doors.length;i++) drawDoor(doors[i]);

  // Room labels
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    if(!c.bp){
      var lc=i===3?'#8a9a6a':'#aaa';
      pxText(c.t,c.x+c.w/2+1,roomTopY+13+1,'#000',11,'center');
      pxText(c.t,c.x+c.w/2,roomTopY+13,lc,11,'center');
    }
    if(!c.bp && c.b){
      var lc2=i===2?'#9a8a6a':'#aaa';
      pxText(c.b,c.x+c.w/2+1,roomBotY+13+1,'#000',11,'center');
      pxText(c.b,c.x+c.w/2,roomBotY+13,lc2,11,'center');
    }
    if(c.bp){
      pxText(c.t||c.b,c.x+c.w/2+1,roomTopY+(roomTopH+gapH+roomBotH)/2-6+1,'#000',11,'center');
      pxText(c.t||c.b,c.x+c.w/2,roomTopY+(roomTopH+gapH+roomBotH)/2-6,'#aaa',11,'center');
    }
  }

  // ── Room Items ──
  // Zhang's office (top col3) - desk with papers
  drawItem(cols[3].x+cols[3].w/2-6,roomTopY+30,'desk');
  drawItem(cols[3].x+cols[3].w/2-10,roomTopY+28,'chair');
  drawItem(cols[3].x+30,roomTopY+25,'cabinet');
  drawItem(cols[3].x+cols[3].w-40,roomTopY+25,'locker');

  // Teacher office (bottom col3) - multiple desks
  drawItem(cols[3].x+20,roomBotY+35,'desk');
  drawItem(cols[3].x+50,roomBotY+33,'chair');
  drawItem(cols[3].x+cols[3].w/2-6,roomBotY+45,'desk');
  drawItem(cols[3].x+cols[3].w-40,roomBotY+25,'cabinet');

  // Tea room (top col4) - teapot and cabinet
  drawItem(cols[4].x+cols[4].w/2-5,roomTopY+35,'teapot');
  drawItem(cols[4].x+cols[4].w-30,roomTopY+25,'cabinet');
  drawItem(cols[4].x+15,roomTopY+40,'desk');

  // Bathroom (bottom col4) - no special items
  pxRect(cols[4].x+cols[4].w/2-10,roomBotY+30,20,14,'#1a1e20');
  drawBorder(cols[4].x+cols[4].w/2-10,roomBotY+30,20,14,'#333',1);

  // Art room (bottom col2) - easels + bed + 走廊入口
  drawItem(cols[2].x+25,roomBotY+30,'easel');
  drawItem(cols[2].x+cols[2].w-40,roomBotY+28,'easel');
  drawItem(cols[2].x+(cols[2].w-28)/2,roomBotY+52,'bed');
  // 开口（左侧）：擦掉走廊与画室之间的视觉边框，让角色可从走廊走入
  var artDoorW=24;
  var artDoorX=cols[2].x+10;
  pxRect(artDoorX,gapYE,artDoorW,4,P.FLOOR);
  pxRect(artDoorX,gapYE-2,artDoorW,2,P.CORR);

  // Classroom desks (201, 202, 203)
  for(var cls=1;cls<=2;cls++){
    if(cls===1){
      drawItem(cols[1].x+20,roomTopY+40,'desk');
      drawItem(cols[1].x+cols[1].w-35,roomTopY+38,'desk');
      drawItem(cols[1].x+20,roomBotY+40,'desk');
      drawItem(cols[1].x+cols[1].w-35,roomBotY+38,'desk');
    }
    if(cls===2){
      drawItem(cols[2].x+20,roomTopY+40,'desk');
      drawItem(cols[2].x+cols[2].w-35,roomTopY+38,'desk');
    }
  }

  // Stairs icons
  // Left stairs (col0) - going down
  pxRect(cols[0].x,roomTopY+20,cols[0].w-4,roomTopH+gapH+roomBotH-40,'#1a1a18');
  for(var syy=0;syy<5;syy++){ pxRect(cols[0].x+4,roomTopY+25+syy*16,cols[0].w-12,6,'#2a2a2a'); }
  pxText('↓1F',cols[0].x+cols[0].w/2,roomTopY+roomTopH/2+gapH/2,'#555',9,'center');

  // Right stairs (col5) - going up, locked gate
  pxRect(cols[5].x+4,roomTopY+20,cols[5].w-12,roomTopH+gapH+roomBotH-40,'#1a1a18');
  for(var syy=0;syy<5;syy++){ pxRect(cols[5].x+8,roomTopY+25+syy*16,cols[5].w-20,6,'#2a2a2a'); }
  if(stairsLocked){

  }else{

  // Plants near hall
  drawItem(B.L+20,hallY+hallH-18,'plant');
  drawItem(B.R-26,hallY+hallH-18,'plant');

  // Draw walls overlay
  for(var i=0;i<walls.length;i++){

  drawBorder(B.L,B.T,B.R-B.L,B.B-B.T,P.WALL3,4);

  // Player
  drawPlayer(player.x,player.y);

  // Chaser shadow
  drawChaser();
  drawDeathAnim();


  // Interaction hint
  if(interactionHint && !dialog && !pwDialog && !bedDialog){

  }

  ctx.restore();

  // Darkness / visibility overlay (player-only light)
  var px2=player.x+player.w/2;
  var py2=player.y+player.h/2;
  var grad2=ctx.createRadialGradient(px2,py2,35,px2,py2,240);
  grad2.addColorStop(0,'rgba(0,0,0,0)');
  grad2.addColorStop(0.20,'rgba(0,0,0,0.45)');
  grad2.addColorStop(0.45,'rgba(0,0,0,0.80)');
  grad2.addColorStop(0.70,'rgba(0,0,0,0.95)');

  ctx.fillStyle=grad2;
  ctx.fillRect(0,0,W,H);

  if(stairsLocked){
    pxText('三楼:封锁',W-120,H-16,P.RED,8,'right');
  }else{
    pxText('三楼:解锁',W-120,H-16,P.GREEN,8,'right');
  }
  pxText('二楼走廊',W-30,H-16,P.HINT,8,'right');

  // Tip
  if(tipText){
    var tw2=tipText.length*7;
    pxRect(W/2-tw2/2-6,4,tw2+12,16,'rgba(0,0,0,0.85)');

  }

  // Time HUD (top-right)
  drawTimeHUD();

  // Dialog
  if(dialog){
    pxRect(0,0,W,H,'rgba(0,0,0,0.7)');
    // 画作画面使用更大的对话框以容纳完整画作与画架

    var dw=isArt?360:480, dh=isArt?440:300;

    pxRect(dx,dy,dw,dh,P.DIALOG_BG);
    drawBorder(dx,dy,dw,dh,P.DIALOG_BORDER,3);
    pxRect(dx,dy,dw,22,'#1a1a1a');
    drawBorder(dx,dy,dw,22,P.DIALOG_BORDER,1);
    pxText(dialog.title,dx+dw/2,dy+5,P.DIALOG_TITLE,11,'center');

    var lines=dialog.text.split('\n');
    if(dialog.special==='tea'){
      // 钟表 + 镜子
      var clockCX=dx+dw*0.3, clockCY=dy+dh*0.52, clockR=60;
      // 钟面外圈
      ctx.beginPath(); ctx.arc(clockCX,clockCY,clockR,0,Math.PI*2);
      ctx.fillStyle='#f5f0e8'; ctx.fill();
      ctx.strokeStyle='#3a3028'; ctx.lineWidth=3; ctx.stroke();
      // 钟面内圈
      ctx.beginPath(); ctx.arc(clockCX,clockCY,clockR-6,0,Math.PI*2);
      ctx.strokeStyle='#8a7a6a'; ctx.lineWidth=1; ctx.stroke();
      // 刻度 12,3,6,9
      var tickMarks=[{a:-Math.PI/2,t:'12'},{a:0,t:'3'},{a:Math.PI/2,t:'6'},{a:Math.PI,t:'9'}];
      ctx.fillStyle='#2a2018'; ctx.font='11px "Courier New",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(var i=0;i<tickMarks.length;i++){
        var ta=tickMarks[i];
        ctx.fillText(ta.t, clockCX+Math.cos(ta.a)*(clockR-14), clockCY+Math.sin(ta.a)*(clockR-14));
      }
      // 时针 (8:08 → 时针指向 8 点略过，canvas 角度约 154°)
      ctx.beginPath(); ctx.moveTo(clockCX,clockCY);
      ctx.lineTo(clockCX+Math.cos(154*Math.PI/180)*22, clockCY+Math.sin(154*Math.PI/180)*22);
      ctx.strokeStyle='#1a1008'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
      // 分针 (8分 → 48° 顺时针，canvas 角度 318°)
      ctx.beginPath(); ctx.moveTo(clockCX,clockCY);
      ctx.lineTo(clockCX+Math.cos(318*Math.PI/180)*35, clockCY+Math.sin(318*Math.PI/180)*35);
      ctx.strokeStyle='#cc0000'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.stroke();
      // 中心点
      ctx.beginPath(); ctx.arc(clockCX,clockCY,3,0,Math.PI*2); ctx.fillStyle='#1a1008'; ctx.fill();

      // 镜子
      var mirrorX=dx+dw*0.6, mirrorY=dy+dh*0.28, mirrorW=100, mirrorH=130;
      // 镜框
      pxRect(mirrorX,mirrorY,mirrorW,mirrorH,'#3a3028');
      drawBorder(mirrorX,mirrorY,mirrorW,mirrorH,'#5a4a3a',2);
      // 镜面
      ctx.fillStyle='#8899aa';
      ctx.fillRect(mirrorX+6,mirrorY+6,mirrorW-12,mirrorH-12);
      // 反光斜线
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(mirrorX+8,mirrorY+50); ctx.lineTo(mirrorX+8,mirrorY+20); ctx.lineTo(mirrorX+mirrorW-30,mirrorY+8); ctx.lineTo(mirrorX+mirrorW-20,mirrorY+8); ctx.fill();
      // 镜中人影轮廓
      ctx.fillStyle='rgba(30,40,50,0.35)';
      ctx.beginPath(); ctx.ellipse(mirrorX+mirrorW/2,mirrorY+mirrorH-30,16,22,0,0,Math.PI*2); ctx.fill(); // 身体
      ctx.beginPath(); ctx.arc(mirrorX+mirrorW/2,mirrorY+mirrorH-60,10,0,Math.PI*2); ctx.fill(); // 头
      // 诡异红眼点
      ctx.fillStyle='#cc0000'; ctx.beginPath();
      ctx.arc(mirrorX+mirrorW/2-3,mirrorY+mirrorH-62,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(mirrorX+mirrorW/2+3,mirrorY+mirrorH-62,2,0,Math.PI*2); ctx.fill();
      // 文字提示
      pxText('8:08',clockCX,clockCY+clockR+5,'#8a7a6a',9,'center');
      // 王伯手写批注
      ctx.font='12px "KaiTi","SimSun","STKaiti",serif';
      ctx.fillStyle='#5a3020';

      ctx.fillText('王伯：镜中为真·····', mirrorX, mirrorY+mirrorH+16);
    }else if(dialog.special==='artPaint'){
      drawArtPaint(dx,dy,dw,dh);
    }else{
      for(var li=0;li<lines.length;li++){

      pxText('请输入教师工号：',pdx+20,pdy+56,P.DIALOG_TEXT,11);
    }

    pxRect(pdx+20,pdy+74,180,22,'#0a0a0a');
    drawBorder(pdx+20,pdy+74,180,22,'#555',1);
    pxText(new Array(pwDialog.input.length+1).join('*'),pdx+24,pdy+78,'#8a8a8a',13);
    if(Math.floor(Date.now()/500)%2) pxRect(pdx+24+pwDialog.input.length*8,pdy+76,6,18,'#fff');

  // Bed dialog — 时间/日期选择

    var WEEK=['日','一','二','三','四','五','六'];
    pxText('选择星期：',bx+20,by+40,P.DIALOG_TEXT,10);
    var cw=44,gap=3,startX=bx+20,cy=by+56;
    for(var i=0;i<7;i++){

      var sel=i===bedDialog.day;
      pxRect(cx,cy,cw,22, sel?'#2a5a2a':'#0a0a0a');

    pxText('选择时刻：',bx+20,by+108,P.DIALOG_TEXT,10);
    var hh=(bedDialog.hour<10?'0':'')+bedDialog.hour;
    pxRect(bx+20,by+122,72,24,'#0a0a0a');

    pxText(hh+':00',bx+56,by+128,'#8a8a8a',14,'center');
    pxText('（↑↓ 调整小时）',bx+104,by+128,P.DIALOG_TEXT,9);

    pxText('[←→] 星期   [↑↓] 时刻   [F] 确认   [Esc] 取消',
      bx+bw/2,by+bh-20,P.HUD,9,'center');
  }

  // 全屏红色闪烁（黑影追逐期间）
  if(redFlashOn){
    var rf=Math.sin(Date.now()*0.006)*0.12+0.2; // 0.08~0.32 脉冲
    pxRect(0,0,W,H,'rgba(150,0,0,'+rf+')');
  }

  // 被黑影追上："你死了"大字
  drawChaserDeath();
}

// Password input
window.addEventListener('keydown',function(e){
  if(!pwDialog || dialog || bedDialog) return;
  if(pwDialog.justOpened){ pwDialog.justOpened=false; return; }
  if(e.key.length===1 && /^[a-zA-Z0-9\-]$/.test(e.key)){
    pwDialog.input+=e.key;
    pwDialog.error='';
    e.preventDefault();
  }else if(e.key==='Backspace'){
    pwDialog.input=pwDialog.input.slice(0,-1);
    pwDialog.error='';
    e.preventDefault();
  }
});

// Game Loop
function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ── 脚步声系统 ──
var Footsteps = {
    audioCtx: null,
    isPlaying: false,
    lastStepTime: 0,
    stepInterval: 250,
    
    init: function() {
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            console.log('✅ 脚步声音频系统初始化成功');
        } catch(e) {
            console.error('❌ 音频初始化失败:', e);
        }
    },
    
    playStep: function() {
        if (!this.audioCtx) this.init();
        if (!this.audioCtx) return;
        
        var now = Date.now();
        if (now - this.lastStepTime < this.stepInterval) return;
        
        this.lastStepTime = now;
        
        try {
            const ctx = this.audioCtx;
            const duration = 0.15;
            
            const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < data.length; i++) {
                const t = i / ctx.sampleRate;
                let sample = 0;
                
                if (t < 0.01) {
                    sample = (t / 0.01) * Math.random() * 0.4;
                } else if (t < 0.05) {
                    sample = Math.random() * 0.5 + 0.3;
                    sample += Math.sin(t * 400) * 0.1;
                    sample += Math.sin(t * 1000) * 0.03;
                } else if (t < 0.1) {
                    const decay = (t - 0.05) / 0.05;
                    sample = (1 - decay) * (Math.random() * 0.3 + 0.15);
                    sample += Math.sin(t * 200) * 0.04 * (1 - decay);
                } else if (t < duration) {
                    const fade = (t - 0.1) / (duration - 0.1);
                    sample = (1 - fade) * Math.random() * 0.08;
                }
                
                data[i] = sample * 0.5;
            }
            
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            
            const gainNode = ctx.createGain();
            gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            
            source.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            source.start(0);
            
        } catch(e) {
            console.warn('脚步声播放错误:', e);
        }
    },
    
    start: function() {
        if (!this.isPlaying) {
            this.isPlaying = true;
            if (!this.audioCtx && typeof AudioContext !== 'undefined') {
                this.init();
            }
        }
    },
    
    stop: function() {
        this.isPlaying = false;
        this.lastStepTime = 0;
    },
    
    update: function(isMoving, walkTimer) {
        if (isMoving) {
            this.start();
            if (walkTimer === 0 || walkTimer % 12 === 0) {
                this.playStep();
            }
        } else {
            this.stop();
        }
    }
};

// 初始化脚步声系统
document.addEventListener('DOMContentLoaded', function() {
    document.addEventListener('keydown', function() {
        if (!Footsteps.audioCtx) {
            Footsteps.init();
        }
    });
});

tip('WASD 移动角色，靠近房间/楼梯按 F 互动');

gameLoop();
})();
