<audio id="map8-bgm" src="map8.mp3" autoplay loop preload="auto" style="display:none"></audio>
<script>
// 在游戏脚本前立即启动 BGM，避免被后续脚本干扰
(function(){
  var bgm = document.getElementById('map8-bgm');
  if(!bgm) return;
  bgm.volume = 0.6;
  var retry = function(){
    bgm.play().catch(function(e){
      console.warn('map8 bgm blocked, waiting for interaction');
    });
  };
  retry();
  document.addEventListener('keydown', function once(){
    retry();
    document.removeEventListener('keydown', once);
  });
  document.addEventListener('click', function once(){
    retry();
    document.removeEventListener('click', once);
  });
})();
</script>
<script>

<script>

// ── 地图边界 ──
// 长走廊：横向很宽，纵向很窄
// 玩家在 ~2000x300 的世界里探索
var B={L:0, T:0, R:2400, B:300};
var CW=B.R-B.L, CH=B.B-B.T;

var interactionHint=null;

// ── 玩家 ──
var player={
  x:B.L+30, y:B.T+140, w:12, h:18, vx:0, vy:0,
  speed:2.0,           // 追击地图玩家稍快
  facing:3, frame:0, walkTimer:0,
  invuln:0             // 无敌帧（刚进入时短暂保护）
};
window.__xyzh_player=player;
(function(){
  try{
    var r=JSON.parse(sessionStorage.getItem('xyzh_resume')||'null');
    if(r && r.map==='map8.html'){ player.x=r.x; player.y=r.y; sessionStorage.removeItem('xyzh_resume'); }
  }catch(e){}
})();

// ── 相机跟随系统（与 mp5 一致）──
var CAM_ZOOM=2.2;
var camera=null;
function updateCamera(){
  if(!camera){ camera={x:player.x+player.w/2, y:player.y+player.h/2}; return; }
  var tx=player.x+player.w/2;
  var ty=player.y+player.h/2;
  var vw=B.R-B.L, vh=B.B-B.T;
  var cvw=W/CAM_ZOOM, cvh=H/CAM_ZOOM;
  if(cvw<vw){ tx=Math.max(B.L+cvw/2, Math.min(B.R-cvw/2, tx)); }
  if(cvh<vh){ ty=Math.max(B.T+cvh/2, Math.min(B.B-cvh/2, ty)); }
  camera.x=tx; camera.y=ty;
}

// ── 墙体设计 ──
// 思路：水平长走廊（高 80），上下各一条辅走廊（高 30），中间用多道断墙隔出
// 主走廊（中央高 80，y=110..190）贯穿整张图
// 上下辅走廊（高 30，y=20..50 / y=250..280）有岔路口连通
// 多处死路 + T 字路口 + 拐角
var walls=[];

// 上下主墙（沿 B 边界）
walls.push({x:B.L,   y:B.T,    w:CW, h:4});
walls.push({x:B.L,   y:B.B-4,  w:CW, h:4});
walls.push({x:B.L,   y:B.T,    w:4,   h:CH});
walls.push({x:B.R-4, y:B.T,    w:4,   h:CH});

// 主走廊（中央 80 高）上下边界（拆成多段，每段对应一个通道入口）
// 主走廊 y=110..190
// 缺口 x 列表（每个缺口宽 18px，玩家可穿过）
var upperGaps=[280,300,440,610,640,760,830,1240,1260,1450,1500,1950,1980,2050,2080,2180,2200,2270];
var lowerGaps=[300,320,740,800,820,865,900,920,1060,1080,1140,1560,1580,1650,1660,1730,1750,1830,1850,1920];

// 上界（y=108, h=2）：在 x=0..2400 中按 upperGaps 留缺口
(function(){
  var last=0;
  upperGaps.sort(function(a,b){return a-b;});
  for(var i=0;i<upperGaps.length;i++){
    var gx=upperGaps[i]-9;
    if(gx>last){
      walls.push({x:last, y:108, w:gx-last, h:2});
    }
    last=upperGaps[i]+9;
  }
  if(last<2400){
    walls.push({x:last, y:108, w:2400-last, h:2});
  }
})();
// 下界（y=190, h=2）
(function(){
  var last=0;
  lowerGaps.sort(function(a,b){return a-b;});
  for(var i=0;i<lowerGaps.length;i++){
    var gx=lowerGaps[i]-9;
    if(gx>last){
      walls.push({x:last, y:190, w:gx-last, h:2});
    }
    last=lowerGaps[i]+9;
  }
  if(last<2400){
    walls.push({x:last, y:190, w:2400-last, h:2});
  }
})();

// 上辅走廊（y=18..48）下边界：在每个死路/岔路顶墙对应 x 位置留 18px 缺口
// 死路/岔路顶墙的 x 中心
var upperDeadendCenters=[450,820,1260,1660,2040, 300,680,1080,1470,1850,2180];
// 为每个顶墙中心 ±9 留缺口，并合并到 upperGaps
var allUpperGaps=upperGaps.concat(upperDeadendCenters);
(function(){
  var last=0;
  allUpperGaps.sort(function(a,b){return a-b;});
  for(var i=0;i<allUpperGaps.length;i++){
    var gx=allUpperGaps[i]-9;
    if(gx>last){
      walls.push({x:last, y:48, w:gx-last, h:2});
    }
    last=allUpperGaps[i]+9;
  }
  if(last<2400){
    walls.push({x:last, y:48, w:2400-last, h:2});
  }
})();

// 下辅走廊（y=252..282）上边界：同样在死路/岔路对应 x 留缺口
var lowerDeadendCenters=[450,820,1260,1660,2040, 300,680,1080,1470,1850,2180];
var allLowerGaps=lowerGaps.concat(lowerDeadendCenters);
(function(){
  var last=0;
  allLowerGaps.sort(function(a,b){return a-b;});
  for(var i=0;i<allLowerGaps.length;i++){
    var gx=allLowerGaps[i]-9;
    if(gx>last){
      walls.push({x:last, y:252, w:gx-last, h:2});
    }
    last=allLowerGaps[i]+9;
  }
  if(last<2400){
    walls.push({x:last, y:252, w:2400-last, h:2});
  }
})();

// === 主走廊内的隔墙（让长走廊有节奏感） ===
// 隔墙 A：x=320, 主走廊中段（留一个 30px 缺口 y=140-170 让玩家绕）

walls.push({x:320, y:170, w:4, h:20});

walls.push(wall700Top);

// 隔墙 F：x=1360
walls.push({x:1360, y:108, w:4, h:22});
walls.push({x:1360, y:152, w:4, h:38});
// 隔墙 G：x=1560
walls.push({x:1560, y:108, w:4, h:30});
walls.push({x:1560, y:170, w:4, h:20});
// 隔墙 H：x=1800
walls.push({x:1800, y:108, w:4, h:38});
walls.push({x:1800, y:170, w:4, h:20});
// 隔墙 I：x=2040
walls.push({x:2040, y:108, w:4, h:20});
walls.push({x:2040, y:158, w:4, h:32});

walls.push({x:400,  y:86, w:4, h:22});

walls.push({x:600,  y:72, w:4, h:36});
walls.push({x:820,  y:48, w:4, h:32});
walls.push({x:820,  y:80, w:4, h:28});
walls.push({x:1020, y:48, w:4, h:26});
walls.push({x:1020, y:74, w:4, h:34});
walls.push({x:1240, y:48, w:4, h:34});
walls.push({x:1240, y:82, w:4, h:26});
walls.push({x:1440, y:48, w:4, h:22});
walls.push({x:1440, y:70, w:4, h:38});
walls.push({x:1680, y:48, w:4, h:30});
walls.push({x:1680, y:78, w:4, h:30});
walls.push({x:1900, y:48, w:4, h:36});
walls.push({x:1900, y:84, w:4, h:24});

walls.push({x:2100, y:70, w:4, h:38});

// 下辅走廊 y=252..282 隔墙
walls.push({x:240,  y:222, w:4, h:30});
walls.push({x:240,  y:252, w:4, h:30});
walls.push({x:460,  y:214, w:4, h:38});
walls.push({x:460,  y:252, w:4, h:30});

walls.push({x:680,  y:252, w:4, h:30});

walls.push({x:880,  y:252, w:4, h:30});
walls.push({x:1100, y:220, w:4, h:32});

walls.push({x:1740, y:252, w:4, h:30});
walls.push({x:1960, y:222, w:4, h:30});
walls.push({x:1960, y:252, w:4, h:30});
walls.push({x:2160, y:214, w:4, h:38});
walls.push({x:2160, y:252, w:4, h:30});

// === 死路：主走廊中部向上/向下分叉，到尽头再回来 ===
// 死路 1：x=380..520, y=48..108 的上侧死路（入口在 x=450 处 y=108）
walls.push({x:380, y:48,  w:4,   h:60});  // 左
walls.push({x:516, y:48,  w:4,   h:60});  // 右
walls.push({x:380, y:48,  w:140, h:4});   // 顶
// D2 死路 + B3 短旁通 中间隔板已打通（删除 D2 右墙 + B3 左墙）
// 原 D2 区域：x=740..900, y=190..252
walls.push({x:740, y:190, w:4,  h:62});   // D2 左墙保留
walls.push({x:740, y:248, w:160, h:4});   // D2 底墙保留

walls.push({x:1180, y:48, w:4,  h:60});
walls.push({x:1336, y:48, w:4,  h:60});
walls.push({x:1180, y:48, w:160, h:4});
// 原死路 4（D4）已删除，与 B6 Z 回路合并 → 现标记为 B6
// B6 区域底墙（D4 旧址底墙）
walls.push({x:1580, y:190, w:4,  h:62});  // 左墙
walls.push({x:1580, y:248, w:160, h:4});  // D4 旧址底墙
// 死路 5（D4）：x=1960..2120, y=48..108
walls.push({x:1960, y:48, w:4,  h:60});
walls.push({x:2116, y:48, w:4,  h:60});
walls.push({x:1960, y:48, w:160, h:4});
// 内部中央纵墙（短）— 留大段顶部/底部缺口让玩家跨越
walls.push({x:2040, y:84,  w:4,  h:14});  // 中央纵墙 y=84..98

// === D4 走廊隔断墙：x=2040 中间位置 4×80 ===
// 迫使玩家从 D4 死路内部走
walls.push({x:2040, y:110, w:4, h:80});  // D4 中央正下方主走廊隔断

// === 岔路 1：上侧 L 型回路（x=600..760） ===
// 玩家从主走廊 x=620 进入（沿 y=108 缺口）→ 沿顶部走 → 拐右下 → 从 x=720 走出
// 外框 = 矩形；内部只用一段斜向小墙挡住直路
walls.push({x:600, y:48,  w:4,  h:60});   // 左墙（y=48..108）
walls.push({x:760, y:48,  w:4,  h:36});   // 右墙上半段（y=48..84）
walls.push({x:600, y:48,  w:164, h:4});   // 顶墙
// L 内部隔墙：靠左下，让玩家从右下进入、沿底部走、再从左上出
walls.push({x:680, y:84,  w:4,  h:24});   // 内部小墙（y=84..108）
// 右墙下半段（y=84..108）已删除，玩家可从右下角直接穿入 L 回路
// 路径：x=620 进入 → 沿顶部走到 x=720 → 直接掉到下方主走廊（无阻碍）

// === 岔路 2：下侧 L 型回路（x=1000..1160） ===
walls.push({x:1000, y:190, w:4,  h:62});
walls.push({x:1160, y:190, w:4,  h:62});
walls.push({x:1000, y:248, w:164, h:4});
walls.push({x:1080, y:190, w:4,  h:30});  // 内部小墙（y=190..220）

// === 岔路 3：上侧 T 字路口（x=1380..1560） ===
// 玩家从主走廊可选：直走 / 左拐死路 / 右拐死路
walls.push({x:1380, y:48,  w:4,  h:60});
walls.push({x:1560, y:48,  w:4,  h:60});
walls.push({x:1380, y:48,  w:184, h:4});
// 内部中央纵墙（短）— 留大段顶部/底部缺口让玩家跨越
walls.push({x:1470, y:84,  w:4,  h:14});  // 中央纵墙 y=84..98（顶部 36px + 底部 10px 缺口）

// === B5 走廊隔断墙：x=1470 中间位置 4×80 ===
// 迫使玩家从 B5 T 字内部走
walls.push({x:1470, y:110, w:4,  h:80});  // B5 中央正下方主走廊隔断

// === 岔路 4：下侧十字路口（x=1760..1940，左墙已删除与死路 4 合并） ===
walls.push({x:1940, y:190, w:4,  h:62});
walls.push({x:1760, y:248, w:184, h:4});
// 内部断墙形成 Z 形（让玩家在里面绕一下）
walls.push({x:1800, y:222, w:4,  h:30});
walls.push({x:1900, y:190, w:4,  h:28});

// === 岔路 5：上侧双 L 回路（x=2080..2280） ===
walls.push({x:2080, y:48,  w:4,  h:60});
walls.push({x:2280, y:48,  w:4,  h:60});
walls.push({x:2080, y:48,  w:204, h:4});
// 中间分隔 + 两个小 L
walls.push({x:2180, y:48,  w:4,  h:30});  // 中间上墙
walls.push({x:2180, y:96,  w:4,  h:12});  // 中间下墙（留 18px 缝隙）
// 玩家可走左上 L 或右上 L
walls.push({x:2120, y:84,  w:4,  h:24});  // 左下小墙
walls.push({x:2240, y:84,  w:4,  h:24});  // 右下小墙

// === 岔路 6：主走廊中部垂直旁通（x=260..320 上方 & x=880..940 下方） ===
// 玩家在主走廊遇到掉落的柜子时，可绕进这些短旁通
// 6a 上侧短旁通（绕过 x=320 隔墙）
walls.push({x:260, y:48,  w:4,  h:60});
walls.push({x:340, y:48,  w:4,  h:60});
walls.push({x:260, y:48,  w:84, h:4});
walls.push({x:300, y:84,  w:4,  h:24});
// B3 短旁通：与 D2 打通后，左墙已删除
walls.push({x:960, y:190, w:4,  h:62});   // B3 右墙
walls.push({x:880, y:248, w:84, h:4});    // B3 底墙

// === 岔路 7：下侧三岔口（x=2240..2360, 出口前最后选择） ===
// 玩家接近出口时，可选择：直接冲刺 / 拐入短支路
walls.push({x:2240, y:190, w:4,  h:62});
walls.push({x:2340, y:190, w:4,  h:62});
walls.push({x:2240, y:248, w:104, h:4});
// 内部加个小隔断
walls.push({x:2290, y:222, w:4,  h:30});

// ── 装饰：岔路口指示（已删除，地图上不要字）──

// ── 静态障碍物（开始就在的家具）──

// ── 碰撞 ──
function collides(x,y,w,h){
  for(var i=0;i<walls.length;i++){
    var ww=walls[i];
    if(x<ww.x+ww.w && x+w>ww.x && y<ww.y+ww.h && y+h>ww.y) return true;
  }
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    if(x<o.x+o.w && x+w>o.x && y<o.y+o.h && y+h>o.y) return true;
  }
  for(var i=0;i<fallingCabinets.length;i++){
    var f=fallingCabinets[i];
    if(!f.triggered) continue;
    if(x<f.x+f.w && x+w>f.x && y<f.y+f.h && y+h>f.y) return true;
  }
  return false;
}

// ── A* 寻路（4 方向，绕过墙体）──
// 工具：把 (px,py) 吸附到最近的可走格，避免目标点/起点刚好落在墙里导致 A* 失败
function snapToWalkable(px,py,boxW,boxH){
  var step=10;
  // 在 ±2 步范围内搜索最近的可走格
  var best=null, bestD=Infinity;
  for(var dx=-2;dx<=2;dx++){
    for(var dy=-2;dy<=2;dy++){
      var cx=Math.floor((px+dx*step-B.L)/step);
      var cy=Math.floor((py+dy*step-B.T)/step);
      if(cx<0||cy<0) continue;
      var rx=B.L+cx*step, ry=B.T+cy*step;
      if(!collides(rx,ry,boxW,boxH)) continue;
      var dd=Math.abs(rx-px)+Math.abs(ry-py);
      if(dd<bestD){ bestD=dd; best={x:rx+9,y:ry+12}; }
    }
  }
  return best;
}

function aStar(sx,sy,ex,ey){
  // 把世界离散到 10 像素网格
  var step=10;
  var gw=Math.floor(CW/step)+2;
  var gh=Math.floor(CH/step)+2;
  // 起终点若落在墙里，先吸附到最近的可走格
  if(collides(sx-9,sy-12,18,24)){
    var sp=snapToWalkable(sx,sy,18,24);
    if(sp){ sx=sp.x; sy=sp.y; } else return null;
  }
  if(collides(ex-9,ey-12,18,24)){
    var ep=snapToWalkable(ex,ey,18,24);
    if(ep){ ex=ep.x; ey=ep.y; } else return null;
  }
  var ox=Math.floor((sx-B.L)/step);
  var oy=Math.floor((sy-B.T)/step);
  var tx=Math.floor((ex-B.L)/step);
  var ty=Math.floor((ey-B.T)/step);
  function ok(px,py){
    if(px<0||py<0||px>=gw||py>=gh) return false;
    // 像素坐标（chaser 不撞墙，沿用真实实体大小）
    var rx=B.L+px*step, ry=B.T+py*step;
    return !collides(rx,ry,18,24);
  }
  if(!ok(ox,oy)||!ok(tx,ty)) return null;
  var open=[{x:ox,y:oy,g:0,h:Math.abs(tx-ox)+Math.abs(ty-oy),p:null}];
  var closed={};
  function key(x,y){return x+','+y;}
  var maxIter=4000;  // 防止极端情况下卡死
  while(open.length>0 && maxIter-- > 0){
    // 找最小 f
    var bi=0;
    for(var i=1;i<open.length;i++) if((open[i].g+open[i].h)<(open[bi].g+open[bi].h)) bi=i;
    var cur=open[bi];
    if(cur.x===tx && cur.y===ty){
      var path=[];
      while(cur){ path.push({x:B.L+cur.x*step+9, y:B.T+cur.y*step+12}); cur=cur.p; }
      path.reverse();
      return path;
    }
    open.splice(bi,1);
    closed[key(cur.x,cur.y)]=1;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var d=0;d<4;d++){
      var nx=cur.x+dirs[d][0], ny=cur.y+dirs[d][1];
      var k=key(nx,ny);
      if(closed[k]) continue;
      if(!ok(nx,ny)) continue;
      var ng=cur.g+1;
      var found=false;
      for(var i=0;i<open.length;i++){
        if(open[i].x===nx && open[i].y===ny){
          found=true;
          if(ng<open[i].g){
            open[i].g=ng; open[i].p=cur;
          }
          break;
        }
      }
      if(!found){
        open.push({x:nx,y:ny,g:ng,h:Math.abs(tx-nx)+Math.abs(ty-ny),p:cur});
      }
    }
  }
  return null;
}

// ── 移动玩家 ──
function updatePlayer(){
  var mx=0,my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;
  if(mx!==0 && my!==0){ mx*=0.707; my*=0.707; }
  if(mx!==0||my!==0){
    var nx=player.x+mx*player.speed;
    if(!collides(nx,player.y,player.w,player.h)) player.x=nx;
    var ny=player.y+my*player.speed;
    if(!collides(player.x,ny,player.w,player.h)) player.y=ny;
    if(Math.abs(mx)>Math.abs(my)){ player.facing=mx>0?3:2; }
    else if(my!==0){ player.facing=my>0?0:1; }
    player.walkTimer++;
    if(player.walkTimer>10){ player.frame=(player.frame+1)%2; player.walkTimer=0; }
    // 脚印
    if(player.walkTimer===0 && gameTime%4===0){
      footprints.push({x:player.x+player.w/2+(mx>0?-2:(mx<0?2:0)), y:player.y+player.h-1, life:120});
    }
  } else {
    player.frame=0; player.walkTimer=0;
  }
  if(player.invuln>0) player.invuln--;
}

// ── 触发掉落的柜子 ──
function updateFallingCabinets(){
  for(var i=0;i<fallingCabinets.length;i++){
    var f=fallingCabinets[i];
    if(f.triggered){
      // 自由落体
      f.fallVy+=0.6;  // 重力
      f.y+=f.fallVy;
      if(f.y>=f.targetY){
        f.y=f.targetY;
        f.fallVy=0;
        // 落地震动
        if(!f._shook){
          f._shook=true;
          screenShake=8;
        }
      }
      continue;
    }
    // 检查玩家是否在触发区
    var px=player.x+player.w/2, py=player.y+player.h/2;
    if(px>f.x-14 && px<f.x+f.w+14 && py>f.y-40 && py<f.y+f.h+40){
      f.triggered=true;
      f.fallY=f.y-220;
      f.y=f.fallY;
      // 柜子掉落的反馈（黑影已在玩家进入地图时自动生成）
      if(!f._firstDropTip){
        f._firstDropTip=true;
        tipText='柜子……掉下来了！';
        tipTimer=120;
        screenShake=4;
        redFlashTimer=20;
      } else {
        screenShake=4;
        tipText='又……掉下来一个！';
        tipTimer=90;
      }
    }
  }
}

// ── 追逐黑影更新 ──
function updateChaser(){
  if(DEV_NO_CHASER || !chaser) return;
  if(gameTime<chaseStartFrame){
    // 延迟中：只显示位置缓慢左移出现
    chaser.x=B.L+10;
    return;
  }
  // 定时重算路径（每 10 帧 ≈ 0.17s，反应更跟手）
  chaser.pathTimer++;
  // 记录上一次方向（用于惩罚掉头）
  if(!chaser._lastDx){ chaser._lastDx=1; chaser._lastDy=0; }
  if(!chaser.path || chaser.path.length===0 || chaser.pathTimer>10){
    var tx=player.x+player.w/2;
    var ty=player.y+player.h/2;
    // 玩家方向上的预测点（A* 偏向"截击"前方而不是当前点，避免永远追尾）
    var vx=keys['d']||keys['arrowright']?1:keys['a']||keys['arrowleft']?-1:0;
    var vy=keys['s']||keys['arrowdown']?1:keys['w']||keys['arrowup']?-1:0;
    if(vx!==0||vy!==0){
      var mag=Math.sqrt(vx*vx+vy*vy);
      tx += (vx/mag)*40;
      ty += (vy/mag)*40;
    }
    var start={x:chaser.x+chaser.w/2, y:chaser.y+chaser.h/2};
    var newPath=aStar(start.x,start.y,tx,ty);
    if(newPath && newPath.length>0){
      chaser.path=newPath;
      chaser.pathIdx=0;
      chaser.pathTimer=0;
    } else {
      // A* 失败：降级为直追（不撞墙也算动起来）
      chaser.path=null;
    }
  }
  var spd=player.speed*CHASE_CHASER_RATIO*CHASE_SPEED_MUL;
  // 距离 < 130 时降低到玩家 0.5 倍速度，避免贴身秒死、给玩家挣脱空间
  var distToPlayer=Math.sqrt((player.x+player.w/2-chaser.x)*(player.x+player.w/2-chaser.x)+(player.y+player.h/2-chaser.y)*(player.y+player.h/2-chaser.y));
  if(distToPlayer<130){
    spd=player.speed*0.5*CHASE_SPEED_MUL;
  }
  // 斜方向（dx、dy 都不为 0）走得更慢，模拟"斜着走更费力"
  // 提前计算方向（两个分支都要用）
  var chDirX=0, chDirY=0;
  if(chaser.path && chaser.path.length>0){
    var tg=chaser.path[Math.min(chaser.pathIdx, chaser.path.length-1)];
    chDirX=tg.x-chaser.x; chDirY=tg.y-chaser.y;
  } else {
    chDirX=player.x+player.w/2-chaser.x; chDirY=player.y+player.h/2-chaser.y;
  }
  if(Math.abs(chDirX)>0.5 && Math.abs(chDirY)>0.5){
    spd *= 0.85;
  }
  if(chaser.path && chaser.path.length>0){
    var tgt=chaser.path[Math.min(chaser.pathIdx, chaser.path.length-1)];
    var dx=tgt.x-chaser.x, dy=tgt.y-chaser.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<3){
      chaser.pathIdx++;
      // 到终点：清空，下一帧重算（避免反复追同一格）
      if(chaser.pathIdx>=chaser.path.length){
        chaser.path=null;
        chaser.pathTimer=999;
      }
    } else {
      chaser.x+=dx/d*spd;
      chaser.y+=dy/d*spd;
      chaser._lastDx=dx/d; chaser._lastDy=dy/d;
    }
  } else {
    // 降级：直追玩家（无碰撞，所以不卡）
    var dx=player.x+player.w/2-chaser.x;
    var dy=player.y+player.h/2-chaser.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d>0.5){
      chaser.x+=dx/d*spd;
      chaser.y+=dy/d*spd;
      chaser._lastDx=dx/d; chaser._lastDy=dy/d;
    }
  }
  // 上面 spd 已经根据距离调整过了
  // 检测抓捕（扩大一点判定，更易追上）
  if(player.invuln<=0){
    var catchBox={x:chaser.x-4,y:chaser.y-4,w:chaser.w+8,h:chaser.h+8};
    if(player.x<catchBox.x+catchBox.w && player.x+player.w>catchBox.x &&
       player.y<catchBox.y+catchBox.h && player.y+player.h>catchBox.y){
      // 被抓
      caughtDeath=true;
      caughtDeathStart=Date.now();
      playerDead=true;
      if(chaser){ deathChaserSnap={x:player.x+player.w/2-chaser.w/2, y:player.y+player.h/2-chaser.h/2+8, w:chaser.w, h:chaser.h}; }
      biteStart=Date.now(); goreSpawned=false;
      chaser=null;
      // 显示「回到上一个存档点」按钮（若有检查点）
      if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
      // 有存档时不自动跳转，留在死亡画面让玩家选择回档
      setTimeout(function(){
        if(typeof SaveSystem!=='undefined' && SaveSystem.getSaves && SaveSystem.getSaves().length>0){
          if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
        }else{
          window.location.href='start.html';
        }
      }, 4500);
    }
  }
  // 脚印
  if(gameTime%8===0){
    footprints.push({x:chaser.x+chaser.w/2, y:chaser.y+chaser.h-1, life:140, dark:true});
  }
  if(redFlashTimer>0) redFlashTimer--;
}

// ── 坍塌墙检测（玩家靠近时缺口被填满 / 新墙从天而降）──
var collapseDust=[];  // 坍塌灰尘粒子
function spawnCollapseDust(cx,cy,count){
  for(var i=0;i<count;i++){
    collapseDust.push({
      x:cx+(Math.random()-0.5)*12,
      y:cy+Math.random()*24,
      vx:(Math.random()-0.5)*1.4,
      vy:Math.random()*0.8+0.4,
      life:60+Math.floor(Math.random()*30),
      size:1+Math.floor(Math.random()*2)
    });
  }
}
function triggerCollapse(opts){
  // opts: {x,y,w,h, frame, tipText, screenShake, dustCount}
  var fill={x:opts.x, y:opts.y, w:opts.w, h:opts.h};
  walls.push(fill);
  screenShake=opts.screenShake||12;
  tipText=opts.tipText||'墙……塌下来了！';
  tipTimer=120;
  spawnCollapseDust(opts.x, opts.y, opts.dustCount||14);
  return fill;
}
function updateCollapsingWalls(){
  var pcx=player.x+player.w/2;
  var pcy=player.y+player.h/2;

  // 隔墙 C：x=700（原本 18px 短墙，玩家靠近后填充 64px 缺口 → 82px 完整墙）
  if(!wall700Collapsed){
    if(pcx>696 && pcx<708 && pcy>108 && pcy<190){
      wall700Collapsed=true;
      wall700CollapseFrame=gameTime;
      wall700Fill=triggerCollapse({
        x:700, y:126, w:4, h:64,
        frame:gameTime, tipText:'墙……塌下来了！'
      });
    }
  }

  // 隔墙 F：x=830（原本完全不存在，玩家靠近时从天而降 4×80 完整墙，堵死主走廊）
  if(!wall830Collapsed){
    if(pcx>826 && pcx<838 && pcy>108 && pcy<190){
      wall830Collapsed=true;
      wall830CollapseFrame=gameTime;
      wall830Fill=triggerCollapse({
        x:830, y:108, w:4, h:80,
        frame:gameTime,
        tipText:'天花板塌了！快往上看路……',
        screenShake:14,
        dustCount:20
      });
    }
  }

  // 灰尘衰减
  for(var i=collapseDust.length-1;i>=0;i--){
    var d=collapseDust[i];
    d.x+=d.vx; d.y+=d.vy; d.vy+=0.05; d.life--;
    if(d.life<=0) collapseDust.splice(i,1);
  }
}

// ── 找交互 ──
function findInteraction(){
  interactionHint=null;
  if(player.x+player.w/2>exitZone.x && player.y>exitZone.y-10 && player.y<exitZone.y+exitZone.h+10){
    interactionHint=exitZone;
  }
}

// ── 帧更新 ──
function update(){
  gameTime++;
  if(redFlashTimer>0) redFlashTimer--;
  if(!playerDead){
    updatePlayer();
    updateFallingCabinets();
    updateChaser();
    updateCollapsingWalls();
    findInteraction();
  }
  updateCamera();
  if(tipTimer>0) tipTimer--;
  if(tipTimer<=0) tipText='';
  if(screenShake>0) screenShake--;
  // 脚印衰减
  for(var i=footprints.length-1;i>=0;i--){
    footprints[i].life--;
    if(footprints[i].life<=0) footprints.splice(i,1);
  }
}

// ── 绘制基础 ──
function pxRect(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h));
}
function pxText(text,x,y,c,size,align){
  ctx.fillStyle=c||P.TEXT;
  ctx.font=(size||12)+'px "Courier New","SimSun",monospace';
  ctx.textAlign=align||'left';
  ctx.textBaseline='top';
  ctx.fillText(text,x,y);
}
function drawBorder(x,y,w,h,c,t){
  t=t||2;
  pxRect(x,y,w,t,c); pxRect(x,y+h-t,w,t,c);
  pxRect(x,y,t,h,c);   pxRect(x+w-t,y,t,h,c);
}

function drawFallingCabinet(f){
  if(!f.triggered && f.y>=f.targetY) return;  // 未触发
  // 触发前：上方露出一点点
  if(!f.triggered){
    pxRect(f.x+2, f.y+28, f.w-4, 4, P.CABINET);
    return;
  }
  // 触发后：完整绘制
  pxRect(f.x,f.y,f.w,f.h,P.CABINET);
  drawBorder(f.x,f.y,f.w,f.h,P.CABINET2,1);
  pxRect(f.x+2,f.y+3,f.w-4,f.h-6,'#1a1a1a');
  pxRect(f.x+f.w-4,f.y+f.h/2-1,2,2,'#5a4a3a');
  // 落地后画裂缝/灰尘
  if(f.y>=f.targetY && f._shook){
    pxRect(f.x-2,f.y+f.h,f.w+4,2,'#1a1a1a');
  }
}

function drawPlayer(px,py){
  if(player.invuln>0 && gameTime%4<2) return;  // 无敌闪烁
  var ox=Math.floor(px);
  var oy=Math.floor(py);
  var pw=12,ph=18;
  var f=player.facing; // 0=down 1=up 2=left 3=right

  // Shadow
  pxRect(ox+2,oy+ph-2,10,2,'rgba(0,0,0,0.5)');

  // Legs
  var legOff=player.frame*2;
  if(f===0){ // facing down
    pxRect(ox+2,oy+11,3,5,P.PLAYER);
    pxRect(ox+7,oy+11,3,5,P.PLAYER);
    if(player.frame===0){ pxRect(ox+2,oy+13+legOff,3,3,'#444'); pxRect(ox+7,oy+13-legOff,3,3,'#444'); }
    else { pxRect(ox+2,oy+13-legOff,3,3,'#444'); pxRect(ox+7,oy+13+legOff,3,3,'#444'); }
  }else if(f===1){ // facing up
    pxRect(ox+2,oy+11,3,5,P.PLAYER);
    pxRect(ox+7,oy+11,3,5,P.PLAYER);
  }else{ // side
    pxRect(ox+2,oy+11,3,5,P.PLAYER);
    pxRect(ox+7,oy+11,3,5,P.PLAYER);
    if(player.frame===0) pxRect(ox+2,oy+13+legOff,3,3,'#444');
    else pxRect(ox+7,oy+13+legOff,3,3,'#444');
  }

  // Body
  pxRect(ox+2,oy+6,8,7,'#777');
  pxRect(ox+3,oy+6,6,7,P.PLAYER);

  // Arms
  if(f===2){ pxRect(ox,oy+7,3,4,P.PLAYER); } // left
  else if(f===3){ pxRect(ox+9,oy+7,3,4,P.PLAYER); } // right
  else{ pxRect(ox,oy+7,3,4,P.PLAYER); pxRect(ox+9,oy+7,3,4,P.PLAYER); }

  // Head
  pxRect(ox+3,oy,6,7,P.PLAYER2);
  pxRect(ox+4,oy+1,4,5,'#ddd');
  // Eyes
  if(f===0){ pxRect(ox+5,oy+3,1,1,'#222');pxRect(ox+8,oy+3,1,1,'#222'); }
  else if(f===1){ pxRect(ox+5,oy+2,1,1,'#222');pxRect(ox+8,oy+2,1,1,'#222'); }
  else if(f===2){ pxRect(ox+4,oy+3,1,1,'#222'); }
  else{ pxRect(ox+9,oy+3,1,1,'#222'); }
  // Hair
  pxRect(ox+3,oy,6,2,'#555');
}

// 腐化学生黑影模型：三头、四十五臂、独腿；多色腐烂细节 + 走路动画，尺寸与行为逻辑不变
function drawCorruptedStudent(c, x, y, w, h, alpha){
  alpha = (alpha==null) ? 1 : alpha;
  // 走路动画相位（持续缓步移动，营造活物感）
  var walk = Date.now()*0.011;
  var bob  = Math.sin(walk)*1.6;        // 身体上下起伏
  var lurch= Math.sin(walk*0.5)*0.8;    // 身体左右轻晃
  var xb = x + lurch, yb = y + bob;
  var cx = xb + w/2, cy = yb + h*0.5;
  function col(hex,a){ if(alpha>=1) return hex; var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+(a*alpha)+')'; }
  // 躯干：腐烂紫红肉体 + 病态绿斑 + 腐肉红
  pxRect(xb+2, yb+5, w-4, h-5, col('#1c0b16',1));
  pxRect(xb+4, yb+8, w-8, h-10, col('#3a1226',1));
  pxRect(xb+5, yb+11, 3, 5, col('#54603a',1));
  pxRect(xb+w-7, yb+13, 3, 4, col('#6b2a2a',1));
  // 下半身：3 条腿在下方统一绘制
  // 三颗头：随身体起伏晃动 + 异色眼（红/黄/青）
  var heads=[xb+1, xb+w/2-2, xb+w-6];
  var eyeColors=['#d11010','#e8d020','#2fd6c8'];
  for(var hi=0; hi<3; hi++){
    var hx=heads[hi];
    pxRect(hx, yb-6, 5, 9, col('#39342c',1));
    pxRect(hx+1, yb-5, 3, 5, col('#4a5a3a',1));
    pxRect(hx+1, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+3, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+2, yb-2, 1, 2, col('#7a1a1a',1));
  }
  // 下半身：3 条腿，随走路交替前后摆动（不再用放射触肢）
  var legCols=['#5a5248','#4a4038','#5a5248'];
  c.save();
  c.lineWidth=2;
  var legTop = yb + h - 2;
  var legXs = [xb+3, xb+w/2, xb+w-4];
  for(var li=0; li<3; li++){
    var sw = Math.sin(walk*0.8 + li*2.1)*2.2;   // 交替摆腿
    c.strokeStyle = col(legCols[li],1);
    c.beginPath();
    c.moveTo(legXs[li], legTop);
    c.lineTo(legXs[li]+sw, legTop+7);
    c.stroke();
    pxRect(legXs[li]+sw-2, legTop+7, 5, 1, col(legCols[li],1)); // 脚掌
  }
  c.restore();
  // 上端血盆大口（随走路张合）
  var gape = 2 + Math.abs(Math.sin(walk*0.7))*3;
  var mx = cx, my = yb - 7;
  pxRect(mx-6, my-gape, 12, gape*2+3, col('#3a0808',1));    // 大口外肉
  pxRect(mx-5, my-gape+1, 10, gape*2+1, col('#150202',1));  // 口内深渊
  for(var ti=0; ti<6; ti++){ pxRect(mx-5+ti*2, my-gape+1, 1, 2+(ti%2), col('#e8e0d0',1)); }   // 上排尖牙
  for(var tj=0; tj<6; tj++){ pxRect(mx-5+tj*2, my+gape, 1, 2+((tj+1)%2), col('#d8cfc0',1)); }  // 下排尖牙
  pxRect(mx-6, my+gape+1, 1, 4, col('#8a0d0d',1));          // 口角滴血
  pxRect(mx+5, my+gape, 1, 3, col('#8a0d0d',1));
  // 血滴（躯干，随身体）
  pxRect(xb+3, yb+h-3, 1, 3, col('#8a0d0d',1));
  pxRect(xb+w-4, yb+h-4, 1, 4, col('#8a0d0d',1));
}
function drawChaser(){
  if(DEV_NO_CHASER || !chaser) return;
  drawCorruptedStudent(ctx, chaser.x, chaser.y, chaser.w, chaser.h);
  // "黑 影" 文字提示

    pxText('黑 影',chaser.x+chaser.w/2,chaser.y-22,'#a00',7,'center');
  }
}

// ── 走廊警报灯（红色流水闪烁 + 光晕）──
function drawAlarmLights(){
  var t=Date.now()*0.004;  // 整体闪烁频率
  for(var i=0;i<alarmLights.length;i++){
    var al=alarmLights[i];
    // 每盏灯独立相位，流水灯效果
    var pulse=Math.sin(t+al.phase)*0.5+0.5;  // 0..1
    // 灯罩底座（暗灰）
    pxRect(al.x-1, al.y-1, 4, 2, '#1a1410');
    pxRect(al.x, al.y, 2, 1, '#2a2018');
    // 灯泡（红色发光，颜色随 pulse 从暗红到亮红）
    var r=Math.floor(120+pulse*135);
    var g=Math.floor(pulse*30);
    var b=Math.floor(pulse*20);
    var color='rgb('+r+','+g+','+b+')';
    pxRect(al.x, al.y+1, 2, 2, color);
    // 光晕（径向渐变，亮灯时大）
    if(pulse>0.3){
      var gradAlpha=pulse*0.3;
      var gradR=8+pulse*6;
      var grad=ctx.createRadialGradient(al.x+1, al.y+2, 0, al.x+1, al.y+2, gradR);
      grad.addColorStop(0, 'rgba(220,40,30,'+gradAlpha+')');
      grad.addColorStop(1, 'rgba(220,40,30,0)');
      ctx.fillStyle=grad;
      ctx.fillRect(al.x-gradR, al.y-gradR, gradR*2, gradR*2);
    }
  }
  // 额外：在主走廊地面投一道红色光带（流水效果）
  var bandAlpha=Math.sin(t*0.7)*0.05+0.08;
  ctx.fillStyle='rgba(180,30,20,'+bandAlpha+')';
  ctx.fillRect(B.L, 130, B.R-B.L, 40);
}

function drawFootprints(){
  for(var i=0;i<footprints.length;i++){

    if(f.dark) pxRect(f.x-1,f.y,2,1,'rgba(80,0,0,'+alpha*0.6+')');

}

}

// ── 死亡动画：黑影咬下玩家头 + 血液四溅 ──
var biteStart=0, severedHead=null, bloodParts=[], deathChaserSnap=null, goreSpawned=false;
function spawnDeathGore(){
  var hx=player.x+player.w/2, hy=player.y+3;
  severedHead={x:hx,y:hy,vx:(Math.random()-0.5)*1.6,vy:-2.2-Math.random()*1.2,rot:0,vrot:(Math.random()-0.5)*0.35};
  bloodParts=[];
  for(var bi=0;bi<48;bi++){
    var ang=Math.random()*Math.PI*2, sp=1+Math.random()*4.5;
    bloodParts.push({x:hx+(Math.random()-0.5)*5,y:hy+(Math.random()-0.5)*5,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:28+Math.random()*34,sz:1+Math.random()*2});
  }
}
function drawDeathAnim(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  // 阶段一：怪兽抱住玩家（收拢 + 挣扎晃动），暂不啃头
  if(el<1500){
    if(deathChaserSnap){
      var prog=el/1500;
      var shk=Math.sin(el*0.05)*2.4*(1-prog*0.55);
      var gx=deathChaserSnap.x+shk, gy=deathChaserSnap.y+Math.sin(el*0.033)*1.3;
      drawCorruptedStudent(ctx, gx, gy, deathChaserSnap.w, deathChaserSnap.h);
      // 环抱手臂横贯玩家身体，随挣扎逐渐收紧
      var ay=player.y+player.h*0.42, aw=deathChaserSnap.w+6-prog*3;
      pxRect(deathChaserSnap.x-3+shk, ay,   aw, 3, '#2e2822');
      pxRect(deathChaserSnap.x-3+shk, ay+4, aw, 2, '#241f1a');
    }
    return;
  }
  // 阶段二：啃下头（首次进入触发一次喷血）
  if(!goreSpawned){ spawnDeathGore(); goreSpawned=true; }
  if(severedHead){
    severedHead.x+=severedHead.vx; severedHead.y+=severedHead.vy;
    severedHead.vy+=0.18; severedHead.rot+=severedHead.vrot;
    if(severedHead.y>player.y+player.h+40) severedHead=null;
  }
  for(var i=bloodParts.length-1;i>=0;i--){
    var p=bloodParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if(p.life<=0) bloodParts.splice(i,1);
  }
  if(!chaser && deathChaserSnap) drawCorruptedStudent(ctx, deathChaserSnap.x, deathChaserSnap.y, deathChaserSnap.w, deathChaserSnap.h);
  if(severedHead){
    ctx.save();
    ctx.translate(severedHead.x,severedHead.y);
    ctx.rotate(severedHead.rot);
    pxRect(-3,-3,6,7,'#d9cfc4');
    pxRect(-2,-2,4,5,'#b89a86');
    pxRect(-2,-1,1,1,'#222'); pxRect(1,-1,1,1,'#222');
    pxRect(-2,2,4,1,'#5a1010');
    pxRect(-3,3,6,2,'#9a0d0d');
    ctx.restore();
  }
  for(var j=0;j<bloodParts.length;j++){
    var q=bloodParts[j];
    pxRect(q.x,q.y,q.sz,q.sz,'#a00d0d');
  }
}

}

function render(){
  ctx.clearRect(0,0,W,H);
  var sx=screenShake>0?(Math.random()-0.5)*screenShake:0;
  var sy=screenShake>0?(Math.random()-0.5)*screenShake:0;

  // 世界层（相机跟随）
  ctx.save();
  ctx.translate(sx,sy);
  ctx.translate(W/2,H/2);
  ctx.scale(CAM_ZOOM,CAM_ZOOM);
  ctx.translate(-camera.x,-camera.y);

  // 地面（地板）
  pxRect(B.L,B.T,B.R-B.L,B.B-B.T,P.FLOOR);

  // 主走廊地板色
  pxRect(B.L,110,B.R-B.L,80,P.HALL);
  // 上辅走廊
  pxRect(B.L,18,B.R-B.L,30,P.CORR);
  // 下辅走廊
  pxRect(B.L,252,B.R-B.L,30,P.CORR);

  // 死路地板色（稍亮）
  // 死路 1
  pxRect(380,48,140,60,P.DEADEND);
  // 死路 2
  pxRect(740,190,160,62,P.DEADEND);
  // 死路 3
  pxRect(1180,48,160,60,P.DEADEND);
  // 死路 4
  pxRect(1580,190,160,62,P.DEADEND);
  // 死路 5
  pxRect(1960,48,160,60,P.DEADEND);

  // 地板纹理（淡）
  ctx.globalAlpha=0.06;
  for(var gx=B.L;gx<B.R;gx+=24){
    for(var gy=B.T;gy<B.B;gy+=24){
      pxRect(gx,gy,1,1,'#fff');
    }
  }
  ctx.globalAlpha=1;

  // 主走廊中央线
  ctx.globalAlpha=0.18;
  pxRect(B.L,148,B.R-B.L,1,'#3a3a3a');
  pxRect(B.L,154,B.R-B.L,1,'#3a3a3a');
  ctx.globalAlpha=1;

  // === 地图标牌已删除（用户要求）===

  // 墙体
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(w.h<=2) pxRect(w.x,w.y,w.w,w.h,P.WALL);
    else if(w.w<=2) pxRect(w.x,w.y,w.w,w.h,P.WALL2);
    else { pxRect(w.x,w.y,w.w,w.h,P.WALL3); drawBorder(w.x,w.y,w.w,w.h,P.WALL,1); }
  }
  // 坍塌墙视觉强调（x=700 隔墙 C，红色裂缝提示）
  if(!wall700Collapsed){
    // 缺口处画红色裂缝 + 闪烁警告（缺口从 y=126 延伸到 y=190，共 64px）
    var blink=Math.sin(Date.now()*0.012)*0.4+0.5;
    pxText('⚠', 700, 138, 'rgba(180,40,40,'+blink+')', 8, 'center');
    // 裂缝（沿缺口散落 3 处）
    pxRect(699,128,2,1,'rgba(120,30,20,0.6)');
    pxRect(701,150,2,1,'rgba(120,30,20,0.6)');
    pxRect(699,180,2,1,'rgba(120,30,20,0.6)');
    // 提示文字"危险"
    if(blink>0.7){
      pxText('危 险',700,118,'#a04040',7,'center');
    }
  } else {
    // 坍塌后：高亮填充段（深色） + 灰尘扩散
    if(wall700Fill){
      var fade=Math.min(1, (gameTime-wall700CollapseFrame)/30);
      pxRect(700,126,4,64,'#1a1a1a');
      // 裂缝
      drawBorder(700,126,4,64,'#0a0a0a',1);
      // 提示文字
      if(gameTime-wall700CollapseFrame<90){
        pxText('堵 死 了',700,120,'#a00',7,'center');
      }
    }
  }

  // 坍塌墙视觉强调（x=830 隔墙 F：原本不存在，玩家靠近时从天花板坠落）
  if(!wall830Collapsed){
    // 上方画悬吊的"危险块"（红色裂纹闪烁）
    var blink2=Math.sin(Date.now()*0.01)*0.35+0.5;
    // 顶部裂缝（沿主走廊上界上方画一条暗红色 X）
    pxText('✕', 830, 96, 'rgba(200,60,40,'+blink2+')', 8, 'center');
    // 上方悬垂裂纹（3 条小斜线）
    pxRect(827,90,2,1,'rgba(140,40,20,0.7)');
    pxRect(831,88,2,1,'rgba(140,40,20,0.7)');
    pxRect(829,92,2,1,'rgba(140,40,20,0.7)');
    // 警告文字（脉动）
    if(blink2>0.6){
      pxText('↑ 上 绕 行',830,82,'#c84040',7,'center');
    }
  } else {
    // 坍塌后：完整隔墙
    if(wall830Fill){
      pxRect(830,108,4,80,'#1a1a1a');
      drawBorder(830,108,4,80,'#0a0a0a',1);
      // 顶端碎裂纹理
      pxRect(826,104,12,1,'#2a2a2a');
      pxRect(828,102,8,1,'#1a1a1a');
      // 提示文字
      if(gameTime-wall830CollapseFrame<90){
        pxText('前 路 断 绝',830,98,'#a00',7,'center');
      }
    }
  }
  // 坍塌灰尘粒子
  for(var i=0;i<collapseDust.length;i++){
    var d=collapseDust[i];
    var alpha=Math.min(0.5, d.life/60*0.5);
    pxRect(d.x,d.y,d.size,d.size,'rgba(160,140,100,'+alpha+')');
  }
  // 外框
  drawBorder(B.L,B.T,B.R-B.L,B.B-B.T,'#4a4a4a',4);

  // 走廊警报灯（流水闪烁）
  drawAlarmLights();

  // 静态障碍
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    if(o.kind==='crate') drawCrate(o);
    else if(o.kind==='cabinet') drawCabinet(o);
    else if(o.kind==='bench') drawBench(o);
    else if(o.kind==='barrel') drawBarrel(o);
  }

  // 掉落的柜子
  for(var i=0;i<fallingCabinets.length;i++){
    drawFallingCabinet(fallingCabinets[i]);
  }

  // 脚印
  drawFootprints();

  // 出口
  drawExit();

  // 玩家 & 黑影
  drawPlayer(player.x,player.y);
  drawChaser();
  drawDeathAnim();

  // 黑暗遮罩（玩家周围可见，远处渐入黑暗 — 增强版，视野更小压迫感更强）
  var px2=player.x+player.w/2;
  var py2=player.y+player.h/2;
  var grad=ctx.createRadialGradient(px2,py2,25,px2,py2,180);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(0.15,'rgba(0,0,0,0.55)');
  grad.addColorStop(0.35,'rgba(0,0,0,0.85)');
  grad.addColorStop(0.55,'rgba(0,0,0,0.95)');
  grad.addColorStop(0.75,'rgba(0,0,0,1)');
  grad.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=grad;
  ctx.fillRect(B.L,B.T,B.R-B.L,B.B-B.T);

  ctx.restore();

  // 红闪（追逐中持续 sin 波 + 短促增强）
  if(redFlashOn && !playerDead){
    // 持续基础红光（脉动）
    var rf=Math.sin(Date.now()*0.008)*0.06+0.10;
    pxRect(0,0,W,H,'rgba(160,0,0,'+rf+')');
    // 短促强闪（叠加在 redFlashTimer 触发时）
    if(redFlashTimer>0){
      var flashAlpha=redFlashTimer/30*0.18;
      pxRect(0,0,W,H,'rgba(200,0,0,'+flashAlpha+')');
    }
    // 屏幕边缘暗角（vignette）
    var vg=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(60,0,0,0.35)');
    ctx.fillStyle=vg;
    ctx.fillRect(0,0,W,H);
  }

  // 死亡叠层
  drawChaserDeath();

  // HUD
  drawHUD();
}

// ── 主循环 ──
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

})();
</script>

<script>
(function(){
  var IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints>0) || /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)) && !(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  if(!IS_TOUCH) return; // 电脑版完全不创建任何控件
  var C = document.getElementById('c');
  if(!C) return;
  var K; try{ K = (typeof keys!=='undefined')?keys:null; }catch(e){ K=null; }
  if(!K){ K = {}; }
  function gMS(){ try{ return (typeof machineScreen!=='undefined')?machineScreen:undefined; }catch(e){ return undefined; } }
  function gPW(){ try{ return (typeof pwDialog!=='undefined')?pwDialog:undefined; }catch(e){ return undefined; } }
  function tapKey(key){
    window.dispatchEvent(new KeyboardEvent('keydown',{key:key,bubbles:true,cancelable:true}));
    window.dispatchEvent(new KeyboardEvent('keyup',{key:key,bubbles:true,cancelable:true}));
  }
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  var layer = document.createElement('div');
  layer.id='mbt-controls';
  layer.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;pointer-events:none;';
  document.body.appendChild(layer);
  var JOY_R=60;
  var joy=document.createElement('div');
  joy.style.cssText='position:fixed;left:22px;bottom:96px;width:'+(JOY_R*2)+'px;height:'+(JOY_R*2)+'px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.25);pointer-events:auto;touch-action:none;';
  var knob=document.createElement('div');
  knob.style.cssText='position:absolute;left:'+(JOY_R-22)+'px;top:'+(JOY_R-22)+'px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.9);';
  joy.appendChild(knob);
  layer.appendChild(joy);
  var joyId=null, joyCx=0, joyCy=0;
  var __mbtDown={};
  function pressKey(k,down){ if(down&&!__mbtDown[k]){ __mbtDown[k]=true; window.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true})); } else if(!down&&__mbtDown[k]){ __mbtDown[k]=false; window.dispatchEvent(new KeyboardEvent('keyup',{key:k,bubbles:true,cancelable:true})); } }
  function setMove(dx,dy){ var dead=JOY_R*0.35; pressKey('w',dy<-dead); pressKey('s',dy>dead); pressKey('a',dx<-dead); pressKey('d',dx>dead); }
  function clearMove(){ pressKey('w',false); pressKey('s',false); pressKey('a',false); pressKey('d',false); }
  function moveJoy(t){ var dx=t.clientX-joyCx, dy=t.clientY-joyCy; var dist=Math.sqrt(dx*dx+dy*dy), max=JOY_R-22; if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; } knob.style.left=(JOY_R-22+dx)+'px'; knob.style.top=(JOY_R-22+dy)+'px'; setMove(dx,dy); }
  joy.addEventListener('touchstart', function(e){ e.preventDefault(); var t=e.changedTouches[0]; joyId=t.identifier; var r=joy.getBoundingClientRect(); joyCx=r.left+JOY_R; joyCy=r.top+JOY_R; moveJoy(t); }, {passive:false});
  joy.addEventListener('touchmove', function(e){ e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId) moveJoy(e.changedTouches[i]); } }, {passive:false});
  function endJoy(e){ for(var i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===joyId){ joyId=null; knob.style.left=(JOY_R-22)+'px'; knob.style.top=(JOY_R-22)+'px'; clearMove(); } } }
  joy.addEventListener('touchend', endJoy);
  joy.addEventListener('touchcancel', endJoy);
  function mkBtn(label,color){ var b=document.createElement('div'); b.textContent=label; b.style.cssText='position:fixed;right:22px;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,0.35);border:2px solid '+color+';color:'+color+';font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;touch-action:none;user-select:none;'; return b; }
  var btnI=mkBtn('互动','#7fd0ff'); btnI.style.right='22px'; btnI.style.bottom='22px';
  var btnC=mkBtn('关闭','#ff8a8a'); btnC.style.right='100px'; btnC.style.bottom='22px';
  var btnY=mkBtn('确认','#7fffa0'); btnY.style.right='22px'; btnY.style.bottom='100px';
  var btnN=mkBtn('取消','#ffd27f'); btnN.style.right='100px'; btnN.style.bottom='100px';
  layer.appendChild(btnI); layer.appendChild(btnC); layer.appendChild(btnY); layer.appendChild(btnN);
  btnI.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('f'); }, {passive:false});
  btnC.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('Escape'); }, {passive:false});
  btnY.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('y'); }, {passive:false});
  btnN.addEventListener('touchstart', function(e){ e.preventDefault(); tapKey('n'); }, {passive:false});
  if(C){ C.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; window.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY,bubbles:true})); }, {passive:true}); }
  var pwdWrap=document.createElement('div');
  pwdWrap.style.cssText='position:fixed;left:0;top:0;width:100%;display:none;z-index:70;background:rgba(0,0,0,0.65);padding:8px;box-sizing:border-box;pointer-events:auto;';
  var pwdInput=document.createElement('input'); pwdInput.type='text'; pwdInput.placeholder='输入密码'; pwdInput.style.cssText='width:58%;padding:10px;font-size:16px;border:2px solid #3cff7a;background:#0a0a0a;color:#3cff7a;border-radius:4px;';
  var pwdOk=document.createElement('button'); pwdOk.textContent='填入'; pwdOk.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #3cff7a;background:#0a2a14;color:#3cff7a;border-radius:4px;';
  var pwdHide=document.createElement('button'); pwdHide.textContent='隐藏'; pwdHide.style.cssText='padding:10px 12px;font-size:15px;margin-left:6px;border:2px solid #888;background:#222;color:#ccc;border-radius:4px;';
  pwdWrap.appendChild(pwdInput); pwdWrap.appendChild(pwdOk); pwdWrap.appendChild(pwdHide);
  document.body.appendChild(pwdWrap);
  pwdInput.addEventListener('keydown', function(e){ e.stopPropagation(); });
  pwdInput.addEventListener('input', function(e){ e.stopPropagation(); });
  pwdOk.addEventListener('click', function(){ var v=pwdInput.value; var ms=gMS(), pw=gPW(); if(ms && ms.input!==undefined){ ms.input=v; } if(pw && pw.input!==undefined){ pw.input=v; } pwdInput.value=''; pwdWrap.style.display='none'; });
  pwdHide.addEventListener('click', function(){ pwdWrap.style.display='none'; });
  setInterval(function(){ var ms=gMS(), pw=gPW(); if(ms||pw){ if(pwdWrap.style.display!=='block'){ pwdWrap.style.display='block'; } } else { if(pwdWrap.style.display!=='none'){ pwdWrap.style.display='none'; } } }, 300);
})();
</script>
