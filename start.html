<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星榆中学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* 标题：毛笔楷书，灵异手写感，贴合“旧校园灵异”设定 */
  --font-title:'Ma Shan Zheng','STKaiti','KaiTi','楷体',serif;
  /* 正文：精致衬线，旧式书卷气 */
  --font-body:'Noto Serif SC','Songti SC','STSong','SimSun','宋体',serif;
}

html,body{
  width:100%;height:100%;
  background:#0a0506;
  font-family:var(--font-body);
  overflow:hidden;
  cursor:default;
  user-select:none;
}

/* ── 主容器 ── */
#main{
  position:relative;
  width:100%;height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(ellipse at center, #1c0f0f 0%, #0a0506 55%, #000 100%),
    radial-gradient(ellipse at center, rgba(120,20,20,0.10) 0%, transparent 62%);
  box-shadow:inset 0 0 220px rgba(0,0,0,0.92);
}

/* ── CRT 扫描线叠加层 ── */
#scanlines{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:100;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.15) 2px,
    rgba(0,0,0,0.15) 4px
  );
}

/* ── 噪点层 ── */
#noise{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:99;
  opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ── 学校轮廓背景 ── */
#school-bg{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:600px;height:340px;
  opacity:0.08;
  z-index:0;
}

/* ── 微弱的红色光晕 ── */
#red-glow{
  position:absolute;
  top:30%;left:50%;
  transform:translate(-50%,-50%);
  width:400px;height:400px;
  background:radial-gradient(circle, rgba(170,30,30,0.18) 0%, transparent 70%);
  border-radius:50%;
  z-index:1;
  will-change:opacity,transform;
  animation:candleFlicker 6s ease-in-out infinite;
}

/* 烛光：不规则的明暗抖动 + 轻微摇曳位移，材质(径向渐变)完全保持不变 */
@keyframes candleFlicker{
  0%   {opacity:0.5; transform:translate(-50%,-50%) translate(0,0) scale(1)}
  9%   {opacity:0.82;transform:translate(-50%,-50%) translate(5px,-6px) scale(1.05)}
  17%  {opacity:0.3; transform:translate(-50%,-50%) translate(-5px,4px) scale(0.95)}
  26%  {opacity:0.95;transform:translate(-50%,-50%) translate(7px,2px) scale(1.08)}
  34%  {opacity:0.38;transform:translate(-50%,-50%) translate(-3px,-4px) scale(0.97)}
  44%  {opacity:0.85;transform:translate(-50%,-50%) translate(3px,5px) scale(1.06)}
  55%  {opacity:0.22;transform:translate(-50%,-50%) translate(-8px,-3px) scale(0.92)}
  66%  {opacity:0.98;transform:translate(-50%,-50%) translate(5px,6px) scale(1.1)}
  77%  {opacity:0.4; transform:translate(-50%,-50%) translate(-5px,-4px) scale(0.96)}
  88%  {opacity:0.8; transform:translate(-50%,-50%) translate(3px,3px) scale(1.05)}
  95%  {opacity:0.32;transform:translate(-50%,-50%) translate(-3px,4px) scale(0.94)}
  100% {opacity:0.5; transform:translate(-50%,-50%) translate(0,0) scale(1)}
}

/* ── 标题区域 ── */
#title-area{
  position:relative;
  z-index:10;
  text-align:center;
  margin-bottom:50px;
}

#game-title{
  font-family:var(--font-title);
  font-size:72px;
  font-weight:bold;
  color:#c0392b;
  letter-spacing:14px;
}

/* 仅"中"字做年久失修灯泡闪烁，其余三字保持常亮(材质不变) */
.flicker-char{
  will-change:opacity;
  animation:bulbFlicker 8s linear infinite;
}

/* 年久失修的电灯泡：静止时辉光与原材质完全一致，偶发骤暗/熄灭与快速闪烁。
   闪烁时仅收起辉光并略微降低不透明度，文字色与黑色描边材质保持不变 */
@keyframes bulbFlicker{
  0%,27%  {opacity:1}
  28%     {opacity:0.45}
  29%     {opacity:1}
  30%     {opacity:0.4}
  31%     {opacity:1}
  67%     {opacity:1}
  68%     {opacity:0.3}
  72%     {opacity:0.3}
  73%     {opacity:1}
  100%    {opacity:1}
}

#subtitle{
  font-size:16px;
  color:#7a4a44;
  letter-spacing:6px;
  margin-top:8px;
  font-family:var(--font-body);
}

/* ── 按钮区域 ── */
#btn-area{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
  padding:32px 28px;
  background:rgba(12,6,8,0.5);
  border:1px solid rgba(176,58,46,0.28);
  border-radius:12px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  box-shadow:0 14px 44px rgba(0,0,0,0.6);
}

.menu-btn{
  width:260px;
  padding:15px 18px;
  font-family:var(--font-body);
  font-size:17px;
  letter-spacing:6px;
  color:#cbb9a9;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(176,58,46,0.32);
  border-radius:7px;
  cursor:pointer;
  text-align:center;
  transition:color .25s ease, background .25s ease, border-color .25s ease, transform .25s ease, letter-spacing .25s ease;
  position:relative;
  overflow:hidden;
  outline:none;
}

/* 主流游戏菜单：左侧血色指示条，hover 时竖向滑入 */
.menu-btn::before{
  content:'';
  position:absolute;
  left:0;top:0;
  width:4px;height:100%;
  background:#b03a2e;
  transform:scaleY(0);
  transform-origin:center;
  transition:transform .25s ease;
}

.menu-btn:hover{
  color:#fff;
  background:rgba(176,58,46,0.16);
  border-color:rgba(200,80,60,0.85);
  transform:translateX(6px);
  letter-spacing:8px;
}

.menu-btn:hover::before{
  transform:scaleY(1);
}

.menu-btn:active{
  color:#fff;
  border-color:#d8543a;
  background:rgba(176,58,46,0.28);
  transform:translateX(6px) scale(0.98);
}

/* ── 底部文字 ── */
#footer-text{
  position:absolute;
  bottom:30px;
  z-index:10;
  color:#4a2a26;
  font-size:12px;
  letter-spacing:3px;
  font-family:var(--font-body);
}

/* ── 角落飘浮粒子 ── */
.particle{
  position:absolute;
  width:2px;height:2px;
  background:rgba(190,60,50,0.4);
  border-radius:50%;
  z-index:2;
  pointer-events:none;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);opacity:0.3}
  50%{transform:translateY(-20px);opacity:0.7}
}

/* ── VHS 色差闪烁 ── */
#vhs-flash{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:98;
  opacity:0;
  background:rgba(200,50,50,0.03);
  animation:vhsHit 12s infinite;
}

@keyframes vhsHit{
  0%,95%,100%{opacity:0}
  95.5%{opacity:0.5}
  96%{opacity:0}
  96.5%{opacity:0.3}
  97%{opacity:0}
}

/* ── 过渡动画容器（覆盖全屏） ── */
#transition-container{
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;
  background:#000;
  z-index:300;
  pointer-events:none;
  opacity:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#transition-container.active{
  opacity:1;
}

/* CRT 开机闪白 */
#transition-flash{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:#fff;
  opacity:0;
}

#transition-container.active #transition-flash{
  animation:flashIn 0.15s ease-out forwards;
}

@keyframes flashIn{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}

/* CRT 扫描线收缩 */
#transition-scan{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.4) 3px,
    rgba(0,0,0,0.4) 6px
  );
  opacity:0;
}

#transition-container.scanning #transition-scan{
  opacity:1;
}

/* 收缩光条 */
#transition-bar{
  position:absolute;
  left:0;
  width:100%;
  height:2px;
  background:rgba(255,255,255,0.8);
  top:50%;
  box-shadow:0 0 20px rgba(255,255,255,0.6);
  opacity:0;
}

#transition-container.scanning #transition-bar{
  opacity:1;
  animation:barCollapse 1.2s ease-in-out forwards;
}

@keyframes barCollapse{
  0%{top:0;height:2px;opacity:0.9}
  8%{top:0;height:100%;opacity:0.3}
  16%{top:0;height:2px;opacity:0.9}
  100%{top:100%;height:2px;opacity:0}
}

/* 过渡文字 */
#transition-text{
  position:relative;
  z-index:302;
  color:#caa89a;
  font-family:var(--font-title);
  letter-spacing:8px;
  text-align:center;
  opacity:0;
  transform:translateY(10px);
}

#transition-container.showtext #transition-text{
  animation:textFadeIn 1.8s ease forwards;
}

@keyframes textFadeIn{
  0%{opacity:0;transform:translateY(10px)}
  15%{opacity:1;transform:translateY(0)}
  80%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-8px)}
}

#transition-text .big{
  font-size:36px;
  display:block;
  margin-bottom:10px;
}

#transition-text .small{
  font-size:14px;
  color:#9c5a4a;
  display:block;
}

/* ── 开场电影动画 (6.2s) ── */
#intro{
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;
  z-index:500;
  background:#000;
  overflow:hidden;
  pointer-events:none;
  animation:introFadeOut 1.4s ease-in-out 5.0s forwards;
}
@keyframes introFadeOut{
  to{opacity:0;visibility:hidden;}
}

.intro-frame{position:absolute;inset:0;}

/* 电影黑边 letterbox（用 transform:scaleY 合成，避免逐帧重排卡顿） */
.intro-frame::before,.intro-frame::after{
  content:'';position:absolute;left:0;width:100%;height:15%;
  background:#000;z-index:8;
  will-change:transform;
  animation:letterbox 5.0s ease forwards;
}
.intro-frame::before{top:0;transform-origin:top center;}
.intro-frame::after{bottom:0;transform-origin:bottom center;}
@keyframes letterbox{
  0%{transform:scaleY(1.45)}
  14%{transform:scaleY(0.55)}
  86%{transform:scaleY(0.55)}
  100%{transform:scaleY(1.5)}
}

.intro-img{
  position:absolute;top:50%;left:50%;
  width:112%;height:112%;
  transform:translate(-50%,-50%) scale(1.0) translateZ(0);
  object-fit:cover;
  filter:grayscale(1) contrast(1.15) brightness(0.62);
  opacity:0;
  will-change:transform,opacity;
  backface-visibility:hidden;
}

.intro-school{ animation:introSchool 3.6s ease forwards; }
@keyframes introSchool{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}
  12%{opacity:1}
  55%{opacity:0.6;transform:translate(-50%,-50%) scale(1.16)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.24)}
}

.intro-student{ animation:introStudent 3.6s ease forwards; object-position:top center; }
@keyframes introStudent{
  0%,38%{opacity:0;transform:translate(-50%,-42%) scale(1.0)}
  60%{opacity:1;transform:translate(-50%,-42%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-42%) scale(1.26)}
}

/* 暗角 */
.intro-vignette{
  position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,0.55) 72%, rgba(0,0,0,0.92) 100%);
}

/* 胶片噪点：缩小图层面积(画面仍被完全覆盖，外观不变)，并提升为独立 GPU 合成层，
   使 0.25s 的位移只做轻量合成而非逐帧重绘，从根本上消除卡顿 */
.intro-grain{
  position:absolute;inset:-10%;z-index:7;pointer-events:none;
  opacity:0.10;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
  animation:grainShift 0.25s steps(3) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}
  33%{transform:translate(-4%,3%)}
  66%{transform:translate(3%,-2%)}
  100%{transform:translate(-2%,-3%)}
}

/* 轻微胶片抖动：提升为独立合成层，使抖动只做轻量合成，不再重绘整棵滤镜子树（效果保留） */
.intro-frame{ animation:filmShake 0.5s ease-in-out 1; will-change:transform; transform:translateZ(0); }
@keyframes filmShake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}
  75%{transform:translate(-1px,-1px)}
}

.intro-title{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.92);
  text-align:center;z-index:9;opacity:0;
  animation:introTitle 1.2s ease-out 3.8s forwards;
}
@keyframes introTitle{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.92)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.intro-line1{
  display:block;font-family:var(--font-title);
  font-size:46px;color:#c8503f;
  letter-spacing:14px;
}
.intro-line2{
  display:block;font-size:15px;color:#9c5a4a;
  letter-spacing:10px;margin-top:12px;
}

/* 开场黑幕期间暂停被完全遮挡的主界面无限动画，减少合成开销（对画面无可见影响） */
body.intro-playing #red-glow,
body.intro-playing .particle,
body.intro-playing .flicker-char,
body.intro-playing #vhs-flash{
  animation-play-state:paused;
}

/* 开场动画期间禁用所有菜单按钮：灰显 + 禁止点击 */
body.intro-playing .menu-btn{
  pointer-events:none;
  opacity:0.35;
  filter:grayscale(0.7);
  cursor:not-allowed;
  color:#555;
  background:rgba(255,255,255,0.02);
  border-color:#2a2a2a;
}

/* 尊重系统"减少动态效果"设置，关闭持续重绘的特效 */
@media (prefers-reduced-motion: reduce){
  .intro-grain,.particle,#red-glow,#vhs-flash,.flicker-char{animation:none !important}
}

/* ── 恐怖版界面：随机短暂闪现（jump-scare 闪屏） ── */
#horror-flash{
  position:fixed;inset:0;z-index:400;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, #2a0000 0%, #000 72%);
  opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;
}
#horror-flash.show{ animation:horrorFlash 0.4s steps(1) forwards; }
@keyframes horrorFlash{
  0%{opacity:0;visibility:visible}
  8%{opacity:1}
  100%{opacity:0;visibility:hidden}
}
.horror-ghost{
  position:absolute;
  width:62%;max-width:540px;
  filter:contrast(1.4) brightness(0.95) drop-shadow(0 0 30px rgba(190,0,0,0.7));
  mix-blend-mode:screen;
  opacity:0.92;
  animation:ghostJolt 0.4s steps(2) infinite;
}
@keyframes ghostJolt{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-7px,5px) scale(1.05)}
  100%{transform:translate(6px,-4px) scale(1.02)}
}
.horror-center{position:relative;z-index:2;text-align:center;}
.horror-title{
  font-family:var(--font-title);
  font-size:72px;font-weight:bold;letter-spacing:14px;
  color:#c81010;
  text-shadow:2px 2px 0 #000;
  animation:titleGlitch 0.4s steps(2) infinite;
}
@keyframes titleGlitch{
  0%{transform:translate(0,0);text-shadow:2px 2px 0 #000}
  50%{transform:translate(-4px,2px);text-shadow:-3px 0 #00e5ff,3px 0 #ff0000,2px 2px 0 #000}
  100%{transform:translate(3px,-2px);text-shadow:3px 0 #00e5ff,-3px 0 #ff0000,2px 2px 0 #000}
}
.horror-sub{
  margin-top:10px;
  font-family:var(--font-title);font-size:16px;letter-spacing:6px;
  color:#7a0000;
}
</style>
</head>
<body>

<!-- ── 开场电影动画 ── -->
<div id="intro">
  <div class="intro-frame">
    <img class="intro-img intro-school" src="school.jpg" alt="">
    <img class="intro-img intro-student" src="student.jpg" alt="">
    <div class="intro-vignette"></div>
    <div class="intro-grain"></div>
    <div class="intro-title">
      <span class="intro-line1">星 榆 中 学</span>
      <span class="intro-line2">2 0 0 8</span>
    </div>
  </div>
</div>

<div id="main">

  <!-- 红色光晕 -->
  <div id="red-glow"></div>

  <!-- 飘浮粒子 -->
  <span class="particle" style="top:15%;left:10%;animation-delay:0s"></span>
  <span class="particle" style="top:25%;right:12%;animation-delay:1.5s"></span>
  <span class="particle" style="top:70%;left:8%;animation-delay:3s"></span>
  <span class="particle" style="top:60%;right:10%;animation-delay:4.5s"></span>
  <span class="particle" style="top:40%;left:85%;animation-delay:2s"></span>
  <span class="particle" style="bottom:20%;left:20%;animation-delay:5s"></span>

  <!-- 标题 -->
  <div id="title-area">
    <div id="game-title">星榆<span class="flicker-char">中</span>学</div>
    <div id="subtitle">— 2 0 0 8 —</div>
  </div>

  <!-- 按钮 -->
  <div id="btn-area">
    <button class="menu-btn" id="btn-newgame" onclick="newGame()">新 游 戏</button>
    <button class="menu-btn" onclick="loadGame()">存 档 点</button>
    <button class="menu-btn" onclick="openAchievements()">成 就</button>
    <button class="menu-btn" onclick="exitGame()">退 出 游 戏</button>
  </div>

  <!-- 底部 -->
  <div id="footer-text">星榆中学 · 模拟恐怖</div>

</div>

<!-- 过渡动画层（全屏覆盖） -->
<div id="transition-container">
  <div id="transition-flash"></div>
  <div id="transition-scan"></div>
  <div id="transition-bar"></div>
  <div id="transition-text">
    <span class="big">二〇〇八年</span>
    <span class="small">星榆中学</span>
  </div>
</div>

<!-- 覆盖层 -->
<div id="scanlines"></div>
<div id="noise"></div>
<div id="vhs-flash"></div>

<!-- 恐怖版界面：开场结束后每 8~20 秒随机短暂闪现一次 -->
<div id="horror-flash">
  <img class="horror-ghost" src="goast.png" alt="">
  <div class="horror-center">
    <div class="horror-title">星榆中学</div>
    <div class="horror-sub">— 2 0 0 8 —</div>
  </div>
</div>

<script src="bgm.js"></script>
<script src="time.js"></script>

<script>
function newGame(){
  // 0. 检查存档数：已达上限（3个）时，先引导玩家删除一个，再继续
  if(window.SaveSystem && typeof SaveSystem.getSavesCount === 'function'){
    var cnt = SaveSystem.getSavesCount();
    if(cnt >= SaveSystem.MAX_SLOTS){
      showFullDialog();
      return;
    }
  }
  // 1. 弹自定义存档名输入框（不阻断流程：可填也可不填）
  showNameDialog(function (chosenName) {
    startNewGameWith(chosenName);
  });
}

// 存档已满提示对话框
function showFullDialog(){
  injectStartDialogCss();
  var overlay=document.getElementById('xyzh-start-full');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='xyzh-start-full';
    overlay.className='xyzh-start-overlay';
    overlay.innerHTML=
      '<div class="xyzh-start-box">'+
        '<div class="xyzh-start-title">存 档 已 达 上 限</div>'+
        '<div class="xyzh-start-msg">当前已有 3 个存档（上限）。<br>请先在存档列表中删除一个存档，<br>删除后会回到主菜单，<br>再重新点击「新游戏」即可。</div>'+
        '<div class="xyzh-start-btns">'+
          '<button class="xyzh-start-btn primary" id="xyzh-start-go-list">打 开 存 档 列 表</button>'+
          '<button class="xyzh-start-btn" id="xyzh-start-cancel">取 消</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
  }
  // 打开存档列表（删除存档后会留在存档列表里，由玩家自行点「返回」回主菜单）
  overlay.querySelector('#xyzh-start-go-list').onclick=function(){
    overlay.classList.remove('show');
    if(window.SaveSystem) SaveSystem.openList();
  };
  overlay.querySelector('#xyzh-start-cancel').onclick=function(){
    overlay.classList.remove('show');
  };
  overlay.classList.add('show');
}

// 自定义存档名输入框（名称不能为空）
function showNameDialog(onConfirm){
  injectStartDialogCss();
  var overlay=document.getElementById('xyzh-start-name');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='xyzh-start-name';
    overlay.className='xyzh-start-overlay';
    overlay.innerHTML=
      '<div class="xyzh-start-box">'+
        '<div class="xyzh-start-title">新 存 档</div>'+
        '<div class="xyzh-start-msg">为这个新存档起个名字：<br><span style="font-size:11px;color:#888;">（名称不能为空，16 字以内）</span></div>'+
        '<input type="text" id="xyzh-start-name-input" class="xyzh-start-input" maxlength="16" placeholder="">'+
        '<div id="xyzh-start-name-err" class="xyzh-start-err" style="display:none;">名 称 不 能 为 空</div>'+
        '<div class="xyzh-start-btns">'+
          '<button class="xyzh-start-btn primary" id="xyzh-start-name-ok">开 始 游 戏</button>'+
          '<button class="xyzh-start-btn" id="xyzh-start-name-cancel">取 消</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
  }
  var input=overlay.querySelector('#xyzh-start-name-input');
  var errEl=overlay.querySelector('#xyzh-start-name-err');
  input.value='';
  errEl.style.display='none';
  // 重新打开时清空错误提示
  function clearErr(){
    errEl.style.display='none';
    input.style.borderColor='#4a4030';
  }
  function showErr(){
    errEl.style.display='block';
    input.style.borderColor='#a04040';
  }
  // 输入时清除错误提示
  input.oninput=clearErr;
  // 回车即确认
  input.onkeydown=function(e){
    if(e.key==='Enter'){ e.preventDefault(); ok(); }
  };
  overlay.querySelector('#xyzh-start-name-ok').onclick=ok;
  overlay.querySelector('#xyzh-start-name-cancel').onclick=cancel;
  function ok(){
    var v=input.value.trim();
    if(!v){
      // 名称不能为空：阻止提交，提示玩家
      showErr();
      try{ input.focus(); }catch(e){}
      return;
    }
    overlay.classList.remove('show');
    onConfirm(v);
  }
  function cancel(){
    overlay.classList.remove('show');
  }
  overlay.classList.add('show');
  clearErr();
  // 自动聚焦输入框
  setTimeout(function(){ try{ input.focus(); }catch(e){} }, 60);
}

  if(document.getElementById('xyzh-start-dialog-style')) return;
  var s=document.createElement('style');
  s.id='xyzh-start-dialog-style';
  s.textContent=
    '.xyzh-start-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);opacity:0;transition:opacity .25s ease;pointer-events:none;}'+
    '.xyzh-start-overlay.show{opacity:1;pointer-events:auto;}'+
    '.xyzh-start-box{width:420px;max-width:90vw;background:#0c0c0c;border:1px solid #6a5a3a;padding:24px 26px;box-shadow:0 0 40px rgba(0,0,0,0.8);color:#d8c89a;animation:xyzh-box-in .35s ease;}'+
    '.xyzh-start-title{font-size:20px;letter-spacing:8px;text-align:center;margin-bottom:14px;color:#b04a3a;}'+
    '.xyzh-start-msg{font-size:14px;letter-spacing:2px;line-height:1.9;text-align:center;margin-bottom:18px;color:#9a8a6a;}'+
    '.xyzh-start-input{width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #4a4030;color:#d8c89a;font-family:inherit;font-size:15px;letter-spacing:2px;box-sizing:border-box;margin-bottom:18px;outline:none;}'+
    '.xyzh-start-input:focus{border-color:#8a7a5a;}'+
    '.xyzh-start-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}'+
    '.xyzh-start-btn{flex:1;min-width:90px;padding:11px 0;background:rgba(20,20,20,0.6);border:1px solid #4a4030;color:#9a8a6a;font-family:var(--font-body);font-size:15px;letter-spacing:4px;cursor:pointer;transition:color .2s ease,border-color .2s ease,background .2s ease;}'+
    '.xyzh-start-btn:hover{color:#eee;border-color:#a06a3a;background:rgba(40,20,10,0.5);}'+

  document.head.appendChild(s);
}

// 实际开启新游戏（含动画）
function startNewGameWith(name){
  var container=document.getElementById('transition-container');
  var btn=document.getElementById('btn-newgame');
  if(btn)btn.disabled=true;

  // 重置：清除之前保存的 index 页面记录，确保新游戏从头开始
  try { localStorage.removeItem('xyzh_index_state'); } catch(e) {}

  // 新游戏：创建存档槽（已满时 createSlot 返回 -1，立即拦截）
  if(window.SaveSystem){
    var newId = SaveSystem.createSlot(name||'');
    if(newId === -1){
      // 兜底：万一在弹名时存档数被填满，回到「已达上限」对话框
      if(btn)btn.disabled=false;
      showFullDialog();
      return;
    }
  }

  // 重置时间系统：从「周四 19:00」开始
  if(window.GameTime) GameTime.reset();

  // 启动贯穿后续整个流程的背景音乐
  if(window.BGM) BGM.start();

  // Phase 1: 黑屏容器出现 + CRT 闪白 (0ms)
  container.classList.add('active');
  AmbientMusic.transition();

  // Phase 2: 闪白后短暂黑屏，然后出现文字 (300ms)
  setTimeout(function(){
    container.classList.add('showtext');
  },300);

  // Phase 3: 文字渐隐后，扫描线收缩 (1200ms)
  setTimeout(function(){
    container.classList.add('scanning');
  },1800);

  // Phase 4: 跳转至地图 (3000ms)
  setTimeout(function(){
    window.location.href='map.html';
  },3000);
}

function loadGame(){
  // 打开存档列表，选择存档恢复进度
  if(window.SaveSystem) SaveSystem.openList();
}

function openAchievements(){
  // 打开成就弹窗：展示已通往的结局
  if(window.SaveSystem) SaveSystem.openAchievements();
}

function exitGame(){
  if(confirm('确定要退出游戏吗？')){
    window.close();
    // 如果 window.close() 不生效（部分浏览器限制），则重定向
    setTimeout(function(){
      document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#555;font-family:宋体,SimSun,serif;font-size:18px;letter-spacing:4px;">游戏已关闭</div>';
    },200);
  }
}

// 开场动画结束后彻底移除层，避免任何遮挡
window.addEventListener('load',function(){
  // 开场黑幕期间暂停被遮挡的主界面无限动画（开场动画淡出揭示主界面时再恢复）
  document.body.classList.add('intro-playing');
  // 开场期间禁用所有菜单按钮（双重保险：CSS 灰显 + JS 设置 disabled）
  var btns=document.querySelectorAll('.menu-btn');
  for(var i=0;i<btns.length;i++) btns[i].disabled=true;
  AmbientMusic.intro(); // 启动宏大而压抑的开场配乐（首次交互后正式出声）
  setTimeout(function(){
    // 开场结束：解除按钮禁用 + 移除开场 CSS 类
    for(var i=0;i<btns.length;i++) btns[i].disabled=false;
    document.body.classList.remove('intro-playing');
  },5000);
  setTimeout(function(){
    var intro=document.getElementById('intro');
    if(intro) intro.style.display='none';
    },6800);
});

// 恐怖版界面：开场结束后，每 8~20 秒随机闪现一次（短暂 jump-scare）
(function(){
  // 尊重"减少动态效果"设置，跳过惊吓闪屏
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var horror=document.getElementById('horror-flash');
  if(!horror) return;
  function schedule(){
    var delay=8000+Math.random()*12000; // 8~20 秒随机
    setTimeout(function(){
      horror.classList.add('show');
      AmbientMusic.sting(); // 同步触发惊吓音效（不协和音簇，无额外音频）
      setTimeout(function(){horror.classList.remove('show');},400); // 闪屏持续约 0.4s
      schedule();
    },delay);
  }
  setTimeout(schedule,7000); // 等开场动画结束后再开始随机
})();

/* ============================================================
   氛围音乐引擎 · 宏伟庄严（majestic）
   纯 Web Audio 实时合成，无需外部曲目；无任何惊吓音效
   流程配乐：
     开场  → intro()        宏大和弦涌起（庄严铺底）
     菜单  → 低频根基 + 中频和声 + 缓慢和弦 + 稀疏钟琴（宏伟庄严）
     闪现  → sting()        宏大温暖和弦涌起（非惊吓）
     进图  → transition()   庄严下行 + 大锣，衔接地图
   注：浏览器禁止自动播放，首次点击/按键即启动音频。
   ============================================================ */
var AmbientMusic=(function(){
  var ctx=null,master=null,comp=null,reverb=null,wet=null,dry=null;
  var started=false;
  function out(n){ n.connect(dry); n.connect(reverb); }
  function now(){ return ctx.currentTime; }
  function makeIR(dur,dec){var r=ctx.sampleRate,l=(r*dur)|0,buf=ctx.createBuffer(2,l,r);for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,dec);}return buf;}

  function build(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.0001;
    comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=0.01; comp.release.value=0.3;
    reverb=ctx.createConvolver(); reverb.buffer=makeIR(2.8,2.4);
    wet=ctx.createGain(); wet.gain.value=0.55;
    dry=ctx.createGain(); dry.gain.value=0.8;
    dry.connect(master); wet.connect(master); reverb.connect(wet);
    master.connect(comp); comp.connect(ctx.destination);
    master.gain.setValueAtTime(0.0001,now());
    master.gain.exponentialRampToValueAtTime(0.85,now()+3); // 主音量缓入
  }
  function ensure(){ if(!ctx){ try{build();}catch(e){return;} } if(ctx.state==='suspended') ctx.resume(); }

  // —— 持续铺底：低频根基 + 中频宏大和声 ——
  function startBed(){
    if(!ctx||started) return; started=true;
    // 低频根基（承重，不刺耳，无隆隆噪声）
    var o1=ctx.createOscillator();o1.type='sine';o1.frequency.value=55;        // A1 根音
    var o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=82.41;     // E2 五度
    var o3=ctx.createOscillator();o3.type='triangle';o3.frequency.value=110;o3.detune.value=4;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=0.7;
    var g=ctx.createGain();g.gain.value=0.22;
    var lfo=ctx.createOscillator();lfo.frequency.value=0.05;                   // 缓慢呼吸
    var lfoG=ctx.createGain();lfoG.gain.value=180;
    lfo.connect(lfoG);lfoG.connect(lp.frequency);
    o1.connect(lp);o2.connect(lp);o3.connect(lp);lp.connect(g);out(g);
    o1.start();o2.start();o3.start();lfo.start();
    startPad();                       // 中频宏大和声铺底（体现宏伟）
    scheduleChords();scheduleBells();
  }
  // —— 中频宏大和声（庄严铺底，cathedral 感）——
  function startPad(){
    if(!ctx) return;
    var freqs=[130.81,196.00,261.63,329.63,392.00]; // C3 G3 C4 E4 G4 开放排列，宏大温暖
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    g.gain.linearRampToValueAtTime(0.16,now()+6);    // 缓慢建立
    freqs.forEach(function(f,idx){
      var o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=Math.random()*8-4;
      var o2=ctx.createOscillator();o2.type='triangle';o2.frequency.value=f;o2.detune.value=Math.random()*8-4;
      var og=ctx.createGain();og.gain.value=(idx===0?0.5:0.3);
      o.connect(og);o2.connect(og);og.connect(g);o.start();o2.start();
    });
    var lfo=ctx.createOscillator();lfo.frequency.value=0.07; // 缓慢颤动，增添流动感
    var lfoG=ctx.createGain();lfoG.gain.value=0.04;
    lfo.connect(lfoG);lfoG.connect(g.gain);lfo.start();
  }
  // —— 缓慢和弦铺陈（开放排列，宏大庄严）——
  var chords=[[130.81,196.00,261.63],[146.83,220.00,293.66],[164.81,246.94,329.63],[196.00,261.63,392.00]];
  var ci=0;
  function scheduleChords(){ (function step(){ playChord(chords[ci++%chords.length],9); setTimeout(step,9000+Math.random()*3000); })(); }
  function playChord(freqs,dur){
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    freqs.forEach(function(f){var o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=Math.random()*8-4;var og=ctx.createGain();og.gain.value=0.12;o.connect(og);og.connect(g);o.start();o.stop(now()+dur+3);});
    g.gain.linearRampToValueAtTime(0.5,now()+2.2);
    g.gain.linearRampToValueAtTime(0.0001,now()+dur);
  }
  // —— 稀疏钟琴（宏伟高音点缀）——
  var scale=[440.00,523.25,587.33,659.25,783.99];
  function scheduleBells(){ (function step(){ bell(scale[(Math.random()*scale.length)|0],0.16); setTimeout(step,6000+Math.random()*9000); })(); }
  function bell(freq,amp){
    var o=ctx.createOscillator();o.type='triangle';o.frequency.value=freq;
    var o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=freq*2.01;
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    var t=now();g.gain.exponentialRampToValueAtTime(amp,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    o.start(t);o2.start(t);o.stop(t+2.8);o2.stop(t+2.8);
  }
  function gong(freq,amp){
    var o=ctx.createOscillator();o.type='sine';o.frequency.value=freq;
    var o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=freq*1.5;
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    var t=now();g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.0001,t+3.5);
    o.start(t);o2.start(t);o.stop(t+3.6);o2.stop(t+3.6);
  }
  // —— 开场宏大涌起 ——
  function introSwell(){
    if(!ctx)return;
    var swell=[196.00,261.63,329.63,392.00]; // G3 C4 E4 G4 大三和弦，宏大涌起
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    g.gain.exponentialRampToValueAtTime(0.5,now()+3);
    g.gain.exponentialRampToValueAtTime(0.0001,now()+6);
    swell.forEach(function(f){var o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=Math.random()*8-4;var og=ctx.createGain();og.gain.value=0.18;o.connect(og);og.connect(g);o.start();o.stop(now()+6.2);});
    gong(55,0.4);
  }
  // —— 闪现：宏大温暖和弦涌起（非惊吓）——
  function sting(){
    if(!ctx||ctx.state!=='running')return;
    var rev=[261.63,329.63,392.00,523.25]; // C4 E4 G4 C5 大三和弦，宏大温暖
    var g=ctx.createGain();g.gain.value=0.0001;out(g);
    g.gain.exponentialRampToValueAtTime(0.4,now()+0.15);
    g.gain.exponentialRampToValueAtTime(0.0001,now()+1.6);
    rev.forEach(function(f){var o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=Math.random()*8-4;var og=ctx.createGain();og.gain.value=0.16;o.connect(og);og.connect(g);o.start();o.stop(now()+1.8);});
  }
  // —— 进入地图：庄严下行 ——
  function transition(){
    ensure(); if(!ctx)return;
    var o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(220,now());o.frequency.exponentialRampToValueAtTime(55,now()+1.6);
    var g=ctx.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.4,now()+0.1);g.gain.exponentialRampToValueAtTime(0.0001,now()+1.8);
    o.connect(g);out(g);o.start();o.stop(now()+1.9);
    gong(73.42,0.5); bell(1046.5,0.12);
  }
  function intro(){ ensure(); if(!ctx)return; if(!started){startBed();} introSwell(); }

  return { ensure:ensure, intro:intro, sting:sting, transition:transition };
})();

// 浏览器禁止自动播放：首次交互即启动/恢复音频
['pointerdown','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev,function(){ AmbientMusic.ensure(); },{passive:true});
});
</script>
