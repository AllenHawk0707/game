  list.push({x:HALL_RIGHT-3650, y:HALL_TOP+4,   w:44, h:40, kind:'cabinet'});
  list.push({x:HALL_RIGHT-3650, y:HALL_BOT-80,  w:30, h:50, kind:'barrel'});
  list.push({x:HALL_RIGHT-3740, y:HALL_TOP+4,   w:80, h:30, kind:'desk'});

  // ═══ 段 1~6 区间：在顶/底柜空隙中再塞 14×14 小件（增加密度）═══
  // 范围 HALL_LEFT+250(310) ~ HALL_RIGHT-3220(1040) + 段 7 之后范围也覆盖

  // ═══ 额外补丁小障碍（在原顶/底柜之间的空隙中插入）═══
  // 顶柜/底柜多在 HALL_RIGHT-4070 之前的 x 范围
  // HALL_LEFT+250 ~ HALL_RIGHT-4070 = 310 ~ 190，每 ~60px 一对小件

  // 用伪随机确定性位置（按固定步进 + 奇偶交替左右）
  var PATCH_X_START = HALL_LEFT+250;
  var PATCH_X_END = HALL_RIGHT-4070;
  // （旧的"补丁小件"循环已废弃 —— 改为"非规则封顶/封底"逻辑，见 makeMidBlocks 中的封堵段）

  // 走廊左端（尽头门附近）障碍
  list.push({x:HALL_LEFT+30,  y:HALL_TOP+4,   w:44, h:40, kind:'cabinet'});
  list.push({x:HALL_LEFT+30,  y:HALL_BOT-80,  w:30, h:50, kind:'barrel'});
  list.push({x:HALL_LEFT+120, y:HALL_TOP+4,   w:60, h:30, kind:'shelf'});
  list.push({x:HALL_LEFT+120, y:HALL_BOT-30,  w:60, h:26, kind:'desk'});

  list.push({x:HALL_LEFT+220, y:HALL_BOT-70,  w:44, h:50, kind:'cabinet'});

  // ════════════════════════════════════════════════════════════════
  // 中央阻带 v9t：一上一下交替 + 与顶/底柜相连 + 后面极限
  // ── 设计目标：一上一下障碍与顶柜/底柜接成一体(垂柱/竖柱), 玩家上下穿梭 ──
  //   步进 100→80 渐变 (t=segIdx/(N-1), 右端100 左端80)
  //   A 段(偶): 段内柱从顶柜垂下 y=214 h=46 (214~260) 连顶柜底
  //   B 段(奇): 段内柱从底柜竖起 y=270 h=54 (270~324) 连底柜顶
  //   → 上柱连顶 / 下柱连底, 一上一下交替, 玩家上下穿梭
  //   后面段(t>0.55): 再加对侧柱封中段, 且与顶/底柜相接 (极限)
  //     A 段加底柱 y=296 h=28 (296~324 连底) / B 段加顶柱 y=214 h=28 (214~242 连顶)
  //   段间挡 A: y=160~200 封顶 / B: y=300~340 封底, 紧接顶/底柜
  //   固定种子 20260709, 每次刷新布局一致; 列扫描验证 43 段全程连通
  // ════════════════════════════════════════════════════════════════
  function makeMidBlocks(){
    var list = [];
    var seed = 20260709;
    function rnd(){
      var t = (seed = (seed + 0x6D2B79F5) | 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function ri(lo, hi){ return lo + Math.floor(rnd() * (hi - lo + 1)); }
    var SEG_W = 60;
    // 先估总段数 (平均步进90)
    var testN = 0, testX = HALL_RIGHT - 180;
    while(testX > HALL_LEFT + 150){ testN++; testX -= 90; }
    var segIdx = 0, curX = HALL_RIGHT - 180;
    while(curX > HALL_LEFT + 150){
      var t = segIdx / Math.max(1, testN - 1);
      var STEP = Math.round(100 - 20 * t);   // 100 → 80 渐变
      var x = curX;
      // 顶柜 y=154 h=60 (154~214)  底柜 y=324 h=38 (324~362)
      list.push({x:x, y:154, w:SEG_W, h:60, kind:'cabinet'});
      list.push({x:x, y:324, w:SEG_W, h:38, kind:'cabinet'});
      if(segIdx % 2 === 0){
        // A 段: 段内柱从顶柜垂下 (214~260) 连顶柜底 → 与顶柜成一体
        var oxA = 6 + ri(0, 28);
        list.push({x:x+oxA, y:214, w:12, h:46, kind:'block'});
        // 后面段: 加底柱连底柜顶 (296~324) 封中段 → 顶/底柜都接上
        if(t > 0.55){
          var oxA2 = 6 + ri(0, 28);
          list.push({x:x+oxA2, y:296, w:12, h:28, kind:'block'});
        }
      } else {
        // B 段: 段内柱从底柜竖起 (270~324) 连底柜顶 → 与底柜成一体
        var oxB = 6 + ri(0, 28);
        list.push({x:x+oxB, y:270, w:12, h:54, kind:'block'});
        // 后面段: 加顶柱连顶柜底 (214~242) 封中段
        if(t > 0.55){
          var oxB2 = 6 + ri(0, 28);
          list.push({x:x+oxB2, y:214, w:12, h:28, kind:'block'});
        }
      }
      // 段间挡 A 封顶(160~200) / B 封底(300~340)
      if(segIdx % 2 === 0){
        var ysA = 160 + ri(0, 3), hsA = 40 + ri(0, 3);
        list.push({x:x+SEG_W+3, y:ysA, w:8, h:hsA, kind:'block'});
      } else {
        var ysB = 300 + ri(0, 3), hsB = 40 + ri(0, 3);
        list.push({x:x+SEG_W+3, y:ysB, w:8, h:hsB, kind:'block'});
      }
      segIdx++;
      curX -= STEP;
    }
    return list;
  }
  // 把中央阻带并入总障碍
  var midBlocks = makeMidBlocks();
  for(var mi=0; mi<midBlocks.length; mi++){
    list.push(midBlocks[mi]);
  }

  return list;
}
var obstacles = makeObstacles();

// ── 黑影追逐（A* 寻路，自动绕过障碍物）──
function buildGrid(){
  var gw=Math.ceil((HALL_RIGHT-HALL_LEFT)/CELL_SIZE);
  var gh=Math.ceil((HALL_BOT-HALL_TOP)/CELL_SIZE);
  var g=[];
  for(var gx=0;gx<gw;gx++){
    g[gx]=[];
    for(var gy=0;gy<gh;gy++){
      var cx=HALL_LEFT+gx*CELL_SIZE, cy=HALL_TOP+gy*CELL_SIZE;
      var blocked=false;
      for(var i=0;i<walls.length;i++){
        var w=walls[i];
        if(cx<w.x+w.w && cx+CELL_SIZE>w.x && cy<w.y+w.h && cy+CELL_SIZE>w.y){
          blocked=true; break;
        }
      }
      if(cx<HALL_LEFT+4 || cx+CELL_SIZE>HALL_RIGHT-4 || cy<HALL_TOP+4 || cy+CELL_SIZE>HALL_BOT-4) blocked=true;
      g[gx][gy]=blocked?1:0;
    }
  }
  return g;
}
function getGrid(){ if(!cachedGrid) cachedGrid=buildGrid(); return cachedGrid; }
function wToGrid(wx,wy){
  return {x:Math.floor((wx-HALL_LEFT)/CELL_SIZE), y:Math.floor((wy-HALL_TOP)/CELL_SIZE)};
}
function gToWorld(gx,gy){
  return {x:HALL_LEFT+gx*CELL_SIZE+CELL_SIZE/2, y:HALL_TOP+gy*CELL_SIZE+CELL_SIZE/2};
}
function heuristic(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2); }
function findPath7(fromWX,fromWY,toWX,toWY){
  var grid=getGrid();
  var gw=grid.length, gh=grid[0].length;
  var s=wToGrid(fromWX,fromWY);
  var g=wToGrid(toWX,toWY);
  s.x=Math.max(0,Math.min(gw-1,s.x)); s.y=Math.max(0,Math.min(gh-1,s.y));
  g.x=Math.max(0,Math.min(gw-1,g.x)); g.y=Math.max(0,Math.min(gh-1,g.y));
  if(s.x===g.x&&s.y===g.y) return null;
  if(grid[s.x][s.y]===1||grid[g.x][g.y]===1) return null;
  var open=[], closed={};
  var sn={x:s.x,y:s.y,g:0,h:heuristic(s.x,s.y,g.x,g.y),parent:null}; sn.f=sn.g+sn.h;
  open.push(sn);
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  var limit=800;
  while(open.length>0 && limit-- > 0){
    var best=0;
    for(var i=1;i<open.length;i++){ if(open[i].f<open[best].f) best=i; }
    var cur=open[best];
    if(cur.x===g.x&&cur.y===g.y){
      var path=[], node=cur;
      while(node){ path.unshift(gToWorld(node.x,node.y)); node=node.parent; }
      if(path.length>1) path.shift();
      return path;
    }
    open.splice(best,1); closed[cur.x+','+cur.y]=true;
    for(var d=0;d<dirs.length;d++){
      var nx=cur.x+dirs[d][0], ny=cur.y+dirs[d][1];
      if(nx<0||nx>=gw||ny<0||ny>=gh) continue;
      if(grid[nx][ny]===1) continue;
      var nk=nx+','+ny; if(closed[nk]) continue;
      var inOpen=false;
      for(var oi=0;oi<open.length;oi++){
        if(open[oi].x===nx&&open[oi].y===ny){
          inOpen=true; var ng=cur.g+1;
          if(ng<open[oi].g){ open[oi].g=ng; open[oi].f=ng+open[oi].h; open[oi].parent=cur; }
          break;
        }
      }
      if(!inOpen){ open.push({x:nx,y:ny,g:cur.g+1,h:heuristic(nx,ny,g.x,g.y),f:cur.g+1+heuristic(nx,ny,g.x,g.y),parent:cur}); }
    }
  }
  return null;
}

function drawCorruptedStudent(c, x, y, w, h, alpha){
  alpha = (alpha==null) ? 1 : alpha;
  // 走路动画相位（持续缓步移动，营造活物感）
  var walk = Date.now()*0.011;
  var bob  = Math.sin(walk)*1.6;        // 身体上下起伏
  var lurch= Math.sin(walk*0.5)*0.8;    // 身体左右轻晃
  var xb = x + lurch, yb = y + bob;
  var cx = xb + w/2, cy = yb + h*0.5;
  function col(hex,a){ if(alpha>=1) return hex; var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 'rgba('+r+','+g+','+b+','+(a*alpha)+')'; }
  // 躯干：腐烂紫红肉体 + 病态绿斑 + 腐肉红
  pxRect(xb+2, yb+5, w-4, h-5, col('#1c0b16',1));
  pxRect(xb+4, yb+8, w-8, h-10, col('#3a1226',1));
  pxRect(xb+5, yb+11, 3, 5, col('#54603a',1));
  pxRect(xb+w-7, yb+13, 3, 4, col('#6b2a2a',1));
  // 下半身：3 条腿在下方统一绘制
  // 三颗头：随身体起伏晃动 + 异色眼（红/黄/青）
  var heads=[xb+1, xb+w/2-2, xb+w-6];
  var eyeColors=['#d11010','#e8d020','#2fd6c8'];
  for(var hi=0; hi<3; hi++){
    var hx=heads[hi];
    pxRect(hx, yb-6, 5, 9, col('#39342c',1));
    pxRect(hx+1, yb-5, 3, 5, col('#4a5a3a',1));
    pxRect(hx+1, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+3, yb-5, 1, 1, eyeColors[hi]);
    pxRect(hx+2, yb-2, 1, 2, col('#7a1a1a',1));
  }
  // 下半身：3 条腿，随走路交替前后摆动（不再用放射触肢）
  var legCols=['#5a5248','#4a4038','#5a5248'];
  c.save();
  c.lineWidth=2;
  var legTop = yb + h - 2;
  var legXs = [xb+3, xb+w/2, xb+w-4];
  for(var li=0; li<3; li++){
    var sw = Math.sin(walk*0.8 + li*2.1)*2.2;   // 交替摆腿
    c.strokeStyle = col(legCols[li],1);
    c.beginPath();
    c.moveTo(legXs[li], legTop);
    c.lineTo(legXs[li]+sw, legTop+7);
    c.stroke();
    pxRect(legXs[li]+sw-2, legTop+7, 5, 1, col(legCols[li],1)); // 脚掌
  }
  c.restore();
  // 上端血盆大口（随走路张合）
  var gape = 2 + Math.abs(Math.sin(walk*0.7))*3;
  var mx = cx, my = yb - 7;
  pxRect(mx-6, my-gape, 12, gape*2+3, col('#3a0808',1));    // 大口外肉
  pxRect(mx-5, my-gape+1, 10, gape*2+1, col('#150202',1));  // 口内深渊
  for(var ti=0; ti<6; ti++){ pxRect(mx-5+ti*2, my-gape+1, 1, 2+(ti%2), col('#e8e0d0',1)); }   // 上排尖牙
  for(var tj=0; tj<6; tj++){ pxRect(mx-5+tj*2, my+gape, 1, 2+((tj+1)%2), col('#d8cfc0',1)); }  // 下排尖牙
  pxRect(mx-6, my+gape+1, 1, 4, col('#8a0d0d',1));          // 口角滴血
  pxRect(mx+5, my+gape, 1, 3, col('#8a0d0d',1));
  // 血滴（躯干，随身体）
  pxRect(xb+3, yb+h-3, 1, 3, col('#8a0d0d',1));
  pxRect(xb+w-4, yb+h-4, 1, 4, col('#8a0d0d',1));
}
function drawChaser(){
  if(!chaser) return;
  drawCorruptedStudent(ctx, chaser.x, chaser.y, chaser.w, chaser.h);
  var __cf=document.getElementById('chaser-frame'); if(__cf) __cf.style.display='none'; // 取消红框
}
function updateChaserFrame(){
  var div=document.getElementById('chaser-frame');
  if(!div) return;
  if(!chaser || caughtDeath){ div.style.display='none'; return; }
  // 计算 chaser 在 canvas 内坐标（含 CAM_ZOOM），再乘以 canvas 显示缩放因子
  var sx = ((chaser.x - 1 - camera.x) * CAM_ZOOM + W/2) * canvasScale;
  var sy = ((chaser.y - 10 - camera.y) * CAM_ZOOM + H/2) * canvasScale;
  var sw = ((chaser.w + 2) * CAM_ZOOM) * canvasScale;
  var sh = ((chaser.h + 10) * CAM_ZOOM) * canvasScale;
  // canvas 相对视口的偏移
  var rect = document.getElementById('c').getBoundingClientRect();
  var left = rect.left + sx;
  var top = rect.top + sy;
  var glow = 0.5 + 0.5*Math.sin(Date.now()*0.01);
  var alpha = 0.4 + 0.4*glow;
  div.style.display='block';
  div.style.left = left + 'px';
  div.style.top = top + 'px';
  div.style.width = sw + 'px';
  div.style.height = sh + 'px';
  div.style.border = '2px solid rgba(220,0,0,'+alpha+')';
  div.style.boxShadow = '0 0 12px rgba(220,0,0,'+(0.3+0.5*glow)+'), inset 0 0 8px rgba(220,0,0,'+(0.2+0.3*glow)+')';
}
function updateChaser(){
  if(playerDead) return;
  // 延迟生成：玩家先跑 0.5 秒，倒计时归零时在玩家当前位置生成鬼影
  if(chaserSpawnPending>0){
    chaserSpawnPending--;
    if(chaserSpawnPending===0){
      chaser = {
        x: player.x,         // 与主角相同位置
        y: player.y,
        w: 18, h: 24, vx:0, vy:0
      };
      chaserDelay = 18;     // 生成后再延迟 0.3 秒才开始追（mp5 风格）
      chaserPath = [];
      pathRecalcCounter = 0;
      cachedGrid = null;
    }
    return;
  }
  if(!chaser) return;
  if(chaserDelay>0){ chaserDelay--; return; }
  var ccx=chaser.x+chaser.w/2, ccy=chaser.y+chaser.h/2;
  var pcx=player.x+player.w/2, pcy=player.y+player.h/2;
  var dxToPlayer=pcx-ccx, dyToPlayer=pcy-ccy;
  var distPlayer=Math.sqrt(dxToPlayer*dxToPlayer+dyToPlayer*dyToPlayer);
  var minDist=80, maxDist=500;
  var minRatio=0.95, maxRatio=1.8;
  var t=Math.min(1,Math.max(0,(distPlayer-minDist)/(maxDist-minDist)));
  var ratio=minRatio+(maxRatio-minRatio)*Math.pow(t,0.5);
  var ps=player.speed*ratio;
  pathRecalcCounter--;
  if(pathRecalcCounter<=0){
    pathRecalcCounter=PATH_RECALC;
    var p=findPath7(ccx,ccy,pcx,pcy);
    if(p&&p.length>0) chaserPath=p;
  }
  if(chaserPath.length>0){
    var tgt=chaserPath[0];
    var dx=tgt.x-ccx, dy=tgt.y-ccy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<3){ chaserPath.shift(); }
    else{ chaser.x+=dx/dist*ps; chaser.y+=dy/dist*ps; }
  }else{
    // 无路径时直线逼近（无视碰撞，避免卡墙）
    var dx2=pcx-ccx, dy2=pcy-ccy;
    var dist2=Math.sqrt(dx2*dx2+dy2*dy2);
    if(dist2>0){ chaser.x+=dx2/dist2*ps; chaser.y+=dy2/dist2*ps; }
  }
  if(chaser.x<player.x+player.w && chaser.x+chaser.w>player.x &&
     chaser.y<player.y+player.h && chaser.y+chaser.h>player.y){ triggerChaserDeath(); }
}
function triggerChaserDeath(){
  if(caughtDeath) return;
  caughtDeath=true;
  caughtDeathStart=Date.now();
  playerDead=true;
  chaserSpawnPending = 0; // 取消延迟生成（如果还在倒计时）
  try{ sessionStorage.removeItem('chaseOn'); sessionStorage.removeItem('chaserRel'); }catch(e){}
  if(chaser){ chaser.x=player.x+player.w/2-chaser.w/2; chaser.y=player.y+player.h/2-chaser.h/2+8; deathChaserSnap={x:chaser.x,y:chaser.y,w:chaser.w,h:chaser.h}; }
  biteStart=Date.now(); goreSpawned=false;
  if(typeof BGM!=='undefined' && BGM.stopChase) BGM.stopChase();
  // 不再 saveCurrent（避免覆盖追逐战前的检查点存档）
  // 显示「回到上一个存档点」按钮（若有检查点）
  if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
  setTimeout(function(){
    // 有存档时不自动跳转，留在死亡画面让玩家选择回档
    if(typeof SaveSystem!=='undefined' && SaveSystem.getSaves && SaveSystem.getSaves().length>0){
      if(typeof showDeathCheckpointBtn==='function') showDeathCheckpointBtn();
    }else{
      go('start.html');
    }
  }, 4500);
}
// ── 死亡动画：黑影咬下玩家头 + 血液四溅 ──
var biteStart=0, severedHead=null, bloodParts=[], deathChaserSnap=null, goreSpawned=false;
function spawnDeathGore(){
  var hx=player.x+player.w/2, hy=player.y+3;
  severedHead={x:hx,y:hy,vx:(Math.random()-0.5)*1.6,vy:-2.2-Math.random()*1.2,rot:0,vrot:(Math.random()-0.5)*0.35};
  bloodParts=[];
  for(var bi=0;bi<48;bi++){
    var ang=Math.random()*Math.PI*2, sp=1+Math.random()*4.5;
    bloodParts.push({x:hx+(Math.random()-0.5)*5,y:hy+(Math.random()-0.5)*5,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-1.2,life:28+Math.random()*34,sz:1+Math.random()*2});
  }
}
function drawDeathAnim(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  // 阶段一：怪兽抱住玩家（收拢 + 挣扎晃动），暂不啃头
  if(el<1500){
    if(deathChaserSnap){
      var prog=el/1500;
      var shk=Math.sin(el*0.05)*2.4*(1-prog*0.55);
      var gx=deathChaserSnap.x+shk, gy=deathChaserSnap.y+Math.sin(el*0.033)*1.3;
      drawCorruptedStudent(ctx, gx, gy, deathChaserSnap.w, deathChaserSnap.h);
      // 环抱手臂横贯玩家身体，随挣扎逐渐收紧
      var ay=player.y+player.h*0.42, aw=deathChaserSnap.w+6-prog*3;
      pxRect(deathChaserSnap.x-3+shk, ay,   aw, 3, '#2e2822');
      pxRect(deathChaserSnap.x-3+shk, ay+4, aw, 2, '#241f1a');
    }
    return;
  }
  // 阶段二：啃下头（首次进入触发一次喷血）
  if(!goreSpawned){ spawnDeathGore(); goreSpawned=true; }
  if(severedHead){
    severedHead.x+=severedHead.vx; severedHead.y+=severedHead.vy;
    severedHead.vy+=0.18; severedHead.rot+=severedHead.vrot;
    if(severedHead.y>player.y+player.h+40) severedHead=null;
  }
  for(var i=bloodParts.length-1;i>=0;i--){
    var p=bloodParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if(p.life<=0) bloodParts.splice(i,1);
  }
  if(!chaser && deathChaserSnap) drawCorruptedStudent(ctx, deathChaserSnap.x, deathChaserSnap.y, deathChaserSnap.w, deathChaserSnap.h);
  if(severedHead){
    ctx.save();
    ctx.translate(severedHead.x,severedHead.y);
    ctx.rotate(severedHead.rot);
    pxRect(-3,-3,6,7,'#d9cfc4');
    pxRect(-2,-2,4,5,'#b89a86');
    pxRect(-2,-1,1,1,'#222'); pxRect(1,-1,1,1,'#222');
    pxRect(-2,2,4,1,'#5a1010');
    pxRect(-3,3,6,2,'#9a0d0d');
    ctx.restore();
  }
  for(var j=0;j<bloodParts.length;j++){
    var q=bloodParts[j];
    pxRect(q.x,q.y,q.sz,q.sz,'#a00d0d');
  }
}
function drawChaserDeath(){
  if(!caughtDeath) return;
  var el=Date.now()-biteStart;
  if(el<3000){ pxRect(0,0,W,H,'rgba(0,0,0,0.25)'); return; }
  var alpha=Math.min(1,(Date.now()-caughtDeathStart||0)/500);

}

function update(){
  if(caughtDeath || playerDead){
    // 死亡过渡由 triggerChaserDeath 内的 setTimeout 跳 start.html，这里不重复跳转
    return;
  }
  var mx=0, my=0;
  if(keys['w']||keys['arrowup']) my=-1;
  if(keys['s']||keys['arrowdown']) my=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;
  if(mx!==0&&my!==0){ mx*=0.707; my*=0.707; }
  var moving = mx!==0 || my!==0;
  if(moving){
    var nx = player.x + mx*player.speed;
    if(!collides(nx, player.y, player.w, player.h)) player.x = nx;
    var ny = player.y + my*player.speed;
    if(!collides(player.x, ny, player.w, player.h)) player.y = ny;
    if(Math.abs(mx)>Math.abs(my)){ player.facing = mx>0?3:2; }
    else if(my!==0){ player.facing = my>0?0:1; }
    player.walkTimer++;
    if(player.walkTimer>12){ player.frame=(player.frame+1)%2; player.walkTimer=0; }
  }else{
    player.frame=0; player.walkTimer=0;
  }
  // ── 交互检测（靠近左端尽头时提示）──
  interactionHint = null;
  for(var i=0; i<interactZones.length; i++){
    var z = interactZones[i];
    if(player.x < z.x+z.w && player.x+player.w > z.x &&
       player.y < z.y+z.h && player.y+player.h > z.y){
      interactionHint = z;
      break;
    }
  }
  // ── 玩家轨迹入队（陈宇复刻用）──
  // 每帧把主角当前 (x, y, facing, frame) 入队；满 N 帧后陈宇取队首 = 0.5 秒前
  playerTrail.push({x:player.x, y:player.y, facing:player.facing, frame:player.frame});
  if(playerTrail.length > CHENYU_DELAY_FRAMES){
    playerTrail.shift();   // 保持 30 帧长度（队列中存的是"前 N 帧"的快照）
  }
  // ── 陈宇：复刻主角 0.5 秒前路径 ──
  if(chenYu && chenYu.active){
    chenYu.bob = (chenYu.bob + 0.08) % (Math.PI*2);
    // 缓冲未满时陈宇站在玩家身后 18px（启动阶段）
    if(playerTrail.length < CHENYU_DELAY_FRAMES){
      // 简单相对：玩家身后 18px（按 facing 方向）
      var bx = player.x, by = player.y;
      if(player.facing===2) bx += 18;       // 面向左 → 陈宇在右后
      else if(player.facing===3) bx -= 18;  // 面向右
      else if(player.facing===0) by += 18;  // 面向下
      else if(player.facing===1) by -= 18;  // 面向上
      if(!collides(bx, by, 12, 18)){ chenYu.x = bx; chenYu.y = by; }
      chenYu.facing = player.facing; chenYu.frame = player.frame;
    } else {
      // 缓冲满：取最旧的那一帧 = 0.5 秒前主角状态, 直接复刻
      var snap = playerTrail[0];
      chenYu.x = snap.x;
      chenYu.y = snap.y;
      chenYu.facing = snap.facing;
      chenYu.frame = snap.frame;
    }
  }
  updateCamera();
  updateChaser();
  for(var i=0;i<dusts.length;i++){
    var d = dusts[i];
    d.y += d.vy;
    if(d.y < HALL_TOP+10){ d.y = HALL_BOT-20; d.x = HALL_LEFT + Math.random()*HALL_LEN; }
  }
  lampT++;
  if(tipTimer>0) tipTimer--;
  if(tipTimer<=0) tipText='';
  if(screenShake>0) screenShake--;
}

// 绘制陈宇（穿蓝白校服的小孩，12×18 像素）
function drawChenYu(px,py){
  var ox=Math.floor(px), oy=Math.floor(py + Math.sin(chenYu.bob)*0.6);
  var pw=12, ph=18, f=chenYu.facing, fr=chenYu.frame;
  // 影子
  pxRect(ox+2, oy+ph-2, 10, 2, 'rgba(0,0,0,0.5)');
  // 双腿（按 facing + frame 摆动 → 复刻主角动作）
  var legOff = fr*2;
  if(f===0){
    // 面下
    pxRect(ox+2, oy+11, 3, 5, '#333');
    pxRect(ox+7, oy+11, 3, 5, '#333');
    if(fr===0){ pxRect(ox+2, oy+13+legOff, 3, 3, '#444'); pxRect(ox+7, oy+13-legOff, 3, 3, '#444'); }
    else { pxRect(ox+2, oy+13-legOff, 3, 3, '#444'); pxRect(ox+7, oy+13+legOff, 3, 3, '#444'); }
  }else if(f===1){
    // 面上
    pxRect(ox+2, oy+11, 3, 5, '#333');
    pxRect(ox+7, oy+11, 3, 5, '#333');
  }else if(f===3){
    // 面右
    pxRect(ox+2, oy+11, 3, 5, '#333');
    pxRect(ox+7, oy+11, 3, 5, '#333');
    if(fr===0) pxRect(ox+2, oy+13+legOff, 3, 3, '#444');
    else pxRect(ox+7, oy+13+legOff, 3, 3, '#444');
  }else{
    // 面左（默认 f===2）
    pxRect(ox+2, oy+11, 3, 5, '#333');
    pxRect(ox+7, oy+11, 3, 5, '#333');
    if(fr===0) pxRect(ox+2, oy+13+legOff, 3, 3, '#444');
    else pxRect(ox+7, oy+13+legOff, 3, 3, '#444');
  }
  // 躯干（蓝白校服）
  pxRect(ox+2, oy+6, 8, 7, '#5a7aaa');
  pxRect(ox+4, oy+6, 4, 7, '#aaccee');
  // 胳膊（按 facing 朝向）
  if(f===2){ pxRect(ox+10, oy+7, 2, 4, '#5a7aaa'); }
  else if(f===3){ pxRect(ox, oy+7, 2, 4, '#5a7aaa'); }
  else { pxRect(ox, oy+7, 2, 4, '#5a7aaa'); pxRect(ox+10, oy+7, 2, 4, '#5a7aaa'); }
  // 头
  pxRect(ox+3, oy, 6, 7, '#dcc8b8');
  // 头发（深色）
  pxRect(ox+3, oy, 6, 2, '#222');
  // 眼睛（按 facing）
  if(f===2){
    pxRect(ox+3, oy+3, 1, 1, '#111');
  } else if(f===3){
    pxRect(ox+8, oy+3, 1, 1, '#111');
  } else {
    pxRect(ox+4, oy+3, 1, 1, '#111');
    pxRect(ox+7, oy+3, 1, 1, '#111');
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  var sx=screenShake>0?(Math.random()-0.5)*screenShake:0;
  var sy=screenShake>0?(Math.random()-0.5)*screenShake:0;

  ctx.save();
  ctx.translate(sx,sy);
  ctx.translate(W/2, H/2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-camera.x, -camera.y);

  // 地面
  pxRect(HALL_LEFT, HALL_TOP, HALL_LEN, HALL_BOT-HALL_TOP, P.FLOOR);

  // ── 地砖纹理（大块地砖 + 横竖缝线 + 污渍噪点）──
  var TILE_W = 40, TILE_H = 40;
  // 交替色调的地砖底色
  for(var tx=HALL_LEFT; tx<HALL_RIGHT; tx+=TILE_W){
    for(var ty=HALL_TOP; ty<HALL_BOT; ty+=TILE_H){
      var isDark = ((tx/TILE_W)+(ty/TILE_H))%2===1;
      var c = isDark ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.03)';
      pxRect(tx, ty, TILE_W, TILE_H, c);
    }
  }
  // 纵向砖缝
  ctx.globalAlpha = 0.18;
  for(var gx=HALL_LEFT; gx<HALL_RIGHT; gx+=TILE_W){
    pxRect(gx, HALL_TOP, 1, HALL_BOT-HALL_TOP, '#000');
  }
  // 横向砖缝
  for(var gy=HALL_TOP; gy<HALL_BOT; gy+=TILE_H){
    pxRect(HALL_LEFT, gy, HALL_LEN, 1, '#000');
  }
  ctx.globalAlpha = 1;
  // 随机磨损斑点（预先固定位置，避免每帧闪烁）
  if(!window._floorSpeckles){
    window._floorSpeckles = [];
    var seed = 42;
    function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for(var si=0; si<300; si++){
      window._floorSpeckles.push({
        x: HALL_LEFT + rnd()*HALL_LEN,
        y: HALL_TOP + rnd()*(HALL_BOT-HALL_TOP),
        s: 1+Math.floor(rnd()*3),
        a: 0.04 + rnd()*0.12
      });
    }
  }
  ctx.globalAlpha = 1;
  for(var si=0; si<window._floorSpeckles.length; si++){
    var sp = window._floorSpeckles[si];
    pxRect(sp.x, sp.y, sp.s, sp.s, 'rgba(0,0,0,'+sp.a+')');
  }

  // 走廊标牌
  pxText('实  验  区  ·  漫  长  走  廊', HALL_LEFT+HALL_LEN/2, HALL_TOP+10, '#3a352a', 11, 'center');
  pxText('（禁止入内）', HALL_LEFT+HALL_LEN/2, HALL_TOP+24, '#2a2620', 9, 'center');

  // 尽头门（装饰）
  dEndDoor(endDoor.x, endDoor.y, endDoor.w, endDoor.h);

  // 沿走廊布置：吊灯（每盏根据 lampT 决定亮/闪/灭）
  for(var li=0; li<lampPositions.length; li++){
    var lx = lampPositions[li];
    // 每盏灯有自己的相位：基于 li 错开
    var phase = (lampT + li*37) % 240;
    var on = phase < 180;          // 亮 180 帧
    var flicker = phase >= 170;    // 灭之前闪烁
    dCeilingLamp(lx, HALL_TOP-6, on, flicker);
  }

  // 障碍物
  for(var oi2=0; oi2<obstacles.length; oi2++){
    var ob = obstacles[oi2];
    if(ob.kind==='cabinet') dCabinet(ob.x,ob.y);
    else if(ob.kind==='shelf') dShelf(ob.x,ob.y);
    else if(ob.kind==='block') dBlock(ob.x,ob.y,ob.w,ob.h);
    else if(ob.kind==='desk') dToppledDesk(ob.x,ob.y);
    else if(ob.kind==='freezer') dFreezer(ob.x,ob.y);
    else if(ob.kind==='barrel') dBarrel(ob.x,ob.y);
    else if(ob.kind==='chair') dBrokenChair(ob.x,ob.y);
  }

  // 墙体覆盖（跳过障碍物——障碍物已用带图案的 dBlock/dCabinet 等单独绘制）
  for(var wi=0; wi<walls.length; wi++){
    var ww = walls[wi];
    if(ww.isObs) continue;
    pxRect(ww.x, ww.y, ww.w, ww.h, P.WALL3);
  }
  drawBorder(HALL_LEFT, HALL_TOP, HALL_LEN, HALL_BOT-HALL_TOP, P.WALL3, 4);

  // 灰尘粒子
  for(var di=0; di<dusts.length; di++){
    var du = dusts[di];
    pxRect(du.x, du.y, du.size, du.size, 'rgba(200,200,210,'+du.a+')');
  }

  // ── 走廊外墙体装饰（世界坐标，相机变换内画）──
  // 上下用大片墙体 + 装备满铺，确保走廊外不露灰
  (function drawWallCover(){
    // 视野世界 y 范围（包含相机上方/下方看到的世界区域）
    var viewW = W / CAM_ZOOM;
    var viewH = H / CAM_ZOOM;
    var viewX0 = camera.x - viewW/2;
    var viewX1 = camera.x + viewW/2;
    var viewY0 = camera.y - viewH/2;
    var viewY1 = camera.y + viewH/2;
    // 上方：viewY0 ~ HALL_TOP（走廊顶上方）
    // 下方：HALL_BOT ~ viewY1（走廊底下方）
    function fillStrip(yTop, yBot, seedShift){
      var yspan = yBot - yTop;
      if(yspan < 4) return;
      var rows = Math.max(1, Math.floor(yspan / 60));
      for(var r=0; r<rows; r++){
        var rowTop = yTop + (r * (yspan/rows));
        var rowBot = yTop + ((r+1) * (yspan/rows));
        var rowH = rowBot - rowTop;
        if(rowH < 8) continue;
        // 横向蛇形错位
        var xOff = (r % 2) * 60;
        var x = viewX0 - 40 - xOff;
        while(x < viewX1 + 80){
          // 确定性伪随机
          var hh = ((x * 2654435761) ^ (r * 131) ^ (seedShift * 17)) >>> 0;
          var t = hh % 7;
          var w;
          if(t===0) w = 60;
          else if(t===1) w = 80;
          else if(t===2) w = 70;
          else if(t===3) w = 100;
          else if(t===4) w = 90;
          else if(t===5) w = 110;
          else w = 70;
          var useH = Math.max(14, Math.min(rowH - 2, Math.floor(rowH * 0.92)));
          var oy;
          // 顶墙：物体贴走廊沿下沿 (即 rowBot)
          // 底墙：物体贴走廊沿上沿 (即 rowTop)
          if(seedShift === 0){
            // 顶墙：最后一行贴 rowBot
            oy = (r === rows-1) ? (rowBot - useH) : rowTop;
          } else {
            // 底墙：第一行贴 rowTop
            oy = (r === 0) ? rowTop : (rowBot - useH);
          }
          if(oy < rowTop) oy = rowTop;
          if(oy + useH > rowBot) useH = rowBot - oy;
          if(useH < 6){ x += w + 8; continue; }
          // 阴影
          pxRect(x+2, oy+2, w, useH, 'rgba(0,0,0,0.30)');
          if(t===0) dCabinet(x, oy);
          else if(t===1){
            dBarrel(x, oy + useH - 28);
            if(w > 50) dBarrel(x+30, oy + useH - 28);
          }
          else if(t===2){
            dToppledDesk(x+4, oy + useH - 8);
            if(w > 50) dBrokenChair(x + w - 24, oy + useH - 14);
          }
          else if(t===3) dShelf(x+5, oy);
          else if(t===4) dFreezer(x+5, oy);
          else if(t===5){
            pxRect(x, oy, w, useH, '#3a2e1e'); drawBorder(x, oy, w, useH, '#1a140a', 1);
            pxRect(x+3, oy+3, w-6, 2, '#5a4a30');
            var eg = (hh >>> 4) % 3;
            if(eg===0) dBarrel(x+8, oy + 2);
            else if(eg===1){ dBarrel(x+10, oy + 2); dBarrel(x+w-34, oy + 2); }
            else { pxRect(x+w/2-12, oy+4, 24, useH-10, '#2a3a3a'); drawBorder(x+w/2-12, oy+4, 24, useH-10, '#1a2424', 1); }
          }
          else dSign(x, oy, w, useH);
          x += w + 8;
        }
      }
    }
    // 1) 上墙皮：背景先刷深灰（防止物体之间有缝）
    if(viewY0 < HALL_TOP){
      var tTop = Math.max(viewY0, -1000);
      pxRect(viewX0, tTop, viewX1-viewX0, HALL_TOP-tTop, '#2a2a2a');
      fillStrip(tTop, HALL_TOP, 0);
    }
    // 2) 下墙皮
    if(viewY1 > HALL_BOT){
      var tBot = Math.min(viewY1, 2000);
      pxRect(viewX0, HALL_BOT, viewX1-viewX0, tBot-HALL_BOT, '#2a2a2a');
      fillStrip(HALL_BOT, tBot, 1);
    }
    // 3) 走廊左右端外
    if(viewX0 < HALL_LEFT){
      pxRect(viewX0, viewY0, HALL_LEFT-viewX0, viewY1-viewY0, '#2a2a2a');
    }
    if(viewX1 > HALL_RIGHT){
      pxRect(HALL_RIGHT, viewY0, viewX1-HALL_RIGHT, viewY1-viewY0, '#2a2a2a');
    }
  })();

  // 陈宇先画（被主角覆盖）→ 主角显示优先级更高
  if(chenYu && chenYu.active){
    drawChenYu(chenYu.x, chenYu.y);
  }
  // 黑影（在玩家之下绘制，方便看清黑影位置）
  drawChaser();
  drawDeathAnim();
  // 玩家（最后画，盖在陈宇和黑影上）
  drawPlayer(player.x, player.y);

  ctx.restore();

  // ── 追逐红色闪烁 ──
  if(redFlashOn && !caughtDeath && !playerDead){
    var rf=Math.sin(Date.now()*0.006)*0.12+0.2;
    pxRect(0,0,W,H,'rgba(150,0,0,'+rf+')');
  }

  // ── 死亡画面 ──
  drawChaserDeath();

  // ── 黑暗视野（屏幕层，仿 mp5：以玩家为中心的径向渐变）──
  var spx = (player.x + player.w/2 - camera.x) * CAM_ZOOM + W/2;
  var spy = (player.y + player.h/2 - camera.y) * CAM_ZOOM + H/2;
  var dg = ctx.createRadialGradient(spx, spy, 35, spx, spy, 220);
  dg.addColorStop(0, 'rgba(0,0,0,0)');
  dg.addColorStop(0.35, 'rgba(0,0,0,0.3)');
  dg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W, H);

  // HUD
  pxRect(0, H-22, W, 22, 'rgba(0,0,0,0.7)');
  pxText('WASD 移动   ESC 返回 map6', 10, H-16, P.HUD, 9);
  if(interactionHint){
    var hw = (interactionHint.label||'交互').length * 7;
    pxRect(W/2-hw/2-8, H-38, hw+16, 18, 'rgba(0,0,0,0.85)');
    pxText('[F] '+interactionHint.label, W/2, H-36, '#ffcc80', 10, 'center');
  }
  if(chenYu && chenYu.active){
    pxText('陈宇  在你身后', W/2, H-16, '#aac', 9, 'center');
  }
  pxText('走廊', W-30, H-16, P.HINT, 8, 'right');

  if(tipText){
    var tw = tipText.length*7;
    pxRect(W/2-tw/2-6, 4, tw+12, 16, 'rgba(0,0,0,0.85)');
    pxText(tipText, W/2, 7, '#aaa', 9, 'center');
  }
}

tip('推开小门，踏入漫长的走廊。尽头有一扇不打开的门。');
gameLoop = function(){ update(); render(); requestAnimationFrame(gameLoop); };
gameLoop();

})();
</script>

<script>
// map7：禁用 bgm.js 合成器，改为播放 map7.mp3
(function(){
  if(window.BGM){
    window.BGM.start = function(){
      var bgm = document.getElementById('map7-bgm');
      if(bgm && bgm.paused){ bgm.play().catch(function(){}); }
    };
    window.BGM.stop = function(){
      var bgm = document.getElementById('map7-bgm');
      if(bgm){ bgm.pause(); }
    };
    window.BGM.toggle = function(){
      var bgm = document.getElementById('map7-bgm');
      if(!bgm) return false;
      if(bgm.paused){ bgm.play().catch(function(){}); }
      else { bgm.pause(); }
      return !bgm.paused;
    };
    window.BGM.setVolume = function(v){
      var bgm = document.getElementById('map7-bgm');
      if(bgm){ bgm.volume = Math.max(0, Math.min(1, v)); }
    };
  }
  var bgm = document.getElementById('map7-bgm');
  if(bgm){
    bgm.volume = 0.6;
    bgm.play().catch(function(){
      var once = function(){
        bgm.play().catch(function(){});
        document.removeEventListener('keydown', once);
        document.removeEventListener('click', once);
      };
      document.addEventListener('keydown', once);
      document.addEventListener('click', once);
    });
  }
})();
</script>
